const STATUS_LABEL = {
  idle: '未发起', reading: '读取数据中', diagnosing: '诊断中',
  completed: '待人工确认', pending_execute: '等待人工执行',
  waiting_data: '等待数据回流', reviewed: '复盘完成',
  insufficient: '数据不足', failed: '诊断失败'
}

// ──────────────────────────────────────────────────────────────
// 根组件
// ──────────────────────────────────────────────────────────────
const App = {
  setup() {
    const drawerOpen = ref(false)
    const status = ref('idle')
    const currentProjectId = ref(null)
    const showTechnical = ref(false)
    const expandedCauseIds = ref(new Set())
    const activeRecId = ref(goldenReport.recommendations[0].id)
    const timers = []

    function clearTimers() { timers.forEach(clearTimeout); timers.length = 0 }

    function startDiagnosis(projectId) {
      clearTimers()
      currentProjectId.value = projectId
      status.value = 'reading'
      drawerOpen.value = true
      showTechnical.value = false
      expandedCauseIds.value = new Set()
      activeRecId.value = goldenReport.recommendations[0].id
      timers.push(setTimeout(() => { if (status.value === 'reading') status.value = 'diagnosing' }, 1300))
      timers.push(setTimeout(() => { if (status.value === 'diagnosing') status.value = 'completed' }, 3300))
    }
    function approve() { if (status.value === 'completed') status.value = 'pending_execute' }
    function modify() { if (status.value === 'completed') status.value = 'pending_execute' }
    function reject() { status.value = 'failed' }
    function markExecuted() { if (status.value === 'pending_execute') status.value = 'waiting_data' }
    function markReviewed() { if (status.value === 'waiting_data') status.value = 'reviewed' }
    function retry() {
      if (status.value === 'failed' || status.value === 'insufficient' || status.value === 'reviewed') {
        if (currentProjectId.value) startDiagnosis(currentProjectId.value)
      }
    }
    function closeDrawer() { drawerOpen.value = false; clearTimers() }
    function toggleCause(id) {
      const s = new Set(expandedCauseIds.value)
      s.has(id) ? s.delete(id) : s.add(id)
      expandedCauseIds.value = s
    }
    function toggleTechnical() { showTechnical.value = !showTechnical.value }

    const currentProject = computed(() => {
      const row = deliveryList.find(r => r.project.projectId === currentProjectId.value)
      return row ? row.project : deliveryList[0].project
    })
    const currentAccount = computed(() => {
      const row = deliveryList.find(r => r.project.projectId === currentProjectId.value)
      return row ? row.account : deliveryList[0].account
    })
    const activeRec = computed(() =>
      goldenReport.recommendations.find(r => r.id === activeRecId.value) || goldenReport.recommendations[0]
    )
    const abnormalCount = computed(() => deliveryList.filter(r => r.project.abnormal).length)
    const isProcessing = computed(() => status.value === 'reading' || status.value === 'diagnosing')
    const abnormalCauseCount = computed(() => goldenReport.causeTree.filter(n => n.result === 'abnormal').length)

    function fmtYuan(n) { return '¥' + n.toLocaleString('zh-CN') }
    function fmtRate(r) { return Math.round(r * 100) + '%' }
    function causeTone(node) {
      if (node.result === 'abnormal') return { dot:'bg-rose-400', text:'text-rose-500', bg:'bg-rose-50', border:'border-rose-200', label:'异常' }
      if (node.result === 'excluded') return { dot:'bg-ink-300', text:'text-ink-500', bg:'bg-ink-50', border:'border-ink-200', label:'已排除' }
      return { dot:'bg-emerald-400', text:'text-emerald-600', bg:'bg-emerald-50', border:'border-emerald-100', label:'正常' }
    }
    function impactTone(impact) {
      if (impact === 'high') return 'bg-rose-50 text-rose-500'
      if (impact === 'medium') return 'bg-amber-50 text-amber-600'
      return 'bg-ink-50 text-ink-500'
    }
    function statusBadgeClass(s) {
      const map = {
        idle: 'bg-ink-100 text-ink-600',
        reading: 'bg-sky-50 text-sky-600',
        diagnosing: 'bg-sky-50 text-sky-600',
        completed: 'bg-amber-50 text-amber-600',
        pending_execute: 'bg-amber-50 text-amber-600',
        waiting_data: 'bg-sky-50 text-sky-600',
        reviewed: 'bg-emerald-50 text-emerald-600',
        insufficient: 'bg-ink-100 text-ink-600',
        failed: 'bg-rose-50 text-rose-500'
      }
      return map[s] || 'bg-ink-100 text-ink-600'
    }

    return {
      deliveryList, goldenReport, glossary,
      drawerOpen, status, currentProjectId, currentProject, currentAccount,
      showTechnical, expandedCauseIds, activeRecId, activeRec,
      abnormalCount, isProcessing, abnormalCauseCount,
      startDiagnosis, approve, modify, reject, markExecuted, markReviewed, retry, closeDrawer,
      toggleCause, toggleTechnical,
      fmtYuan, fmtRate, causeTone, impactTone, statusBadgeClass,
      STATUS_LABEL
    }

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
        <div class="ml-2 flex items-center gap-2">
          <div class="w-7 h-7 rounded-full bg-teal-100 text-teal-700 inline-flex items-center justify-center text-xs font-medium">K</div>
          <span class="text-sm text-ink-700">Kiki</span>
        </div>
      </div>
    </nav>

    <!-- 投放列表 -->
    <main class="flex-1 min-w-0 px-8 py-6">
      <header class="mb-5">
        <nav class="flex items-center gap-1.5 text-xs text-ink-500 mb-2">
          <span>投放管理</span><span class="text-ink-300">/</span><span class="text-ink-700">投放项目列表</span>
        </nav>
        <div class="flex items-center justify-between gap-4">
          <div>
            <h1 class="text-xl font-semibold text-ink-800 tracking-tight">RTA 投放项目</h1>
            <p class="text-sm text-ink-500 mt-0.5">按项目查看日预算和实际消耗，对异常项目发起 RTA 诊断</p>
          </div>
          <div class="flex items-center gap-2 text-xs text-ink-500">
            <span class="inline-flex items-center gap-1.5">
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-rose-400"></span>异常项目<span class="num text-ink-800 font-medium">{{ abnormalCount }}</span>
            </span>
            <span class="text-ink-300">·</span>
            <span>本页共 <span class="num text-ink-800 font-medium">{{ deliveryList.length }}</span> 个项目</span>
          </div>
        </div>
      </header>

      <!-- 筛选条 -->
      <div class="bg-white rounded-lg shadow-panel border border-ink-200 mb-4">
        <div class="flex items-center gap-2 px-3 h-12">
          <div class="flex items-center gap-2 h-8 px-2.5 bg-ink-50 border border-ink-200 rounded text-sm flex-1 max-w-xs focus-within:border-teal-400 focus-within:bg-white">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-ink-400"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" placeholder="搜索项目名称 / ID" class="flex-1 bg-transparent outline-none placeholder-ink-400 text-ink-800" />
          </div>
          <button class="inline-flex items-center gap-1.5 px-3 h-8 text-sm font-medium rounded border bg-white text-ink-700 border-ink-200 hover:border-ink-300">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>筛选
          </button>
          <div class="ml-auto flex items-center gap-2 text-xs text-ink-500">
            <span>媒体：</span>
            <button class="inline-flex items-center px-3 h-8 text-sm font-medium rounded border bg-white text-ink-700 border-ink-200">巨量</button>
            <span>日期：</span>
            <button class="inline-flex items-center px-3 h-8 text-sm font-medium rounded border bg-white text-ink-700 border-ink-200"><span class="num">2026-08-14</span></button>
          </div>
        </div>
      </div>

      <!-- 列表 -->
      <div class="bg-white rounded-lg shadow-panel border border-ink-200 overflow-hidden">
        <table class="w-full table-fixed">
          <colgroup>
            <col class="w-[120px]" /><col class="w-[180px]" /><col /><col class="w-[110px]" />
            <col class="w-[100px]" /><col class="w-[100px]" /><col class="w-[180px]" /><col class="w-[110px]" /><col class="w-[140px]" />
          </colgroup>
          <thead>
            <tr>
              <th class="px-3 h-10 text-left text-xs font-medium text-ink-500 tracking-wide bg-ink-50 border-b border-ink-200">媒体</th>
              <th class="px-3 h-10 text-left text-xs font-medium text-ink-500 tracking-wide bg-ink-50 border-b border-ink-200">账户</th>
              <th class="px-3 h-10 text-left text-xs font-medium text-ink-500 tracking-wide bg-ink-50 border-b border-ink-200">项目</th>
              <th class="px-3 h-10 text-left text-xs font-medium text-ink-500 tracking-wide bg-ink-50 border-b border-ink-200">诊断日期</th>
              <th class="px-3 h-10 text-right text-xs font-medium text-ink-500 tracking-wide bg-ink-50 border-b border-ink-200">日预算</th>
              <th class="px-3 h-10 text-right text-xs font-medium text-ink-500 tracking-wide bg-ink-50 border-b border-ink-200">实际消耗</th>
              <th class="px-3 h-10 text-left text-xs font-medium text-ink-500 tracking-wide bg-ink-50 border-b border-ink-200">预算达成率</th>
              <th class="px-3 h-10 text-left text-xs font-medium text-ink-500 tracking-wide bg-ink-50 border-b border-ink-200">异常状态</th>
              <th class="px-3 h-10 text-right text-xs font-medium text-ink-500 tracking-wide bg-ink-50 border-b border-ink-200">操作</th>
            </tr>
          </thead>
          <tbody>
            <tr v-if="deliveryList.length === 0">
              <td colspan="9" class="px-3 py-16 text-center border-b border-ink-100">
                <div class="flex flex-col items-center gap-2 text-ink-400">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M3 12h6l3-9 6 18 3-9h3"/></svg>
                  <p class="text-sm">当前筛选条件下暂无投放项目</p>
                  <p class="text-xs text-ink-400">尝试调整媒体、日期或搜索关键词</p>
                </div>
              </td>
            </tr>
            <tr v-for="row in deliveryList" :key="row.project.projectId" class="hover:bg-ink-50/50 transition-colors">
              <td class="px-3 h-12 text-sm text-ink-800 border-b border-ink-100">
                <div class="flex items-center gap-1.5">
                  <span class="inline-block w-1.5 h-1.5 rounded-full" :class="row.project.abnormal ? 'bg-rose-400' : 'bg-emerald-400'"></span>
                  <span>巨量</span>
                </div>
              </td>
              <td class="px-3 h-12 text-sm border-b border-ink-100">
                <div class="flex flex-col">
                  <span class="text-ink-800 truncate">{{ row.account.name }}</span>
                  <span class="text-2xs text-ink-400 num">{{ row.account.mediaSideAccountId }}</span>
                </div>
              </td>
              <td class="px-3 h-12 text-sm border-b border-ink-100">
                <div class="flex flex-col min-w-0">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="font-medium text-ink-800 truncate">{{ row.project.name }}</span>
                    <span class="text-2xs text-ink-400 num shrink-0">{{ row.project.projectId }}</span>
                  </div>
                  <span class="text-2xs text-ink-400 mt-0.5 truncate">{{ row.project.unitSummary }}</span>
                </div>
              </td>
              <td class="px-3 h-12 text-sm border-b border-ink-100"><span class="num text-ink-700">{{ row.project.diagnoseDate }}</span></td>
              <td class="px-3 h-12 text-sm text-right border-b border-ink-100"><span class="num font-medium text-ink-800">{{ fmtYuan(row.project.dailyBudget) }}</span></td>
              <td class="px-3 h-12 text-sm text-right border-b border-ink-100"><span class="num font-medium text-ink-800">{{ fmtYuan(row.project.actualCost) }}</span></td>
              <td class="px-3 h-12 text-sm border-b border-ink-100">
                <div class="flex items-center gap-2">
                  <div class="flex-1 h-1.5 bg-ink-100 rounded-full overflow-hidden">
                    <div class="h-full rounded-full" :class="row.project.achievementRate >= 0.8 ? 'bg-emerald-400' : (row.project.achievementRate >= 0.5 ? 'bg-amber-400' : 'bg-rose-400')" :style="{ width: Math.max(2, row.project.achievementRate * 100) + '%' }"></div>
                  </div>
                  <span class="num text-xs text-ink-700 w-9 text-right">{{ fmtRate(row.project.achievementRate) }}</span>
                </div>
              </td>
              <td class="px-3 h-12 text-sm border-b border-ink-100">
                <span v-if="row.project.abnormal" class="inline-flex items-center gap-1 px-1.5 h-5 text-2xs font-medium rounded bg-rose-50 text-rose-500">
                  <span class="inline-block w-1 h-1 rounded-full bg-rose-400"></span>预算未达标
                </span>
                <span v-else class="inline-flex items-center gap-1 px-1.5 h-5 text-2xs font-medium rounded bg-emerald-50 text-emerald-500">
                  <span class="inline-block w-1 h-1 rounded-full bg-emerald-400"></span>正常
                </span>
              </td>
              <td class="px-3 h-12 text-sm text-right border-b border-ink-100">
                <div class="flex items-center justify-end gap-2">
                  <button class="inline-flex items-center px-2 h-7 text-xs text-ink-600 hover:text-ink-800 rounded">查看</button>
                  <button v-if="row.project.abnormal" @click="startDiagnosis(row.project.projectId)" class="inline-flex items-center gap-1.5 px-2.5 h-7 text-xs font-medium rounded bg-teal-600 text-white border border-teal-600 hover:bg-teal-700">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>
                    发起诊断
                  </button>
                  <button v-else @click="startDiagnosis(row.project.projectId)" class="inline-flex items-center gap-1.5 px-2.5 h-7 text-xs font-medium rounded bg-white text-ink-700 border border-ink-200 hover:border-ink-300">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>
                    复盘
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <div class="flex items-center justify-between px-3 h-10 text-xs text-ink-500 border-t border-ink-100">
          <span>仅展示选中的媒体和日期范围 · 全部数据为 Mock</span>
          <span>共 <span class="num font-medium text-ink-700">{{ deliveryList.length }}</span> 项</span>
        </div>
      </div>

      <!-- 设计要点提示（轻量信息条） -->
      <div class="mt-4 grid grid-cols-3 gap-3 text-xs">
        <div class="bg-white rounded-lg border border-ink-200 p-3">
          <p class="text-2xs text-ink-500 mb-1">本 Demo 范围</p>
          <p class="text-ink-700 leading-relaxed">单一媒体（巨量）· 1 账户 · 1 项目 · 2 单元 · 2 创意 · 1 RTAID · 1 实验 · 1 对照组 + 1 实验组</p>
        </div>
        <div class="bg-white rounded-lg border border-ink-200 p-3">
          <p class="text-2xs text-ink-500 mb-1">Golden Case</p>
          <p class="text-ink-700 leading-relaxed">日预算 ¥1000 · 实际消耗 ¥300 · 实验组门槛 40→80% · 参竞率 60→10%</p>
        </div>
        <div class="bg-white rounded-lg border border-ink-200 p-3">
          <p class="text-2xs text-ink-500 mb-1">人工边界</p>
          <p class="text-ink-700 leading-relaxed">不接真实媒体 API · 不改真实预算 / 策略 · 批准后只生成草稿</p>
        </div>
      </div>
    </main>

    <!-- 遮罩 -->
    <transition name="fade">
      <div v-if="drawerOpen" class="fixed inset-0 z-40 bg-ink-900/30 fadein" @click="closeDrawer"></div>
    </transition>

    <!-- 右侧诊断抽屉 -->
    <transition name="drawer-slide">
      <aside v-if="drawerOpen" class="fixed top-0 right-0 bottom-0 z-50 bg-white shadow-drawer flex flex-col slidein" style="width:720px" role="dialog" aria-label="RTA 诊断面板">
        <!-- 抽屉头部 -->
        <header class="px-5 py-3 border-b border-ink-200 bg-white shrink-0">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <div class="flex items-center gap-2 text-xs text-ink-500 mb-1">
                <span>巨量</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                <span>{{ currentProject.name }}</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                <span>实验组 A · 投放单元 U-T-001</span>
              </div>
              <h2 class="text-base font-semibold text-ink-800 tracking-tight flex items-center gap-2">
                <span class="inline-flex items-center justify-center w-6 h-6 rounded bg-teal-50 text-teal-600">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
                </span>
                RTA 诊断
                <span class="inline-flex items-center gap-1 px-1.5 h-5 text-2xs font-medium rounded" :class="statusBadgeClass(status)">
                  <span v-if="isProcessing" class="inline-block w-1 h-1 rounded-full bg-current spin"></span>
                  {{ STATUS_LABEL[status] }}
                </span>
              </h2>
            </div>
            <button class="inline-flex items-center justify-center w-8 h-8 rounded text-ink-500 hover:bg-ink-100" @click="closeDrawer" aria-label="关闭">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>

          <div v-if="!isProcessing && status !== 'idle' && status !== 'failed'" class="grid grid-cols-4 gap-x-3 gap-y-1.5 mt-3 px-3 py-2 bg-ink-50 rounded-md border border-ink-200">
            <div class="flex items-baseline gap-2 min-w-0"><span class="text-xs text-ink-500 shrink-0">诊断日期</span><span class="num text-sm font-medium text-ink-800">2026-08-14</span></div>
            <div class="flex items-baseline gap-2 min-w-0"><span class="text-xs text-ink-500 shrink-0">RTAID</span><span class="text-sm font-medium text-ink-800 truncate">2086（巨量）</span></div>
            <div class="flex items-baseline gap-2 min-w-0"><span class="text-xs text-ink-500 shrink-0">实验 ID</span><span class="num text-sm font-medium text-ink-800">EXP-2026-08</span></div>
            <div class="flex items-baseline gap-2 min-w-0"><span class="text-xs text-ink-500 shrink-0">活动类型</span><span class="text-sm font-medium text-ink-800">AB 实验</span></div>
          </div>
        </header>

        <!-- 读取数据中 / 诊断中 -->
        <div v-if="isProcessing" class="flex-1 flex flex-col items-center justify-center px-10 py-12 text-center">
          <div class="relative w-16 h-16 mb-5">
            <span class="absolute inset-0 rounded-full bg-sky-50"></span>
            <span class="absolute inset-2 rounded-full bg-sky-100"></span>
            <span class="absolute inset-0 rounded-full border-2 border-sky-200 border-t-sky-500 spin"></span>
            <span class="absolute inset-0 flex items-center justify-center text-sky-600">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            </span>
          </div>
          <h3 class="text-base font-semibold text-ink-800 mb-1.5">
            {{ status === 'reading' ? '正在读取策略、实验、QPS 与执行日志…' : 'Agent 正在综合多信号判断跑量根因…' }}
          </h3>
          <p class="text-sm text-ink-500 max-w-sm leading-relaxed">
            {{ status === 'reading' ? '已确认项目、媒体账户、RTAID、实验配置，正在拉取近 24 小时请求、命中、参竞和消耗数据。' : '正在交叉比对实验组 / 对照组参竞率、曝光与消耗曲线，逐步收缩可疑根因。' }}
          </p>
          <div class="w-64 mt-6">
            <div class="h-1 bg-ink-100 rounded-full overflow-hidden">
              <div class="h-full bg-sky-500 rounded-full transition-all duration-1000" :style="{ width: status === 'reading' ? '33%' : '66%' }"></div>
            </div>
            <div class="flex justify-between mt-1.5 text-2xs text-ink-400 num">
              <span>读取数据</span><span>综合诊断</span><span>输出方案</span>
            </div>
          </div>
        </div>

        <!-- 数据不足 / 失败 / 未发起 -->
        <div v-else-if="status === 'insufficient'" class="flex-1 flex flex-col items-center justify-center px-10 py-12 text-center">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-ink-300 mb-4"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <h3 class="text-base font-semibold text-ink-800 mb-2">当前数据不足以判断根因</h3>
          <p class="text-sm text-ink-500 max-w-sm mb-6 leading-relaxed">实验组近 1 小时请求量较低，且执行日志缺失；建议等待 30 分钟或补充监控后重新诊断。</p>
          <button class="inline-flex items-center gap-1.5 px-3 h-8 text-sm font-medium rounded border bg-white text-ink-700 border-ink-200 hover:border-ink-300" @click="retry">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>30 分钟后重新诊断
          </button>
        </div>

        <div v-else-if="status === 'failed'" class="flex-1 flex flex-col items-center justify-center px-10 py-12 text-center">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-rose-400 mb-4"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          <h3 class="text-base font-semibold text-ink-800 mb-2">诊断未通过</h3>
          <p class="text-sm text-ink-500 max-w-sm mb-6 leading-relaxed">方案被人工拒绝，或信号冲突；可以查看上下文或重新发起诊断。</p>
          <div class="flex items-center gap-2">
            <button class="inline-flex items-center gap-1.5 px-3 h-8 text-sm font-medium rounded border bg-white text-ink-700 border-ink-200" @click="closeDrawer">关闭</button>
            <button class="inline-flex items-center gap-1.5 px-3 h-8 text-sm font-medium rounded bg-teal-600 text-white border border-teal-600 hover:bg-teal-700" @click="retry">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>重新诊断
            </button>
          </div>
        </div>

        <div v-else-if="status === 'idle'" class="flex-1 flex flex-col items-center justify-center px-10 py-12 text-center">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-ink-300 mb-4"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
          <h3 class="text-base font-semibold text-ink-800 mb-2">诊断尚未发起</h3>
          <p class="text-sm text-ink-500 max-w-sm leading-relaxed">请回到投放列表选择项目，点击「发起诊断」开始一次新的诊断。</p>
        </div>

        <!-- 等待人工执行 -->
        <div v-else-if="status === 'pending_execute'" class="flex-1 flex items-center justify-center px-10">
          <div class="text-center max-w-md">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-500 mx-auto mb-4"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg>
            <h3 class="text-base font-semibold text-ink-800 mb-2">已生成配置草稿，等待人工执行</h3>
            <p class="text-sm text-ink-500 mb-5 leading-relaxed">本次诊断仅生成策略草稿，<strong class="text-amber-600">未修改任何真实预算或出价</strong>。请到 策略工厂 / RTA 实验 页面审批通过该变更。</p>
            <div class="rounded-md border border-ink-200 bg-ink-50 p-3 text-left mb-5">

            </section>
          </div>

          <!-- 右侧锚点导航 -->
          <nav class="w-12 shrink-0 border-l border-ink-200 bg-ink-50/40 py-5 px-2">
            <ol class="space-y-3 text-2xs text-ink-500 sticky top-0" style="writing-mode: vertical-rl;">
              <li v-for="(label, idx) in ['结论','影响','原因','时间线','原因树','方案','技术']" :key="label" class="flex items-center gap-1 hover:text-ink-800 cursor-pointer">
                <span class="num text-ink-300">{{ String(idx + 1).padStart(2, '0') }}</span>
                <span class="font-medium">{{ label }}</span>
              </li>
            </ol>
          </nav>
        </div>

        <!-- 抽屉底部 -->
        <footer v-if="['completed','pending_execute','waiting_data'].includes(status)" class="px-5 py-3 border-t border-ink-200 bg-white shrink-0 flex items-center gap-2">
          <div class="flex-1 text-xs text-ink-500">
            <template v-if="status === 'completed'">请审阅方案草稿。批准后仅生成待执行草稿，不会自动修改真实配置。</template>
            <template v-else-if="status === 'pending_execute'">等待运营人员执行配置变更。系统不会自动改写任何线上数据。</template>
            <template v-else>预期 2 小时后系统将自动拉取数据并生成复盘报告。</template>
          </div>
          <button v-if="status === 'completed'" class="inline-flex items-center gap-1.5 px-3 h-8 text-sm font-medium rounded border bg-white text-ink-700 border-ink-200 hover:border-ink-300" @click="modify">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>修改方案
          </button>
          <button v-if="status === 'completed'" class="inline-flex items-center gap-1.5 px-3 h-8 text-sm font-medium rounded border bg-white text-rose-500 border-rose-100 hover:bg-rose-50" @click="reject">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>拒绝
          </button>
          <button v-if="status === 'completed'" class="inline-flex items-center gap-1.5 px-3 h-8 text-sm font-medium rounded bg-teal-600 text-white border border-teal-600 hover:bg-teal-700" @click="approve">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>批准方案
          </button>
          <button v-if="status === 'pending_execute'" class="inline-flex items-center gap-1.5 px-3 h-8 text-sm font-medium rounded bg-teal-600 text-white border border-teal-600 hover:bg-teal-700" @click="markExecuted">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>确认已执行，等待数据回流
          </button>
          <button v-if="status === 'waiting_data'" class="inline-flex items-center gap-1.5 px-3 h-8 text-sm font-medium rounded bg-teal-600 text-white border border-teal-600 hover:bg-teal-700" @click="markReviewed">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>手动完成复盘
          </button>
        </footer>
      </aside>
    </transition>
  </div>
  `
}

createApp(App).mount('#app')
</script>

<style>
/* Spring 物理参数：smooth decel（skill motion-recipes 推荐） */
.drawer-slide-enter-active, .drawer-slide-leave-active { transition: transform .32s cubic-bezier(0.16, 1, 0.3, 1), opacity .2s ease; }
.drawer-slide-enter-from, .drawer-slide-leave-to { transform: translateX(40px); opacity: 0; }
.fade-enter-active, .fade-leave-active { transition: opacity .2s ease; }
.fade-enter-from, .fade-leave-to { opacity: 0; }
/* 无障碍：尊重 prefers-reduced-motion（skill 2.6 强制规则） */
@media (prefers-reduced-motion: reduce) {
  .drawer-slide-enter-active, .drawer-slide-leave-active,
  .fade-enter-active, .fade-leave-active { transition: none !important; }
}
</style>
</body>
</html>
