<!-- 全局错误捕获：任何 JS 错误显示在页面顶部红框，禁止白屏无反馈 -->
<div id="__errbox"></div>
<script>
  (function(){
    var box = document.getElementById('__errbox');
    function show(msg, src, line, col, err){
      if (!box) return;
      var pre = '';
      if (err && err.stack) pre = '\n' + (err.stack + '').slice(0, 800);
      box.classList.add('show');
      box.innerHTML = '<div style="font-weight:600">⛔ 页面 JS 错误（Demo v6 兜底捕获）</div>'
        + '<div style="margin-top:4px">' + (msg || '(unknown)') + '</div>'
        + (src ? '<div style="margin-top:4px;font-size:11px;color:#7f1d1d">' + src + ':' + line + ':' + col + '</div>' : '')
        + (pre ? '<pre>' + pre + '</pre>' : '');
    }
    window.addEventListener('error', function(e){
      show(e.message, e.filename, e.lineno, e.colno, e.error);
    });
    window.addEventListener('unhandledrejection', function(e){
      show('Unhandled Promise rejection: ' + (e.reason && e.reason.message || e.reason), '', 0, 0, e.reason);
    });
  })();
</script>

/* ═══════════════════════════════════════════════════════════════════════
 * 0.5 LLM_CONFIG（DeepSeek AI 层接入 · 方案 B：模板兜底 + LLM 异步叠加）
 * 安全原则（v6 final）：
 *     - 前端 NEVER 持有、读取、显示、存储或发送任何 API Key。
 *     - Key 只由 Node 代理进程 `llm-proxy.mjs` 从环境变量 `DEEPSEEK_API_KEY` 读取。
 *     - 前端 POST 到本地代理（默认 http://127.0.0.1:8787/llm，仅绑 127.0.0.1），
 *       请求体不带 Authorization 头；代理在服务端补上 Authorization 后转发 DeepSeek。
 *     - 代理未启动 / Key 未设置 → 返回 HTTP 503 + { error: 'LLM_NOT_CONFIGURED' }，
 *       前端 catch 后静默回退模板，UI 不崩。
 *     - 默认 enabled=false：演示走 buildTemplateNarrative（稳定 + 完全离线）。
 *     - LLM_CONFIG.enabled=true → 异步 fire-and-forget 调本地代理；失败一律回退模板。
 *     - 真实接入由运维 `export DEEPSEEK_API_KEY=<key>` 后启动 llm-proxy.mjs；
 *       前端代码 commit 时不应出现任何真实 Key。
 * ═══════════════════════════════════════════════════════════════════════ */
const LLM_CONFIG = {
  // 本地代理（CORS 桥 + 服务端持 Key）。仅绑 127.0.0.1，局域网不可达
  endpoint: 'http://127.0.0.1:8787/llm',
  model: 'deepseek-chat',
  timeoutMs: 10000,
  temperature: 0.4,
  enabled: false
  // 🔒 严禁在此对象加 apiKey / Authorization / token 字段。
  //    真实 Key 只存在于 llm-proxy.mjs 进程的 process.env.DEEPSEEK_API_KEY 中。
};

const MOCK_PROVIDER = PROVIDER_API && PROVIDER_API.MockMediaDataProvider
  ? new PROVIDER_API.MockMediaDataProvider(MOCK_RTA_LIST)
  : null;

function listDataRecords() {
  return MOCK_PROVIDER ? MOCK_PROVIDER.listRecords() : MOCK_RTA_LIST;
}

function getDataRecord(rtaId) {
  if (MOCK_PROVIDER) return MOCK_PROVIDER.getRecord(rtaId);
  return MOCK_RTA_LIST.find(r => r.rtaId === rtaId) || null;
}

function getProviderRecord(record) {
  return record && MOCK_PROVIDER ? (MOCK_PROVIDER.getRecord(record.rtaId) || record) : record;
}

function providerRequestFor(record) {
  return {
    rtaId: record.rtaId,
    timeRange: { start: '2026-08-14 00:00:00', end: '2026-08-14 13:30:00' },
    dataScope: 'current_rta_only'
  };
}

function getProviderEnvelope(record) {
  return record && MOCK_PROVIDER ? MOCK_PROVIDER.getDataEnvelope(providerRequestFor(record)) : null;
}

function mergeProviderEnvelopeIntoRecord(record, envelope) {
  if (!envelope) return record;
  const config = envelope.configSnapshot || {};
  const metrics = envelope.metricBundle || {};
  const budget = metrics.budget || {};
  const rta = config.rtaid || {};
  return Object.assign({}, record, {
    media: rta.media === undefined ? record.media : rta.media,
    rtaInternalId: rta.rtaInternalId || record.rtaInternalId,
    bidUrl: rta.bidUrl || record.bidUrl,
    status: rta.status || record.status,
    qpsConfig: rta.qpsConfig === undefined ? record.qpsConfig : rta.qpsConfig,
    qpsUsed: rta.qpsUsed === undefined ? record.qpsUsed : rta.qpsUsed,
    qpsRemaining: rta.qpsRemaining === undefined ? record.qpsRemaining : rta.qpsRemaining,
    boundAccounts: config.boundAccounts === undefined ? record.boundAccounts : config.boundAccounts,
    strategies: config.strategies || [], experiment: config.experiment || {},
    groups: config.groups || [], bucketMode: config.bucketMode, changes: config.changes || [],
    coreMetrics: metrics.coreMetrics || {}, usageMetrics: metrics.usageMetrics || {},
    trend: metrics.trend || [], logSummary: metrics.logSummary || {}, attribution: metrics.attribution || {},
    budget: Object.assign({}, record.budget || {}, budget),
    dailyBudget: budget.dailyBudget === undefined ? record.dailyBudget : budget.dailyBudget,
    actualCost: budget.actualCost === undefined ? record.actualCost : budget.actualCost,
    conversionCount: budget.conversionCount === undefined ? record.conversionCount : budget.conversionCount,
    actualCpa: budget.actualCpa === undefined ? record.actualCpa : budget.actualCpa,
    targetCpa: budget.targetCpa === undefined ? record.targetCpa : budget.targetCpa
  });
}

/* ═══════════════════════════════════════════════════════════════════════
 * 3. 规则引擎 D1-D14（独立函数 + signals）
 *    - D1-D13 覆盖 RTA 全链路（与 MVP 规则表 v0.1 §2 对齐）
 *    - D14 = CPA 达标判定：actualCpa > targetCpa × 1.2 → abnormal（不进 S0-S7 短路链）
 *    - 字段缺失时优雅降级（返回 normal + 证据说明）
 * ═══════════════════════════════════════════════════════════════════════ */

function safeNum(v, dflt) { return (typeof v === 'number' && isFinite(v)) ? v : dflt; }

function checkD1(r) {
  // RTAID 可用：状态=上线、BidURL 非空
  if (!r.rtaId) return { id:'D1', label:'RTAID 是否可用', result:'abnormal', confidence:99, impact:'high', evidence:'RTAID 为空', metrics:[] };
  if (r.status !== '上线') return { id:'D1', label:'RTAID 是否可用', result:'abnormal', confidence:99, impact:'high', evidence:`RTAID 状态=${r.status}，未上线`, metrics:[{ name:'状态', value:r.status }] };
  if (!r.bidUrl) return { id:'D1', label:'RTAID 是否可用', result:'abnormal', confidence:99, impact:'high', evidence:'BidURL 为空', metrics:[] };
  return { id:'D1', label:'RTAID 是否可用', result:'normal', confidence:99, impact:'high', evidence:`状态=上线，BidURL 已配置（${r.bidUrl}）`, metrics:[{ name:'状态', value:'上线' }] };
}

function checkD2(r) {
  // 媒体账户绑定
  if (safeNum(r.boundAccounts, 0) === 0) {
    return { id:'D2', label:'媒体账户是否正确绑定', result:'abnormal', confidence:99, impact:'high', evidence:'RTAID 未绑定任何媒体账户', metrics:[{ name:'绑定账户数', value:0 }] };
  }
  return { id:'D2', label:'媒体账户是否正确绑定', result:'normal', confidence:99, impact:'high', evidence:`已绑定 ${r.boundAccounts} 个媒体账户`, metrics:[{ name:'绑定账户数', value:r.boundAccounts }] };
}

function checkD3(r) {
  // QPS 容量
  const usage = safeNum(r.coreMetrics && r.coreMetrics.qpsUsageRate, 0);
  if (usage > 1.0) {
    return { id:'D3', label:'QPS 是否配置不足或已占满', result:'abnormal', confidence:95, impact:'high', evidence:`QPS 使用率 ${(usage*100).toFixed(1)}%（超限，建议扩容或降实验）`, metrics:[{ name:'使用率', value:(usage*100).toFixed(1)+'%' }] };
  }
  if (usage > 0.8) {
    return { id:'D3', label:'QPS 是否配置不足或已占满', result:'abnormal', confidence:85, impact:'medium', evidence:`QPS 使用率 ${(usage*100).toFixed(1)}%（接近 80%，黄色风险）`, metrics:[{ name:'使用率', value:(usage*100).toFixed(1)+'%' }] };
  }
  return { id:'D3', label:'QPS 是否配置不足或已占满', result:'normal', confidence:95, impact:'high', evidence:`QPS 使用率 ${(usage*100).toFixed(1)}%（< 80%，未限流）`, metrics:[{ name:'使用率', value:(usage*100).toFixed(1)+'%' }, { name:'配置/已用/剩余', value:`${r.qpsConfig} / ${r.qpsUsed} / ${r.qpsRemaining}` }] };
}

function checkD4(r) {
  // 策略状态
  const strats = Array.isArray(r.strategies) ? r.strategies : [];
  if (strats.length === 0) {
    return { id:'D4', label:'策略是否已发布并绑定当前 RTAID', result:'abnormal', confidence:99, impact:'high', evidence:'实验未引用任何策略', metrics:[] };
  }
  const bad = strats.filter(s => s.status !== '已发布');
  if (bad.length > 0) {
    return { id:'D4', label:'策略是否已发布并绑定当前 RTAID', result:'abnormal', confidence:99, impact:'high', evidence:`存在未发布策略：${bad.map(s=>s.name+'('+s.status+')').join('、')}`, metrics:[] };
  }
  return { id:'D4', label:'策略是否已发布并绑定当前 RTAID', result:'normal', confidence:99, impact:'high', evidence:`${strats.length} 条策略均已发布`, metrics:[{ name:'已发布策略数', value:strats.length }] };
}

function checkD5(r) {
  // 实验状态
  if (!r.experiment || !r.experiment.id) {
    return { id:'D5', label:'实验是否处于生效状态', result:'abnormal', confidence:99, impact:'high', evidence:'未关联任何实验', metrics:[] };
  }
  if (r.experiment.status !== '实验中') {
    return { id:'D5', label:'实验是否处于生效状态', result:'abnormal', confidence:99, impact:'high', evidence:`实验状态=${r.experiment.status}，未生效`, metrics:[{ name:'实验状态', value:r.experiment.status }] };
  }
  return { id:'D5', label:'实验是否处于生效状态', result:'normal', confidence:99, impact:'high', evidence:`实验 ${r.experiment.id} 状态=实验中`, metrics:[{ name:'实验', value:r.experiment.name }] };
}

function checkD6(r) {
  // 分桶：实验组 + 对照组
  if (!Array.isArray(r.groups) || r.groups.length < 2) {
    return { id:'D6', label:'分桶是否命中或大量进入兜底', result:'abnormal', confidence:90, impact:'high', evidence:'实验组或对照组缺失', metrics:[] };
  }
  return { id:'D6', label:'分桶是否命中或大量进入兜底', result:'normal', confidence:90, impact:'medium', evidence:`分桶方式=${r.bucketMode}，共 ${r.groups.length} 组（对照组+实验组），分桶生效`, metrics:[{ name:'分桶方式', value:r.bucketMode }] };
}

function checkD7(r) {
  // 请求量：环比变化（首尾对比，trend >= 2 即生效）
  const tr = Array.isArray(r.trend) ? r.trend : [];
  if (tr.length < 2) {
    return { id:'D7', label:'请求量是否正常', result:'normal', confidence:60, impact:'medium', evidence:'趋势数据不足（< 2），跳过环比判定', metrics:[] };
  }
  const first = safeNum(tr[0].requests, 0);
  const second = safeNum(tr[tr.length-1].requests, 0);
  if (first === 0) {
    return { id:'D7', label:'请求量是否正常', result:'normal', confidence:60, impact:'medium', evidence:'基线请求量为 0', metrics:[] };
  }
  const delta = (second - first) / first;
  if (delta < -0.5) {
    return { id:'D7', label:'请求量是否正常', result:'abnormal', confidence:88, impact:'high', evidence:`请求量从首点 ${first.toFixed(0)} 降至末点 ${second.toFixed(0)}，降幅 ${(Math.abs(delta)*100).toFixed(1)}%（> 50% 异常）`, metrics:[{ name:'首点', value:first.toFixed(0) }, { name:'末点', value:second.toFixed(0) }, { name:'变化', value:(delta*100).toFixed(1)+'%' }] };
  }
  return { id:'D7', label:'请求量是否正常', result:'normal', confidence:85, impact:'medium', evidence:`请求量环比 ${(delta*100).toFixed(1)}%（未超阈值）`, metrics:[{ name:'变化', value:(delta*100).toFixed(1)+'%' }] };
}

function checkD8(r) {
  // 命中率
  const hitRate = safeNum(r.usageMetrics && r.usageMetrics.hitRate, 0);
  if (hitRate === 0 && safeNum(r.usageMetrics && r.usageMetrics.totalRequests, 0) === 0) {
    return { id:'D8', label:'命中率是否异常偏低', result:'normal', confidence:50, impact:'medium', evidence:'无请求数据，跳过判定', metrics:[] };
  }
  if (hitRate < 0.5) {
    return { id:'D8', label:'命中率是否异常偏低', result:'abnormal', confidence:92, impact:'high', evidence:`命中率 ${(hitRate*100).toFixed(1)}%（< 50% 告警）`, metrics:[{ name:'命中率', value:(hitRate*100).toFixed(1)+'%' }, { name:'命中数/请求数', value:`${r.usageMetrics.hitCount} / ${r.usageMetrics.totalRequests}` }] };
  }
  return { id:'D8', label:'命中率是否异常偏低', result:'normal', confidence:92, impact:'medium', evidence:`命中率 ${(hitRate*100).toFixed(1)}%（≥ 50%，未超阈值）`, metrics:[{ name:'命中率', value:(hitRate*100).toFixed(1)+'%' }] };
}

function checkD9(r) {
  // 参竞率差 = 对照组 vs 实验组
  const br = r.usageMetrics && r.usageMetrics.bidRate;
  if (!br || typeof br.control !== 'number' || typeof br.treatment !== 'number') {
    return { id:'D9', label:'放行率（参竞率）是否异常偏低', result:'normal', confidence:50, impact:'medium', evidence:'分桶参竞率数据缺失，跳过判定', metrics:[] };
  }
  const diff = Math.abs(br.control - br.treatment);
  const gap = ((diff) * 100).toFixed(0);
  if (diff > 0.20) {
    return { id:'D9', label:'放行率（参竞率）是否异常偏低', result:'abnormal', confidence:92, impact:'high', evidence:`对照组 ${(br.control*100).toFixed(0)}% vs 实验组 ${(br.treatment*100).toFixed(0)}%，差 ${gap}pp（> 20pp 异常）`, metrics:[{ name:'对照组参竞率', value:(br.control*100).toFixed(0)+'%' }, { name:'实验组参竞率', value:(br.treatment*100).toFixed(0)+'%' }, { name:'差值', value:gap+'pp' }] };
  }
  return { id:'D9', label:'放行率（参竞率）是否异常偏低', result:'normal', confidence:90, impact:'high', evidence:`对照组 ${(br.control*100).toFixed(0)}% vs 实验组 ${(br.treatment*100).toFixed(0)}%，差 ${gap}pp（未超阈值）`, metrics:[{ name:'差值', value:gap+'pp' }] };
}

function checkD10(r) {
  // 执行质量
  const sr = safeNum(r.coreMetrics && r.coreMetrics.successRate, 1);
  const tr = safeNum(r.coreMetrics && r.coreMetrics.timeoutRate, 0);
  const p99 = safeNum(r.coreMetrics && r.coreMetrics.p99, 0);
  if (safeNum(r.coreMetrics && r.coreMetrics.currentQps, 0) === 0) {
    return { id:'D10', label:'执行失败率/超时率是否异常', result:'normal', confidence:50, impact:'medium', evidence:'无 QPS 数据，跳过判定', metrics:[] };
  }
  if (sr < 0.95 || tr > 0.03 || p99 > 100) {
    const reasons = [];
    if (sr < 0.95) reasons.push(`成功率 ${(sr*100).toFixed(1)}%<95%`);
    if (tr > 0.03) reasons.push(`超时率 ${(tr*100).toFixed(1)}%>3%`);
    if (p99 > 100) reasons.push(`P99 ${p99}ms>100ms`);
    return { id:'D10', label:'执行失败率/超时率是否异常', result:'abnormal', confidence:90, impact:'high', evidence:reasons.join('，'), metrics:[{ name:'成功率', value:(sr*100).toFixed(1)+'%' }, { name:'P99', value:p99+'ms' }, { name:'超时率', value:(tr*100).toFixed(1)+'%' }] };
  }
  return { id:'D10', label:'执行失败率/超时率是否异常', result:'normal', confidence:90, impact:'high', evidence:`成功率 ${(sr*100).toFixed(1)}%、超时率 ${(tr*100).toFixed(1)}%、P99 ${p99}ms（均正常）`, metrics:[{ name:'P99', value:p99+'ms' }] };
}

function checkD11(r) {
  // 出价配置
  const w = safeNum(r.usageMetrics && r.usageMetrics.avgBidWeight, 1);
  if (w < 0.2 || w > 5.0) {
    return { id:'D11', label:'出价配置是否过严', result:'abnormal', confidence:90, impact:'medium', evidence:`出价系数 ${w} 超出合法范围 0.2-5.0`, metrics:[{ name:'出价系数', value:w.toFixed(2) }] };
  }
  if (w < 0.4) {
    return { id:'D11', label:'出价配置是否过严', result:'abnormal', confidence:78, impact:'medium', evidence:`出价系数 ${w} 偏低（< 0.4），可能影响竞价竞争力`, metrics:[{ name:'出价系数', value:w.toFixed(2) }] };
  }
  return { id:'D11', label:'出价配置是否过严', result:'normal', confidence:88, impact:'medium', evidence:`出价系数 ${w} 在合法区间`, metrics:[{ name:'出价系数', value:w.toFixed(2) }] };
}

function checkD12(r) {
  // 回传归因
  const csr = safeNum(r.attribution && r.attribution.callbackSuccessRate, 1);
  if (safeNum(r.usageMetrics && r.usageMetrics.totalRequests, 0) === 0) {
    return { id:'D12', label:'转化回传/归因是否影响效果判断', result:'normal', confidence:50, impact:'low', evidence:'无请求数据，跳过判定', metrics:[] };
  }
  if (csr < 0.95) {
    return { id:'D12', label:'转化回传/归因是否影响效果判断', result:'abnormal', confidence:85, impact:'medium', evidence:`回传成功率 ${(csr*100).toFixed(1)}%（< 95%），效果判断可能失真`, metrics:[{ name:'回传成功率', value:(csr*100).toFixed(1)+'%' }] };
  }
  return { id:'D12', label:'转化回传/归因是否影响效果判断', result:'normal', confidence:90, impact:'low', evidence:`回传成功率 ${(csr*100).toFixed(1)}%（正常，效果可信度 OK）`, metrics:[{ name:'回传成功率', value:(csr*100).toFixed(1)+'%' }] };
}

function checkD13(r) {
  // 预算达成率（场景前置）
  const ar = safeNum(r.achievementRate, 0);
  if (ar < 0.6) {
    return { id:'D13', label:'预算与投放状态', result:'abnormal', confidence:99, impact:'high', evidence:`日预算 ${r.dailyBudget}，实际消耗 ${r.actualCost}，达成率 ${(ar*100).toFixed(1)}%（< 60% 未达标）`, metrics:[{ name:'日预算', value:r.dailyBudget }, { name:'实际消耗', value:r.actualCost }, { name:'达成率', value:(ar*100).toFixed(1)+'%' }] };
  }
  return { id:'D13', label:'预算与投放状态', result:'normal', confidence:99, impact:'high', evidence:`日预算 ${r.dailyBudget}，实际消耗 ${r.actualCost}，达成率 ${(ar*100).toFixed(1)}%（达标）`, metrics:[{ name:'达成率', value:(ar*100).toFixed(1)+'%' }] };
}

function checkD14(r) {
  // CPA 达标判定（不进 S0-S7 短路链）
  const ac = safeNum(r.actualCpa, -1);
  const tc = safeNum(r.targetCpa, -1);
  if (ac < 0 || tc < 0) {
    return { id:'D14', label:'CPA 达标判定', result:'normal', confidence:50, impact:'low', evidence:'CPA 字段缺失（actualCpa/targetCpa），跳过判定', metrics:[] };
  }
  const cv = safeNum(r.conversionCount, 0);
  if (cv === 0) {
    return { id:'D14', label:'CPA 达标判定', result:'normal', confidence:50, impact:'low', evidence:`转化数=0，无 CPA 数据`, metrics:[] };
  }
  if (ac > tc * 1.2) {
    return { id:'D14', label:'CPA 达标判定', result:'abnormal', confidence:90, impact:'medium', evidence:`实际 CPA ${ac.toFixed(1)} > 目标 ${tc.toFixed(1)} × 1.2 = ${(tc*1.2).toFixed(1)}（超标）`, metrics:[{ name:'实际 CPA', value:ac.toFixed(1) }, { name:'目标 CPA', value:tc.toFixed(1) }, { name:'转化数', value:cv }] };
  }
  return { id:'D14', label:'CPA 达标判定', result:'normal', confidence:90, impact:'low', evidence:`实际 CPA ${ac.toFixed(1)} ≤ 目标 ${tc.toFixed(1)} × 1.2 = ${(tc*1.2).toFixed(1)}（达标）`, metrics:[{ name:'实际 CPA', value:ac.toFixed(1) }, { name:'目标 CPA', value:tc.toFixed(1) }] };
}

const RULES = [
  { id:'D1', category:'binding', fn:checkD1 },
  { id:'D2', category:'binding', fn:checkD2 },
  { id:'D3', category:'service', fn:checkD3 },
  { id:'D4', category:'strategy', fn:checkD4 },
  { id:'D5', category:'experiment', fn:checkD5 },
  { id:'D6', category:'experiment', fn:checkD6 },
  { id:'D7', category:'traffic', fn:checkD7 },
  { id:'D8', category:'traffic', fn:checkD8 },
  { id:'D9', category:'strategy', fn:checkD9 },
  { id:'D10', category:'service', fn:checkD10 },
  { id:'D11', category:'bidding', fn:checkD11 },
  { id:'D12', category:'attribution', fn:checkD12 },
  { id:'D13', category:'budget', fn:checkD13 },
  { id:'D14', category:'budget', fn:checkD14 }
];

function runRules(record) {
  // 字段缺失优雅降级：每个规则函数内部独立 try + 字段保护
  return RULES.map(rule => {
    try {
      return rule.fn(record);
    } catch (e) {
      return { id: rule.id, label: '(规则异常)', result: 'normal', confidence: 0, impact: 'low', evidence: '规则执行异常: ' + e.message, metrics: [] };
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════════
 * 4. 场景识别 detectScenario（短路 + 现象标签叠加）
 *    - 主判定：S0>S1>S2>S3>S4>S5>S6>S7 短路
 *    - 现象标签：预算未达标 / CPA 过高 / 可安全放量（叠加）
 * ═══════════════════════════════════════════════════════════════════════ */

function detectScenario(signals, record) {
  const sigMap = {};
  signals.forEach(s => { sigMap[s.id] = s; });

  let sceneId = 'S7', sceneName = '无链路异常', confidence = 75;

  // 短路判定
  if (sigMap.D1 && sigMap.D1.result === 'abnormal') { sceneId = 'S0'; sceneName = '配置故障'; confidence = 95; }
  else if (sigMap.D2 && sigMap.D2.result === 'abnormal') { sceneId = 'S0'; sceneName = '配置故障'; confidence = 95; }
  else if (sigMap.D3 && sigMap.D3.result === 'abnormal') { sceneId = 'S0'; sceneName = '配置故障'; confidence = 90; }
  else if (sigMap.D4 && sigMap.D4.result === 'abnormal') { sceneId = 'S0'; sceneName = '配置故障'; confidence = 92; }
  else if (sigMap.D5 && sigMap.D5.result === 'abnormal') { sceneId = 'S0'; sceneName = '配置故障'; confidence = 92; }
  else if (sigMap.D7 && sigMap.D7.result === 'abnormal') { sceneId = 'S1'; sceneName = '入口流量'; confidence = 88; }
  else if (sigMap.D8 && sigMap.D8.result === 'abnormal') { sceneId = 'S2'; sceneName = '命中率下降'; confidence = 92; }
  else if (sigMap.D9 && sigMap.D9.result === 'abnormal') { sceneId = 'S3'; sceneName = '参竞/放行'; confidence = 92; }
  else if (sigMap.D11 && sigMap.D11.result === 'abnormal') { sceneId = 'S4'; sceneName = '出价/竞价'; confidence = 85; }
  else if (sigMap.D10 && sigMap.D10.result === 'abnormal') { sceneId = 'S5'; sceneName = '执行质量'; confidence = 90; }
  else if (sigMap.D12 && sigMap.D12.result === 'abnormal') { sceneId = 'S6'; sceneName = '回传/归因'; confidence = 85; }

  // 现象标签（叠加，不短路）
  const phenomenonTags = [];
  const ar = safeNum(record.achievementRate, 0);
  if (ar > 0 && ar < 0.6) {
    phenomenonTags.push({ id:'P_BUDGET', name:'预算未达标', tone:'abnormal', evidence:`达成率 ${(ar*100).toFixed(1)}% < 60%` });
  }
  const ac = safeNum(record.actualCpa, -1);
  const tc = safeNum(record.targetCpa, -1);
  const cv = safeNum(record.conversionCount, 0);
  if (ac > 0 && tc > 0 && cv > 0 && ac > tc * 1.2) {
    phenomenonTags.push({ id:'P_CPA_HIGH', name:'CPA 过高', tone:'abnormal', evidence:`实际 ${ac.toFixed(1)} > 目标 ${tc.toFixed(1)} × 1.2` });
  }
  if (ar >= 0.9 && ac > 0 && tc > 0 && cv > 0 && ac <= tc * 1.2) {
    phenomenonTags.push({ id:'P_SAFE_SCALE', name:'可安全放量', tone:'good', evidence:`达成率 ${(ar*100).toFixed(1)}% ≥ 90% 且 CPA 达标` });
  }

  return { sceneId, sceneName, phenomenonTags, confidence };
}

/* ═══════════════════════════════════════════════════════════════════════
 * 5. AI 层 runAiLayer（接口对齐《AI 层设计与评测方案》§4.1）
 *    - 纯函数：消费 causeTree + scenario + budget，输出 oneLiner/summary/causes/recommendations
 *    - 模板分派：S3 完整叙事（Golden Case）、S7 依现象标签分派、S0/S1/S2/S4/S5/S6 各有独立分支（共 6 场景完整叙事）
 *    - 末尾兜底：仅用于未匹配 sceneId 的防御，正常流程不进入
 *    - Golden Case 标准答案已对齐
 * ═══════════════════════════════════════════════════════════════════════ */

function buildCauseTree(signals) {
  // 把 D1-D14 signals 映射到 8 类 causeTree 节点（对齐契约 §3.5）
  const byCategory = {};
  signals.forEach(s => {
    const r = RULES.find(rr => rr.id === s.id);
    const cat = r ? r.category : 'budget';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(s);
  });

  const CATEGORY_LABELS = {
    budget: '预算与消耗',
    binding: 'RTAID 与账户绑定',
    traffic: '请求量与命中率',
    service: 'QPS 与执行质量',
    experiment: '实验与分桶',
    strategy: '策略与参竞',
    bidding: '出价配置',
    attribution: '回传归因'
  };
  const CATEGORY_IMPACT = { budget:'high', binding:'high', traffic:'high', service:'high', experiment:'high', strategy:'high', bidding:'medium', attribution:'low' };

  const tree = [];
  Object.keys(byCategory).forEach(cat => {
    const arr = byCategory[cat];
    const hasAbnormal = arr.some(s => s.result === 'abnormal');
    const node = {
      id: 'c-' + cat,
      category: cat,
      label: CATEGORY_LABELS[cat] || cat,
      result: hasAbnormal ? 'abnormal' : 'normal',
      confidence: hasAbnormal ? Math.max(...arr.filter(s=>s.result==='abnormal').map(s=>s.confidence)) : Math.max(...arr.map(s=>s.confidence)),
      impact: CATEGORY_IMPACT[cat] || 'medium',
      evidence: arr.map(s => `[${s.id}] ${s.evidence}`).join('；'),
      metrics: arr.reduce((m, s) => m.concat(s.metrics || []), []),
      children: arr.length > 1 ? arr.map(s => ({ label: s.label, result: s.result, note: s.evidence })) : undefined
    };
    tree.push(node);
  });
  return tree;
}

function buildTimeline(record, signals) {
  const events = [];
  // config 事件来自 changes
  if (Array.isArray(record.changes)) {
    record.changes.forEach(c => {
      events.push({ time: c.time, category: 'config', label: `${c.object} 变更（${c.field}）`, detail: `${c.before} → ${c.after}`, value: c.after });
    });
  }
  // metric 事件来自 trend 关键拐点
  if (Array.isArray(record.trend)) {
    record.trend.forEach((p, i) => {
      if (p.bidRate !== undefined && i > 0 && Math.abs(p.bidRate - record.trend[i-1].bidRate) > 0.2) {
        events.push({ time: p.time, category: 'metric', label: '实验组参竞率骤降', detail: `${(record.trend[i-1].bidRate*100).toFixed(0)}% → ${(p.bidRate*100).toFixed(0)}%`, value: '−' + ((record.trend[i-1].bidRate - p.bidRate)*100).toFixed(0) + 'pp' });
      }
      if (p.impressionChange !== undefined) {
        events.push({ time: p.time, category: 'impression', label: '曝光变化', detail: `较基线 ${(p.impressionChange*100).toFixed(0)}%`, value: (p.impressionChange*100).toFixed(0) + '%' });
      }
    });
  }
  // cost 事件
  if (Array.isArray(record.trend) && record.trend.length > 0) {
    events.push({ time: record.trend[record.trend.length-1].time, category: 'cost', label: '当前实际消耗', detail: `${record.actualCost} / ${record.dailyBudget}`, value: ((record.actualCost/record.dailyBudget)*100).toFixed(0) + '%' });
  }
  return events.sort((a, b) => a.time.localeCompare(b.time));
}

function buildTemplateNarrative(record, signals, scenario) {
  // AI 层兜底模板：消费 signals + scenario + budget，输出 AI 字段
  // 模板分派：S3 完整叙事（Golden Case）、S7 依现象标签分派、S0/S1/S2/S4/S5/S6 各有独立分支

      'QPS 使用率 4.2%，无限流记录 → 排除',
      '策略均已发布 → 排除',
      '实验运行中 → 排除',
      '分桶兜底占比正常 → 排除',
      '请求量 12480，环比未超阈值 → 排除',
      '命中率 96%，未低于 50% → 排除',
      '成功率 99.4%、P99 96ms，执行正常 → 排除',

    ];
    affectedScope = `实验组 G-TREAT-A · 5/10 分桶（约 50% 项目流量）`;

  // ── S3 通用分支（参竞/放行，跨场景模板） ──
  if (scenario.sceneId === 'S3' && d9 && d9.result === 'abnormal') {

  // ── S1 入口流量（D7 请求量骤降，媒体侧问题，不调 RTA 策略） ──

  // ── S2 命中率（D8 命中率 < 50%，策略层匹配环节） ──
  if (scenario.sceneId === 'S2' && d8 && d8.result === 'abnormal') {

  // ── S4 出价/竞价（D11 出价系数越界/偏低，竞价竞争力不足） ──
  if (scenario.sceneId === 'S4' && d11 && d11.result === 'abnormal') {

  // ── S5 执行质量（D10 服务/容量异常，优先排障，不调 RTA 策略） ──
  if (scenario.sceneId === 'S5' && d10 && d10.result === 'abnormal') {
