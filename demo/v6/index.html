<div class="min-h-screen bg-ink-50">

  <!-- 顶部：仅保留产品名称与 Demo 标识，不放任何业务导航（业务导航全部移至左侧侧边栏） -->
  <header class="app-header bg-white border-b border-ink-200 flex items-center px-5 sticky top-0 z-30">
    <div class="font-semibold text-ink-800 text-[14px] tracking-wide">GROWTHPLATFORM</div>
    <div class="ml-3 text-[12px] text-ink-500">· RTA 投放诊断 Agent</div>
    <div class="ml-auto flex items-center gap-2 text-[12px] text-ink-400">
      <span>v6 Demo · 模拟数据</span>
      <span title="服务端 Staging 只读接入准备；当前页面仍为离线 Mock/Replay Demo" class="inline-flex items-center border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[11px] font-medium text-emerald-700">V0.9.0 · 准备版已发布</span>
    </div>
  </header>

  <div class="flex">
    <!-- 左侧业务导航（侧边栏）：本 Demo 唯一的业务导航 -->
    <aside class="side-nav w-56 bg-white border-r border-ink-200 py-3 overflow-y-auto" style="font-size:13px;">
      <NavMenuItem v-for="g in navGroups" :key="g.id" :group="g" :depth="0" :selected-menu-id="selectedMenuId" @select="onMenuSelect" />
    </aside>

    <!-- 主区 -->
    <main class="main-workspace flex-1 min-w-0 p-5">

      <template v-if="currentView === 'tasks'">
      <div class="page-heading mb-4"><div class="text-[12px] text-ink-400">诊断工作台</div><h1 class="text-[20px] font-semibold text-ink-800 mt-0.5">诊断工作台 · 任务队列</h1><p class="text-[12px] text-ink-500 mt-1">数据为合成 Mock 数据</p></div>
<div class="grid grid-cols-6 gap-3 mb-4"><div v-for="item in [{key:'attention',label:'待关注'},{key:'high',label:'高优先级'},{key:'insufficient',label:'数据不足'},{key:'viewed',label:'已查看'}]" :key="item.key" class="bg-white rounded-md p-3 border border-ink-100"><div class="text-[12px] text-ink-500">{{ item.label }}</div><div class="num text-[24px] font-semibold mt-1 text-red-600">{{ p5Counts[item.key] }}</div></div><div class="bg-white rounded-md p-3 border border-ink-100"><div class="text-[12px] text-ink-500">待审批</div><div class="num text-[24px] font-semibold mt-1 text-amber-600">{{ v10.actionDraft.countByStatus().pending_approval }}</div></div><div class="bg-white rounded-md p-3 border border-ink-100"><div class="text-[12px] text-ink-500">观察中</div><div class="num text-[24px] font-semibold mt-1 text-blue-600">{{ v10.actionDraft.countByStatus().observing }}</div></div></div>
      <div class="bg-white rounded-md border border-ink-100 mb-3 px-3 flex gap-5"><button v-for="tab in p5FilterOptions" :key="tab" @click="p5Filter = tab" class="py-2.5 text-[12px] border-b-2" :class="p5Filter === tab ? 'border-brand-500 text-brand-600 font-medium' : 'border-transparent text-ink-500'">{{ tab }}</button></div>
      <div class="bg-white rounded-md border border-ink-100 overflow-hidden"><table class="w-full text-left text-[12px]"><thead class="bg-ink-50 text-ink-500"><tr><th class="px-3 py-2">优先级</th><th class="px-3 py-2">任务标题</th><th class="px-3 py-2">RTA · 媒体 · 项目</th><th class="px-3 py-2">场景</th><th class="px-3 py-2">数据质量</th><th class="px-3 py-2">状态</th><th class="px-3 py-2">发现时间</th><th class="px-3 py-2">下一步</th></tr></thead><tbody class="divide-y divide-ink-100"><tr v-for="task in p5VisibleTasks" :key="task.id" @click="onSelectTask(task)" class="hover:bg-brand-50 cursor-pointer"><td class="px-3 py-3">{{ DiagnosisTaskModel.LABELS.priority[task.priority].label }}</td><td class="px-3 py-3 font-medium text-ink-800">{{ task.title }}</td><td class="px-3 py-3">{{ task.target.rtaName }} · {{ task.target.media }} · {{ task.target.project }}</td><td class="px-3 py-3">{{ task.scene.code }} · {{ task.scene.name }}</td><td class="px-3 py-3">{{ DiagnosisTaskModel.LABELS.dataQuality[task.dataQuality.status].label }}<span v-if="task.dataQuality.missingFields.length" class="ml-1 text-amber-600">缺 {{ task.dataQuality.missingFields.length }} 字段</span></td><td class="px-3 py-3">{{ DiagnosisTaskModel.LABELS.status[task.status].label }}</td><td class="px-3 py-3">{{ task.discoveredAt }}</td><td class="px-3 py-3"><button class="text-brand-600 hover:underline" @click.stop="onSelectTask(task)">{{ task.nextAction.label }}</button></td></tr></tbody></table></div>
      </template>
      <template v-else-if="currentView === 'taskDetail'">
      <div v-if="selectedTask" class="space-y-4">
        <div class="bg-white rounded-md border border-brand-200 p-5">
          <div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-[16px] font-semibold">V1.0 治理操作</h2><p class="text-[11px] text-ink-400 mt-1">V1.0 可治理诊断闭环（Mock-Ready）· 数据均为合成 Mock，不含真实媒体写接口，人工审批为模拟流程</p></div><label class="text-[12px]">当前角色 <select v-model="currentRole" class="ml-2 border rounded px-2 py-1"><option value="observer">观察者</option><option value="optimizer">优化师</option><option value="approver">审批人</option></select></label></div>
          <div class="mt-3 flex flex-wrap gap-2"><span class="badge" :class="governanceQualityStatus === 'normal' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'">数据质量：{{ governanceDegradationLabels[governanceQualityStatus] || governanceQualityStatus }}</span><span v-if="governanceDraft" class="badge bg-brand-50 text-brand-700">流程：{{ governanceStatusLabels[governanceDraft.status] }}</span><span v-if="governanceMessage" class="text-[12px] text-amber-700">{{ governanceMessage }}</span></div>
          <div v-if="governanceIsDegraded" class="mt-3 bg-amber-50 border border-amber-200 rounded p-3 text-[12px]"><b>暂不形成确定结论</b> · {{ governanceDegradationAdvice[governanceQualityStatus] || selectedTask.nextAction.description }}</div>
          <div class="mt-4 flex flex-wrap gap-2"><button v-if="!governanceDraft && !governanceIsDegraded" @click="governanceAction('create_draft')" :disabled="!governancePermission('create_draft')" :title="governanceButtonTitle('create_draft')" class="border border-brand-300 text-brand-700 rounded px-3 py-1.5 text-[12px] disabled:opacity-40">创建处置草稿</button><button v-if="governanceDraft && !governanceDraft.diagnosisConfirmed" @click="governanceAction('confirm_diagnosis')" :disabled="!governancePermission('confirm_diagnosis')" :title="governanceButtonTitle('confirm_diagnosis')" class="border border-emerald-300 text-emerald-700 rounded px-3 py-1.5 text-[12px] disabled:opacity-40">确认诊断</button><button v-if="governanceDraft && governanceDraft.status === 'draft' && governanceDraft.diagnosisConfirmed" @click="governanceAction('submit_draft')" :disabled="!governancePermission('submit_draft')" :title="governanceButtonTitle('submit_draft')" class="bg-brand-500 text-white rounded px-3 py-1.5 text-[12px] disabled:opacity-40">提交审批</button><button v-if="governanceDraft && governanceDraft.status === 'pending_approval'" @click="governanceAction('approve')" :disabled="!governancePermission('approve')" :title="governanceButtonTitle('approve')" class="bg-emerald-600 text-white rounded px-3 py-1.5 text-[12px] disabled:opacity-40">批准</button><button v-if="governanceDraft && governanceDraft.status === 'pending_approval'" @click="governanceAction('reject')" :disabled="!governancePermission('reject')" :title="governanceButtonTitle('reject')" class="border border-orange-300 text-orange-700 rounded px-3 py-1.5 text-[12px] disabled:opacity-40">拒绝</button><button v-if="governanceDraft && governanceDraft.status === 'approved'" @click="governanceAction('record_execution')" :disabled="!governancePermission('record_execution')" :title="governanceButtonTitle('record_execution')" class="bg-brand-500 text-white rounded px-3 py-1.5 text-[12px] disabled:opacity-40">记录执行（模拟）</button><button v-if="governanceDraft && governanceDraft.status === 'execution_recorded'" @click="governanceAction('observe')" class="border rounded px-3 py-1.5 text-[12px]">观察</button><button v-if="governanceDraft && governanceDraft.status === 'observing'" @click="governanceAction('review')" class="border rounded px-3 py-1.5 text-[12px]">复盘</button><button v-if="governanceDraft && governanceDraft.status === 'reviewed'" @click="governanceAction('close')" class="border rounded px-3 py-1.5 text-[12px]">关闭</button></div>
        </div>
        <details class="bg-white rounded-md border border-ink-100 p-4"><summary class="cursor-pointer font-semibold text-[14px]">审计时间线（{{ governanceTimeline.length }}）</summary><div class="mt-3 space-y-2 text-[11px]"><div v-for="(ev,i) in governanceTimeline" :key="i" class="border-t pt-2"><span class="num text-ink-400">{{ ev.timestamp }}</span> · <b>{{ ev.action }}</b> · {{ ev.operator }} / {{ roleLabels[ev.role] || ev.role }} · {{ ev.beforeStatus || '-' }}→{{ ev.afterStatus || '-' }} <span class="badge ml-1" :class="ev.result === 'success' ? 'bg-emerald-50 text-emerald-700' : (ev.result === 'denied' ? 'bg-rose-50 text-rose-700' : 'bg-amber-50 text-amber-700')">{{ ev.result }}</span></div><div v-if="!governanceTimeline.length" class="text-ink-400">暂无治理事件</div></div></details>
        <div class="flex items-center justify-between"><button @click="goBackToTasks" class="text-[13px] text-brand-600 hover:underline">← 返回任务列表</button><span class="text-[12px] text-ink-400">任务详情 · {{ selectedTask.id }}</span></div>
        <div class="bg-white rounded-md border border-ink-100 p-4 flex flex-wrap gap-3 text-[12px]"><span class="badge bg-rose-50 text-rose-700">优先级 {{ DiagnosisTaskModel.LABELS.priority[selectedTask.priority].label }}</span><span class="badge bg-brand-50 text-brand-700">{{ selectedTask.status === 'stale' ? '数据过期' : DiagnosisTaskModel.LABELS.status[selectedTask.status].label }}</span><span>RTA · {{ selectedTask.target.media }}</span><span>发现 {{ selectedTask.discoveredAt }}</span><span>来源 {{ (selectedTask.dataQuality.source || []).join('、') }}</span><span>更新 {{ selectedTask.dataQuality.updatedAt || '当前' }}</span></div>
        <div class="bg-white rounded-md border border-ink-100 p-5"><h1 class="text-[22px] font-semibold text-ink-800">{{ selectedTask.title }}</h1><p class="mt-2 text-[13px] text-ink-600">{{ selectedTask.observation.description }}</p><div v-if="selectedTask.status !== 'insufficient'" class="mt-3 p-3 rounded bg-brand-50 text-[13px]"><b>当前判断（疑似 / 待确认）：</b>{{ selectedTask.diagnosis.conclusion }}</div></div>
        <div v-if="selectedTask.status === 'insufficient'" class="bg-amber-50 border border-amber-200 rounded-md p-5"><h2 class="text-[16px] font-semibold">当前证据不足</h2><div class="mt-3 text-[13px]">缺少字段：<span v-for="f in selectedTask.dataQuality.missingFields" :key="f" class="badge bg-white text-amber-700 mr-1">{{ f }}</span><br class="mt-2">受影响判断：{{ (selectedTask.dataQuality.affectedJudgments || []).join('、') }}<br>下一步：{{ selectedTask.nextAction.label }} · {{ selectedTask.nextAction.description }}<br><b>不生成根因结论与处置草稿（数据不足时不补全缺失事实）</b><br><span class="badge bg-ink-100 text-ink-500 mt-2">置信度：none</span></div></div>
        <div v-else class="bg-white rounded-md border border-ink-100 p-5"><h2 class="text-[16px] font-semibold">诊断推理链</h2><div class="mt-3 grid grid-cols-5 gap-2 text-[12px]"><div class="border rounded p-3"><b>① 观测</b><p>{{ selectedTask.observation.metric }}：{{ selectedTask.observation.value }}<br>{{ selectedTask.observation.description }}</p></div><div class="border rounded p-3"><b>② 规则</b><p v-for="r in selectedTask.diagnosis.matchedRules" :key="r.ruleId">{{ r.ruleId }} · {{ r.name }}<br>{{ r.explanation }}</p></div><div class="border rounded p-3"><b>③ 排除</b><p v-for="e in selectedTask.diagnosis.excludedCauses" :key="e.cause">{{ e.cause }}：{{ e.reason }}<br>证据 {{ (e.evidenceIds || []).join('、') }}</p></div><div class="border rounded p-3"><b>④ 场景</b><p>{{ selectedTask.scene.code }} · {{ selectedTask.scene.name }}</p></div><div class="border rounded p-3"><b>⑤ 判断</b><p>{{ selectedTask.diagnosis.conclusion }}</p><span class="badge bg-amber-50 text-amber-700">置信度：{{ selectedTask.diagnosis.confidence }}</span><p v-if="selectedTask.status === 'stale'" class="text-yellow-700">最近一次有效数据已超过 freshness 窗口，不能代表当前投放状态</p></div></div></div>
        <div class="bg-white rounded-md border border-ink-100 p-5"><h2 class="text-[16px] font-semibold">证据与数据质量</h2><details v-for="id in selectedTask.diagnosis.evidenceIds" :key="id" class="mt-2 border rounded p-3"><summary class="cursor-pointer">{{ id }}</summary><div class="text-[12px] mt-2">来源：{{ (selectedTask.dataQuality.source || []).join('、') }} · 更新时间：{{ selectedTask.dataQuality.updatedAt || '当前' }} · 新鲜度：{{ selectedTask.dataQuality.freshness }}<br>缺失字段：{{ (selectedTask.dataQuality.missingFields || []).join('、') || '无' }} · 受影响判断：{{ (selectedTask.dataQuality.affectedJudgments || []).join('、') || '无' }}</div></details><div class="mt-3 bg-ink-50 p-3 text-[12px]">数据质量：{{ selectedTask.dataQuality.status }} · 完整度：{{ (selectedTask.dataQuality.completeness * 100).toFixed(0) }}% · 新鲜度：{{ selectedTask.dataQuality.freshness }}<span v-if="selectedTask.dataQuality.updatedAt"> · 最后有效数据：{{ selectedTask.dataQuality.updatedAt }}</span></div></div>
        <div class="bg-white rounded-md border border-ink-100 p-4"><b>下一步动作：{{ selectedTask.nextAction.label }}</b> · {{ selectedTask.nextAction.description }}</div>
        <details class="bg-white rounded-md border border-ink-100 p-4"><summary class="cursor-pointer font-semibold">既有演示能力（诊断报告 / 人工确认）</summary><p class="mt-2 text-[11px] text-ink-400">以下为既有演示能力，P5 不包含正式审批与执行闭环（V1.0 实现）</p><button @click="openDiagnosis(selectedTask.target.rtaId)" class="mt-3 bg-white border border-brand-300 text-brand-600 px-3 py-1.5 rounded text-[13px]">打开诊断报告（演示）</button></details>
        <div class="bg-white rounded-md border border-ink-100 p-5"><h2 class="text-[16px] font-semibold">任务内语境化智能参谋</h2><div ref="taskAssistantListEl" class="h-40 overflow-auto mt-3 space-y-2 text-[12px]"><div v-for="(m,i) in currentTaskSession.messages" :key="i" :class="m.role === 'user' ? 'text-right' : ''"><span class="inline-block rounded px-3 py-2" :class="m.role === 'user' ? 'bg-brand-50' : 'bg-ink-50'">{{ m.text }}</span></div></div><div class="flex gap-2 mt-3"><input v-model="taskAssistantInput" @keyup.enter="askTaskAssistant(taskAssistantInput)" class="flex-1 border rounded px-3 py-2 text-[13px]" placeholder="围绕当前任务、证据与数据质量提问"><button @click="askTaskAssistant(taskAssistantInput)" class="bg-brand-500 text-white rounded px-4">发送</button></div><div class="mt-3 flex flex-wrap gap-2"><button v-for="q in ((selectedTask.assistantContext.suggestedQuestions || []).length ? selectedTask.assistantContext.suggestedQuestions : assistantQuestions)" :key="q" @click="askTaskAssistant(q)" class="text-[11px] text-brand-600 border rounded px-2 py-1">{{ q }}</button></div></div>
      </div><div v-else class="bg-white rounded-md p-8 text-center text-ink-500">未找到任务</div>
      </template>
      <template v-else-if="currentView === 'list'">

      <!-- 标题区 -->
      <div class="page-heading flex items-end justify-between mb-3">
        <div>
          <div class="text-[12px] text-ink-400">RTA / RTAID 配置</div>
          <h1 class="text-[20px] font-semibold text-ink-800 mt-0.5">RTAID 配置列表</h1>
          <p class="text-[12px] text-ink-500 mt-1">诊断入口为列表行级「发起诊断」按钮 · 数据为模拟数据</p>
        </div>
        <div class="flex items-center gap-2">
          <button @click="openDiagnosis(rtaList[0].rtaId, true)" title="打开数据不足状态示例" class="bg-white border border-amber-200 text-amber-700 px-3 py-1.5 rounded text-[13px] btn-tactile hover:bg-amber-50 font-medium">
            <span class="inline-flex items-center justify-center w-4 h-4 mr-1 rounded-full bg-amber-100 text-[11px]">!</span>预览数据不足
          </button>
          <button disabled title="系统配置将在后续版本开放" class="bg-ink-50 border border-ink-200 text-ink-400 px-3 py-1.5 rounded text-[13px] cursor-not-allowed">系统配置（未开放）</button>
        </div>
      </div>

      <!-- QPS tip 蓝条：四项全部走 10 个 RTAID 聚合（与下方 3 张 QPS 卡口径一致，去掉单条 30 万硬编码） -->
      <div class="tip-bar rounded-md px-4 py-2.5 mb-3 flex items-center gap-3 text-[12.5px]">
        <span class="text-brand-600 font-medium">ⓘ RTAID QPS 聚合</span>
        <span class="text-ink-700">总配置 <span class="num font-semibold">{{ qpsSummary.config.toLocaleString() }}</span></span>
        <span class="text-ink-300">·</span>
        <span class="text-ink-700">已占用 <span class="num font-semibold">{{ qpsSummary.used.toLocaleString() }}</span></span>
        <span class="text-ink-300">·</span>
        <span class="text-ink-700">剩余 <span class="num font-semibold">{{ qpsSummary.remaining.toLocaleString() }}</span></span>
        <span class="text-ink-300">·</span>
        <span class="text-ink-700">使用率 <span class="num font-semibold">{{ ((qpsSummary.used/qpsSummary.config)*100).toFixed(1) }}%</span></span>
      </div>

      <!-- 3 张 QPS 概览卡 -->
      <div class="grid grid-cols-3 gap-3 mb-4">
        <div class="qps-card bg-white rounded-md p-4">
          <div class="text-[12px] text-ink-500">总配置 QPS</div>
          <div class="num text-[24px] font-semibold text-ink-800 mt-1">{{ qpsSummary.config.toLocaleString() }}</div>
          <div class="text-[11px] text-ink-400 mt-1">10 个 RTAID 累计</div>
        </div>
        <div class="qps-card qps-card--used bg-white rounded-md p-4">
          <div class="text-[12px] text-ink-500">总实验已占用 QPS</div>
          <div class="num text-[24px] font-semibold text-ink-800 mt-1">{{ qpsSummary.used.toLocaleString() }}</div>
          <div class="text-[11px] text-ink-400 mt-1">实时聚合</div>
        </div>
        <div class="qps-card qps-card--remaining bg-white rounded-md p-4">
          <div class="text-[12px] text-ink-500">总剩余 QPS</div>
          <div class="num text-[24px] font-semibold text-ink-800 mt-1">{{ qpsSummary.remaining.toLocaleString() }}</div>
          <div class="progress-track mt-2"><div class="progress-bar bg-brand-500" :style="{ width: ((qpsSummary.remaining/qpsSummary.config)*100).toFixed(1)+'%' }"></div></div>
        </div>
      </div>

      <!-- 筛选区 -->
      <div class="filter-panel bg-white rounded-md p-3 mb-3 flex items-center gap-3 flex-wrap">
        <div class="flex items-center gap-1.5">
          <span class="text-[12px] text-ink-500">RTAID / 项目：</span>
          <input v-model="searchKw" placeholder="搜索 RTAID 或项目名" class="border border-ink-200 rounded px-2 py-1 text-[13px] w-56 focus:outline-none focus:border-brand-500" />
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-[12px] text-ink-500">媒体：</span>
          <select v-model="filterMedia" class="border border-ink-200 rounded px-2 py-1 text-[13px] focus:outline-none focus:border-brand-500">
            <option v-for="m in mediaList" :key="m" :value="m">{{ m }}</option>
          </select>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-[12px] text-ink-500">状态：</span>
          <select v-model="filterStatus" class="border border-ink-200 rounded px-2 py-1 text-[13px] focus:outline-none focus:border-brand-500">
            <option v-for="s in statusList" :key="s" :value="s">{{ s }}</option>
          </select>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-[12px] text-ink-500">异常标签：</span>
          <select v-model="filterTag" class="border border-ink-200 rounded px-2 py-1 text-[13px] focus:outline-none focus:border-brand-500">
            <option v-for="t in tagList" :key="t" :value="t">{{ t }}</option>
          </select>
        </div>
        <div class="ml-auto text-[12px] text-ink-400">共 <span class="num font-medium text-ink-700">{{ filteredList.length }}</span> 条</div>
      </div>

      <!-- 列表 -->
      <div class="table-shell bg-white rounded-md overflow-x-auto">
        <table class="compact text-[12.5px] w-full">
          <thead class="bg-ink-50 text-ink-600">
            <tr>
              <th class="px-3 py-2.5 text-left font-medium">媒体</th>
              <th class="px-3 py-2.5 text-left font-medium">RTAID</th>
              <th class="px-3 py-2.5 text-left font-medium">BidURL</th>
              <th class="px-3 py-2.5 text-left font-medium">媒体账户</th>
              <th class="px-3 py-2.5 text-left font-medium">状态</th>
              <th class="px-3 py-2.5 text-right font-medium">配置 QPS</th>
              <th class="px-3 py-2.5 text-right font-medium">绑定账号</th>
              <th class="px-3 py-2.5 text-right font-medium">关联实验</th>
              <th class="px-3 py-2.5 text-left font-medium">项目名</th>
              <th class="px-3 py-2.5 text-right font-medium">日预算</th>
              <th class="px-3 py-2.5 text-right font-medium">实际消耗</th>
              <th class="px-3 py-2.5 text-left font-medium">达成率</th>
              <th class="px-3 py-2.5 text-left font-medium">异常类型</th>
              <th class="px-3 py-2.5 text-left font-medium">操作</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="r in filteredList" :key="r.rtaId" :class="r._pre.tag.tone === 'abnormal' ? 'row-abnormal' : 'hover:bg-ink-50'">
              <td class="px-3 py-2.5 text-ink-700">{{ r.media }}</td>
              <td class="px-3 py-2.5 num text-ink-800 font-medium">{{ r.rtaId }}</td>
              <td class="px-3 py-2.5 num text-ink-400 text-[11px] max-w-[180px] truncate" :title="r.bidUrl">{{ r.bidUrl }}</td>

                <span class="badge bg-ink-100 text-ink-600 mt-0.5">已排除</span>
                <div class="text-[12px] text-ink-600 flex-1 leading-relaxed">
                  <div v-for="(e, i) in drawerReport.causes.excluded" :key="i">· {{ e }}</div>
                </div>
              </div>
            </div>
          </section>

          <!-- 04 证据时间线 -->
          <section class="border border-ink-200 rounded-md p-4">
            <div class="text-[13px] font-semibold text-ink-800 mb-2">04 · 证据时间线</div>
            <div class="space-y-1.5">
              <div v-for="(ev, i) in drawerReport.timeline" :key="i" class="flex items-start gap-2 text-[12px]">
                <span class="num text-ink-500 w-12 shrink-0">{{ ev.time }}</span>
                <span class="badge text-[10.5px]" :class="ev.category === 'config' ? 'bg-brand-50 text-brand-700' : (ev.category === 'metric' ? 'bg-amber-50 text-amber-700' : (ev.category === 'impression' ? 'bg-violet-50 text-violet-700' : 'bg-emerald-50 text-emerald-700'))">{{ ev.category }}</span>
                <div class="flex-1 text-ink-700"><span class="font-medium">{{ ev.label }}</span> <span class="text-ink-500">{{ ev.detail }}</span></div>
                <span v-if="ev.value" class="num text-ink-500 text-[11.5px]">{{ ev.value }}</span>
              </div>
            </div>
          </section>

          <!-- 05 原因树 -->
          <section class="border border-ink-200 rounded-md p-4">
            <div class="text-[13px] font-semibold text-ink-800 mb-2">05 · 原因树（8 类节点）</div>
            <div class="space-y-1.5">
              <details v-for="n in drawerReport.causeTree" :key="n.id" :open="n.result === 'abnormal'" class="bg-ink-50 rounded">
                <summary class="cursor-pointer px-3 py-2 flex items-center gap-2 text-[12.5px]">
                  <span class="badge" :class="n.result === 'abnormal' ? 'bg-rose-50 text-rose-700' : (n.result === 'excluded' ? 'bg-ink-100 text-ink-500' : 'bg-emerald-50 text-emerald-700')">
                    <span class="badge-dot" :class="n.result === 'abnormal' ? 'bg-rose-500' : (n.result === 'excluded' ? 'bg-ink-400' : 'bg-emerald-500')"></span>
                    {{ n.result }}
                  </span>
                  <span class="font-medium text-ink-800">{{ n.label }}</span>
                  <span class="ml-auto num text-[11px] text-ink-400">置信 {{ n.confidence }}% · 影响 {{ n.impact }}</span>
                </summary>
                <div class="px-3 pb-2.5 text-[12px] text-ink-700 leading-relaxed">
                  <div>{{ n.evidence }}</div>
                  <div v-if="n.metrics && n.metrics.length" class="mt-1.5 flex flex-wrap gap-1.5">
                    <span v-for="(m, mi) in n.metrics" :key="mi" class="bg-white border border-ink-200 rounded px-2 py-0.5 num text-[11px] text-ink-600">{{ m.name }}: {{ m.value }}</span>
                  </div>
                </div>
              </details>
            </div>
          </section>

          <!-- 06 建议方案 -->
          <section class="border border-ink-200 rounded-md p-4">
            <div class="text-[13px] font-semibold text-ink-800 mb-2">06 · 建议方案（人工确认后执行）</div>
            <div v-for="rec in drawerReport.recommendations" :key="rec.id" class="border border-ink-200 rounded p-3 mb-2 last:mb-0">
              <div class="text-[12.5px] font-medium text-ink-800">{{ rec.action }}</div>
              <div class="grid grid-cols-2 gap-2 mt-2 text-[12px]">
                <div class="bg-ink-50 rounded p-2"><div class="text-[10.5px] text-ink-500">调整前</div><div class="num text-ink-800 mt-0.5">{{ rec.before }}</div></div>
                <div class="bg-emerald-50 rounded p-2"><div class="text-[10.5px] text-emerald-600">调整后</div><div class="num text-emerald-800 mt-0.5 font-medium">{{ rec.after }}</div></div>
              </div>
              <div class="mt-2 text-[12px] text-ink-700"><span class="text-ink-400">影响：</span>{{ rec.impact }}</div>
              <div class="mt-2 flex flex-wrap gap-1.5">
                <span v-for="om in rec.observeMetrics" :key="om" class="badge bg-brand-50 text-brand-700">{{ om }}</span>
              </div>
              <div class="mt-2 text-[12px] text-ink-700"><span class="text-ink-400">成功标准：</span>{{ rec.successCriteria }}</div>
              <div class="mt-1 text-[12px] text-ink-700"><span class="text-ink-400">回滚条件：</span>{{ rec.rollbackCondition }}</div>
            </div>
          </section>

          <!-- 07 人工确认 + 技术详情（默认折叠） -->
          <section class="border border-ink-200 rounded-md p-4">
            <div class="flex items-center justify-between">
              <div class="text-[13px] font-semibold text-ink-800">07 · 人工确认 + 技术详情</div>
              <button @click="showTechnical = !showTechnical" class="text-[11.5px] text-brand-600 hover:underline">{{ showTechnical ? '收起' : '展开' }}</button>
            </div>
            <div v-if="showTechnical" class="mt-3 space-y-2 text-[12px] text-ink-700">
              <div class="grid grid-cols-2 gap-2">
                <div><span class="text-ink-400">RTAID：</span><span class="num">{{ drawerReport.technical.rtaId }}</span></div>
                <div><span class="text-ink-400">内部 ID：</span><span class="num">{{ drawerReport.technical.rtaInternalId }}</span></div>
                <div><span class="text-ink-400">实验 ID：</span><span class="num">{{ drawerReport.technical.experimentId }}</span></div>
                <div><span class="text-ink-400">对照组：</span><span class="num">{{ drawerReport.technical.controlGroupId }}</span></div>
                <div><span class="text-ink-400">实验组：</span><span class="num">{{ drawerReport.technical.treatmentGroupId }}</span></div>
                <div><span class="text-ink-400">分桶：</span><span class="num">{{ drawerReport.technical.bucketIds.join('、') }}</span></div>
                <div><span class="text-ink-400">请求 ID：</span><span class="num">{{ drawerReport.technical.requestId }}</span></div>
                <div><span class="text-ink-400">策略版本：</span><span class="num">{{ drawerReport.technical.policyVersion }}</span></div>
                <div class="col-span-2"><span class="text-ink-400">日志路径：</span><span class="num">{{ drawerReport.technical.logFieldPath }}</span></div>
                <div><span class="text-ink-400">配置前：</span><span class="num">{{ drawerReport.technical.configBefore }}</span></div>
                <div><span class="text-ink-400">配置后：</span><span class="num">{{ drawerReport.technical.configAfter }}</span></div>
                <div class="col-span-2"><span class="text-ink-400">数据来源：</span>{{ drawerReport.technical.dataSource }}</div>
                <div class="col-span-2"><span class="text-ink-400">数据范围：</span><span class="num">{{ drawerReport.technical.dataRange }}</span></div>
                <div class="col-span-2"><span class="text-ink-400">数据更新：</span><span class="num">{{ drawerReport.technical.dataUpdatedAt }}</span></div>
              </div>
            </div>
          </section>

          <!-- 术语对照表（折叠） -->
          <section class="border border-ink-200 rounded-md p-4">
            <div class="flex items-center justify-between">
              <div class="text-[13px] font-semibold text-ink-800">📖 术语对照表（黑话翻译）</div>
              <button @click="showTerminology = !showTerminology" class="text-[11.5px] text-brand-600 hover:underline">{{ showTerminology ? '收起' : '展开' }}</button>
            </div>
            <div v-if="showTerminology" class="mt-3 grid grid-cols-2 gap-x-4 gap-y-1.5 text-[12px]">
              <div v-for="t in TERMINOLOGY" :key="t.term" class="flex gap-2">
                <span class="text-ink-800 font-medium shrink-0">{{ t.term }}</span>
                <span class="text-ink-500">= {{ t.plain }}</span>
              </div>
            </div>
          </section>

          <div class="h-2"></div>
        </div>

        <div v-else class="px-5 py-8 text-center text-ink-400 text-[13px]">
          暂无诊断结果
        </div>
      </div>

      <!-- 底部操作区（按状态切换） -->
      <footer class="border-t border-ink-200 px-5 py-3 bg-white flex items-center gap-2">
        <div class="text-[11.5px] text-ink-500 flex-1">
          <span v-if="drawerState === 'pending'">请选择方案动作</span>
          <span v-else-if="drawerState === 'executing'">方案已确认，请人工执行后点击下一步</span>
          <span v-else-if="drawerState === 'waiting'">等待数据回流（通常 24h）</span>
          <span v-else-if="drawerState === 'reviewed'">复盘已完成，可重新诊断</span>
          <span v-else-if="drawerState === 'insufficient'">请补全数据后重新发起</span>
          <span v-else-if="drawerState === 'failed'">方案被拒绝，可重新发起诊断</span>
        </div>
        <template v-if="drawerState === 'pending'">
          <button @click="modifyPlan" class="bg-white border border-ink-200 text-ink-700 px-3 py-1.5 rounded text-[13px] btn-tactile hover:bg-ink-50">修改方案</button>
          <button @click="rejectPlan" class="bg-white border border-rose-300 text-rose-700 px-3 py-1.5 rounded text-[13px] btn-tactile hover:bg-rose-50">拒绝</button>
          <button @click="approvePlan" class="bg-brand-500 text-white px-4 py-1.5 rounded text-[13px] btn-tactile hover:bg-brand-600 font-medium">批准方案</button>
        </template>
        <template v-else-if="drawerState === 'executing'">
          <button @click="closeDrawer" class="bg-white border border-ink-200 text-ink-700 px-3 py-1.5 rounded text-[13px] btn-tactile hover:bg-ink-50">推迟</button>
          <button @click="markExecuted" class="bg-brand-500 text-white px-4 py-1.5 rounded text-[13px] btn-tactile hover:bg-brand-600 font-medium">我已执行</button>
        </template>
        <template v-else-if="drawerState === 'waiting'">
          <button @click="closeDrawer" class="bg-white border border-ink-200 text-ink-700 px-3 py-1.5 rounded text-[13px] btn-tactile hover:bg-ink-50">暂时关闭</button>
          <button @click="markReviewed" class="bg-brand-500 text-white px-4 py-1.5 rounded text-[13px] btn-tactile hover:bg-brand-600 font-medium">复盘完成</button>
        </template>
        <template v-else-if="drawerState === 'reviewed'">
          <button @click="closeDrawer" class="bg-white border border-ink-200 text-ink-700 px-3 py-1.5 rounded text-[13px] btn-tactile hover:bg-ink-50">关闭</button>
          <button @click="restartDiagnosis" class="bg-brand-500 text-white px-4 py-1.5 rounded text-[13px] btn-tactile hover:bg-brand-600 font-medium">重新诊断</button>
        </template>
        <template v-else-if="drawerState === 'insufficient'">
          <button @click="closeDrawer" class="bg-white border border-ink-200 text-ink-700 px-3 py-1.5 rounded text-[13px] btn-tactile hover:bg-ink-50">关闭</button>
          <button @click="restartDiagnosis" class="bg-brand-500 text-white px-4 py-1.5 rounded text-[13px] btn-tactile hover:bg-brand-600 font-medium">补全后重新诊断</button>
        </template>
        <template v-else-if="drawerState === 'failed'">
          <button @click="closeDrawer" class="bg-white border border-ink-200 text-ink-700 px-3 py-1.5 rounded text-[13px] btn-tactile hover:bg-ink-50">关闭</button>
          <button @click="restartDiagnosis" class="bg-brand-500 text-white px-4 py-1.5 rounded text-[13px] btn-tactile hover:bg-brand-600 font-medium">重新诊断</button>
        </template>
        <template v-else>
          <button @click="closeDrawer" class="bg-white border border-ink-200 text-ink-700 px-3 py-1.5 rounded text-[13px] btn-tactile hover:bg-ink-50">取消</button>
        </template>
      </footer>
    </aside>
  </transition>
</div>
  `
});

// ② 左侧侧边栏菜单：递归组件（Vue 3 自引用支持）
//    - selectedMenuId 由父 setup() 传入；叶子菜单点击 emit('select', group) 给父
const NavMenuItem = {
  name: 'NavMenuItem',
  props: {
    group: { type: Object, required: true },
    depth: { type: Number, default: 0 },
    selectedMenuId: { type: String, default: '' }
  },
  template: `
    <div>
      <div
        class="nav-row flex items-center pr-3 py-1.5 cursor-pointer text-[13px] select-none"
        :class="[
          isCurrent
            ? 'bg-brand-50 text-brand-600 font-medium border-l-2 border-brand-500'
            : (group.hasChildren ? 'text-ink-800 font-medium hover:bg-ink-50' : 'text-ink-600 hover:bg-ink-50')
        ]"
        :style="{ paddingLeft: (12 + (depth || 0) * 14) + 'px' }"
        @click="onClick"
      >
        <span
          v-if="group.hasChildren"
          class="w-3.5 inline-flex justify-center text-ink-400 text-[10px] transition-transform"
          :style="group.open ? 'transform: rotate(90deg)' : ''"
        >▸</span>
        <span v-else class="w-3.5 inline-block"></span>
        <span class="ml-1 leading-tight">{{ group.label }}</span>
      </div>
      <template v-if="group.open">
        <NavMenuItem
          v-for="c in (group.children || [])"
          :key="c.id"
          :group="c"
          :depth="(depth || 0) + 1"
          :selected-menu-id="selectedMenuId"
          @select="$emit('select', $event)"
        />
      </template>
    </div>
  `,
  computed: {
    isCurrent() {
      return !!this.selectedMenuId && this.group && this.group.id === this.selectedMenuId;
    }
  },
  methods: {
    onClick() {
      if (!this.group) return;
      if (this.group.hasChildren) {
        this.group.open = !this.group.open;
      } else {
        this.$emit('select', this.group);
      }
    }
  }
};
app.component('NavMenuItem', NavMenuItem);

app.mount('#app');
</script>
</body>
</html>
