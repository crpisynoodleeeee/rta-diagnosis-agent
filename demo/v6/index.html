    const tr = safeNum(record.coreMetrics && record.coreMetrics.timeoutRate, 0);
    const p99 = safeNum(record.coreMetrics && record.coreMetrics.p99, 0);
    oneLiner = `RTA 服务执行质量多项告警：成功率 ${(sr*100).toFixed(1)}%（< 95%）、超时率 ${(tr*100).toFixed(1)}%（> 3%）、P99 ${p99}ms（> 100ms），导致请求侧数据失真。这是服务/容量问题，不属于策略实验范畴。`;
    managerSummary = `项目 ${record.projectName} 当前日预算 ${record.dailyBudget} 元，消耗仅 ${record.actualCost} 元（达成率 ${(record.achievementRate*100).toFixed(0)}%）。链路体检：RTAID/绑定/QPS/策略/实验/分桶/请求量/命中率/参竞率/出价/回传均正常，但 D10（执行质量）节点命中——成功率 ${(sr*100).toFixed(1)}%、超时率 ${(tr*100).toFixed(1)}%、P99 ${p99}ms。该问题属服务/容量范畴，按"先排障后调策略"原则处理：不进入 RTA 策略实验，先排查限流/参数/模型/BidURL 服务。`;
    operationsNote = `S5 场景边界：执行质量故障是 RTA 服务自身的问题，与策略/出价/人群/创意无关。此时调整 RTA 策略无效，反而会掩盖根因。先恢复服务健康再观察链路。`;
    primary = `执行质量异常：${d10.evidence}（置信度 ${d10.confidence}%）`;
    secondary = abnormal.filter(s => s.id !== 'D10').length > 0 ? `其他异常：${abnormal.filter(s => s.id !== 'D10').map(s => s.id).join('、')}` : '无独立次因';
    excluded = signals.filter(s => s.result === 'normal').map(s => `${s.id} ${s.label}：${s.evidence.split('，')[0] || s.evidence} → 排除`);
    affectedScope = `项目 ${record.projectName} · ${record.media}（${record.rtaId}）全链路流量`;
    recommendations = [{
      id: 'rec-1',
      action: '服务排障：按失败原因枚举排查（限流/参数/模型/BidURL 服务）',
      before: `RTA 服务健康度异常：成功率 ${(sr*100).toFixed(1)}%、超时率 ${(tr*100).toFixed(1)}%、P99 ${p99}ms`,
      after: '服务恢复正常：成功率 ≥ 95%、超时率 ≤ 3%、P99 ≤ 100ms',
      impact: '服务恢复后，链路各指标自动恢复',
      observeMetrics: ['RTA 成功率', '超时率', 'P99 耗时', '失败原因分布'],
      successCriteria: '成功率 ≥ 95%、超时率 ≤ 3%、P99 ≤ 100ms（验证窗口 1h）',
      rollbackCondition: '若排障后仍未恢复，需上报 RTA 服务团队值班'
    }];
    return { oneLiner, managerSummary, operationsNote, causes: { primary, secondary, excluded }, affectedScope, recommendations };
  }

  // ── S6 回传/归因（D12 回传成功率 < 95%，先修回传，不急调 RTA） ──
  if (scenario.sceneId === 'S6' && d12 && d12.result === 'abnormal') {
    const csr = safeNum(record.attribution && record.attribution.callbackSuccessRate, 1);
    const latency = safeNum(record.attribution && record.attribution.callbackLatency, 0);
    const miss = safeNum(record.attribution && record.attribution.missingFieldRate, 0);
    oneLiner = `回传成功率 ${(csr*100).toFixed(1)}%（< 95%）、回传延迟 ${latency}ms、识别字段缺失率 ${(miss*100).toFixed(1)}%，导致转化归因数据失真、CPA 判断不可信。Agent 提示"先修回传，不要急着调 RTA"。`;
    managerSummary = `项目 ${record.projectName} 当前日预算 ${record.dailyBudget} 元，消耗 ${record.actualCost} 元（达成率 ${(record.achievementRate*100).toFixed(0)}%）。链路体检：RTAID/绑定/QPS/策略/实验/分桶/请求量/命中率/参竞/出价/执行均正常，但 D12（回传归因）异常——回传成功率 ${(csr*100).toFixed(1)}%。这意味着当前转化的归因数据可信度低，调整 RTA 策略前需先修复回传，否则可能误判方向。建议：核对回传账号/事件映射/监测链接，待回传恢复后再判断 CPA 与 ROI。`;
    operationsNote = `S6 场景边界：链路本身正常，"花出去的转化数据"不可信。这是"诊断的前置条件"问题，需先恢复数据可信度，再做策略调整。`;
    primary = `回传/归因异常：${d12.evidence}（置信度 ${d12.confidence}%）`;
    secondary = abnormal.filter(s => s.id !== 'D12').length > 0 ? `其他异常：${abnormal.filter(s => s.id !== 'D12').map(s => s.id).join('、')}` : '无独立次因';
    excluded = signals.filter(s => s.result === 'normal').map(s => `${s.id} ${s.label}：${s.evidence.split('，')[0] || s.evidence} → 排除`);
    affectedScope = `项目 ${record.projectName} · ${record.media}（${record.rtaId}）整体归因数据`;
    recommendations = [{
      id: 'rec-1',
      action: '回传通道修复：核对回传账号/事件映射/监测链接',
      before: `回传成功率 = ${(csr*100).toFixed(1)}%（< 95%），识别字段缺失率 ${(miss*100).toFixed(1)}%`,
      after: '回传成功率 ≥ 95%，识别字段缺失率 ≤ 2%',
      impact: '效果数据恢复可信度，CPA/CVR 判断基础恢复',
      observeMetrics: ['回传成功率', '回传延迟', '归因一致性', '识别字段缺失率'],
      successCriteria: '回传成功率 ≥ 95%，回传延迟 ≤ 300ms（验证窗口 24h）',
      rollbackCondition: '若修复后回传仍异常，需联系广告主侧回传团队'
    }];
    return { oneLiner, managerSummary, operationsNote, causes: { primary, secondary, excluded }, affectedScope, recommendations };
  }

  // ── 防御性兜底（仅用于未匹配 sceneId；新增场景未同步时保护，正常流程不会进入） ──
  oneLiner = `诊断场景 ${scenario.sceneId}（${scenario.sceneName}）尚未匹配叙事模板，请联系开发补全 runAiLayer。`;
  managerSummary = `链路异常：${abnormal.length > 0 ? abnormal[0].evidence : '信号缺失'}。本场景未配置独立叙事分支，属防御兜底。`;
  operationsNote = `场景识别为 ${scenario.sceneName}（置信度 ${scenario.confidence}%），未进入独立分支。`;
  primary = `${scenario.sceneId}：场景未匹配到叙事模板`;
  secondary = '无独立次因';
  excluded = signals.filter(s => s.result === 'normal').map(s => `${s.id}：${s.evidence.split('，')[0] || s.evidence} → 排除`);
  affectedScope = `项目 ${record.projectName}（${record.rtaId}）`;
  recommendations = [];
  return { oneLiner, managerSummary, operationsNote, causes: { primary, secondary, excluded }, affectedScope, recommendations };
}

/* ═══════════════════════════════════════════════════════════════════════
 * 5.5 AI 层 LLM 接入（方案 B：LLM 生成 + 模板兜底）
 *     - callLLM：调用 DeepSeek chat completions（OpenAI 兼容），含 AbortController 超时
 *     - buildPrompt：结构化事实 → 指令 + JSON 要求
 *     - validateLLMOutput：5 项校验（结构/rec 7 要素/建议值对齐/长度/边界）
 *     - runAiLayer：优先 LLM，失败回退模板；同步先返模板让 UI 立刻有结果
 *     - Golden Case 特判：与标准答案对齐，任一不符即回退模板（保证 _verify.cjs 通过）
 * ═══════════════════════════════════════════════════════════════════════ */

const GOLDEN_CASE_STD = {
  rtaId: 'juliang-rta-2086',
  primaryHint: /门槛/,
  recBeforeHint: '80%',
  recAfterHint: '60%',
  secondaryHint: '无独立次因'
};

function getRecommendedBeforeAfter(record, signals, scenario) {
  // 从 record + signals 推导规则引擎给的建议值（供 LLM 输出校验）
  // 返回 { recBefore, recAfter, recKeys: {before, after} }
  const changeRec = (record.changes || []).find(c => c.field === '准入门槛' || c.field === '出价系数' || c.field === '人群包' || c.field === '创意状态');
  const d9 = signals.find(s => s.id === 'D9');
  const d7 = signals.find(s => s.id === 'D7');
  const d11 = signals.find(s => s.id === 'D11');
  const br = record.usageMetrics && record.usageMetrics.bidRate;
  const w = safeNum(record.usageMetrics && record.usageMetrics.avgBidWeight, 1);
  const csr = safeNum(record.attribution && record.attribution.callbackSuccessRate, 1);

  let recBefore = '', recAfter = '';
  if (scenario.sceneId === 'S3' && d9 && d9.result === 'abnormal') {
    const field = changeRec ? changeRec.field : '策略参数';
    const cur = changeRec ? changeRec.after : '当前生效值';
    const curNum = changeRec ? parseFloat(cur) : NaN;
    recBefore = `${field} = ${cur}`;
    recAfter = `${field} = ${!isNaN(curNum) && curNum > 50 ? '60%' : '50%'}`;
  } else if (scenario.sceneId === 'S0') {
    recBefore = '当前配置异常'; recAfter = '修复至正常状态';
  } else if (scenario.sceneId === 'S1') {
    const cc = (record.changes || []).find(x => x.field === '创意状态' || x.field === '计划状态');
    recBefore = cc ? `${cc.object} ${cc.field} = ${cc.after}` : '媒体侧流量入口状态待核验';
    recAfter = cc ? `${cc.object} ${cc.field} = ${cc.before}` : '恢复至基线';
  } else if (scenario.sceneId === 'S2') {
    const pc = changeRec && changeRec.field === '人群包' ? changeRec : null;
    recBefore = pc ? `人群包 = ${pc.after}` : '人群包 = 当前窄人群';
    recAfter = pc ? `人群包 = ${pc.before}` : '人群包 = 回退到变更前版本';
  } else if (scenario.sceneId === 'S4' && d11 && d11.result === 'abnormal') {
    recBefore = `出价系数 = ${w.toFixed(2)}`;
    recAfter = '出价系数 = 1.0';
  } else if (scenario.sceneId === 'S5') {
    recBefore = 'RTA 服务健康度异常';
    recAfter = 'RTA 服务恢复正常（成功率 ≥ 95%）';
  } else if (scenario.sceneId === 'S6') {
    recBefore = `回传成功率 = ${(csr*100).toFixed(1)}%`;
    recAfter = '回传成功率 ≥ 95%';
  } else if (scenario.sceneId === 'S7') {
    recBefore = `日预算 = ${record.dailyBudget}`;
    recAfter = `日预算阶梯 ${(record.dailyBudget*1.2).toFixed(0)} → 1.5× → 2.0×`;
  }
  return { recBefore, recAfter };
}

function buildPrompt(record, signals, scenario) {
  // 把结构化事实 → LLM prompt（system + user）
  const abnormal = signals.filter(s => s.result === 'abnormal');
  const recommended = getRecommendedBeforeAfter(record, signals, scenario);

  const systemPrompt = `你是 RTA 广告投放诊断 Agent 的叙事生成器。输入是规则引擎输出的结构化诊断事实，请生成面向投放优化师的自然语言诊断文案。

严格要求：
1. 只基于输入事实，不编造指标、不新增原因
2. 保持因果链表述（"配置变更 → 指标变化 → 结果"），禁止"节点名+后果"语病
3. 使用业务可理解语言（术语附解释：参竞率=平台同意参与竞价的请求占比，分桶=按规则把流量分配到不同实验组，准入门槛=只有模型打分高于阈值的请求才被允许参与竞价）
4. 单主因场景必须输出"无独立次因"
5. 推荐动作的 before/after 必须使用规则引擎给出的建议值，禁止自行修改
6. 输出必须是合法 JSON 对象，字段见 user prompt 要求`;

  const userPayload = {
    scenario: { sceneId: scenario.sceneId, sceneName: scenario.sceneName, phenomenonTags: scenario.phenomenonTags },
    abnormalRules: abnormal.map(s => ({ id: s.id, label: s.label, evidence: s.evidence, confidence: s.confidence, impact: s.impact })),
    keyMetrics: {
      dailyBudget: record.dailyBudget,
      actualCost: record.actualCost,
      achievementRate: record.achievementRate,
      bidRate: record.usageMetrics && record.usageMetrics.bidRate,
      hitRate: record.usageMetrics && record.usageMetrics.hitRate,
      actualCpa: record.actualCpa,
      targetCpa: record.targetCpa
    },
    configChanges: record.changes || [],
    recommended
  };

  const userPrompt = `输入（JSON）：
${JSON.stringify(userPayload, null, 2)}

请输出 JSON（严格遵守字段名，不要多加字段）：
{
  "oneLiner": "一句话因果链结论（≥ 40 字，包含'配置变更→指标变化→结果'的方向）",
  "managerSummary": "管理摘要（问题/影响/建议三要素，30 秒可读，150-300 字）",
  "operationsNote": "运营解释（主因说明 + 次因/联动 + 下一步操作，80-200 字）",
  "recommendations": [
    {
      "action": "具体动作描述",
      "before": "调整前配置（关键数值必须等于 ${recommended.recBefore}）",
      "after": "调整后配置（关键数值必须等于 ${recommended.recAfter}）",
      "impact": "影响范围",
      "observeMetrics": ["观察指标 1", "观察指标 2"],
      "successCriteria": "成功标准（含时间窗与数值阈值）",
      "rollbackCondition": "回滚条件（含触发阈值）"
    }
  ]
}

仅返回合法 JSON，不要 Markdown 包裹，不要解释。`;

  return { systemPrompt, userPrompt };
}

function validateLLMOutput(output, record, signals, scenario, recommended) {
  // 输出校验：5 项（任一不通过 → 回退模板）
  if (!output || typeof output !== 'object') return { ok: false, reason: 'not_object' };
  const required = ['oneLiner', 'managerSummary', 'operationsNote', 'recommendations'];
  for (const k of required) {
    if (!output[k]) return { ok: false, reason: 'missing_field:' + k };
    if (Array.isArray(output[k]) && output[k].length === 0) return { ok: false, reason: 'empty_field:' + k };
  }
  if (!Array.isArray(output.recommendations)) return { ok: false, reason: 'recs_not_array' };
  for (let i = 0; i < output.recommendations.length; i++) {
    const rec = output.recommendations[i];
    const recKeys = ['action','before','after','impact','observeMetrics','successCriteria','rollbackCondition'];
    for (const k of recKeys) {
      if (rec[k] === undefined || rec[k] === null || rec[k] === '') return { ok: false, reason: 'rec_' + i + '_missing:' + k };
    }
    if (!Array.isArray(rec.observeMetrics) || rec.observeMetrics.length === 0) return { ok: false, reason: 'rec_' + i + '_observemetrics_empty' };
  }
  // 建议值校验（recommended 含关键数字时）
  if (recommended && (recommended.recBefore || recommended.recAfter)) {
    const firstRec = output.recommendations[0];
    // 只取"=" 后第一个数字（避免抓到一个句子里的多个数字导致 every 过严）
    const extractKey = s => {
      const m = String(s || '').match(/=\s*(\d+(?:\.\d+)?%?)/);
      return m ? [m[1]] : [];
    };
    const expectedBeforeKeys = extractKey(recommended.recBefore);
    const expectedAfterKeys = extractKey(recommended.recAfter);
    const beforeOk = expectedBeforeKeys.length === 0 || expectedBeforeKeys.every(k => firstRec.before && firstRec.before.indexOf(k) >= 0);
    const afterOk = expectedAfterKeys.length === 0 || expectedAfterKeys.every(k => firstRec.after && firstRec.after.indexOf(k) >= 0);
    if (!beforeOk || !afterOk) return { ok: false, reason: 'value_mismatch' };
  }
  // oneLiner 长度 + 因果链关键词
  const ol = output.oneLiner;
  if (ol.length < 30 || !/(→|导致|骤降|提升|下降|降低|高于|低于|超过)/.test(ol)) return { ok: false, reason: 'oneliner_weak' };
  // 单主因必须有 recommendations
  const abnormalCount = signals.filter(s => s.result === 'abnormal').length;
  if (abnormalCount <= 1 && output.recommendations.length === 0) return { ok: false, reason: 'no_recs_single_cause' };
  return { ok: true };
}

async function callLLM(record, signals, scenario) {
  // 真实 LLM 调用：通过本地代理（llm-proxy.mjs）转发到 DeepSeek
  // 失败任一原因（关闭 / 代理未启动 / Key 未设置 503 / 网络错 / 超时 / JSON 错 /
  //              校验不过 / Golden Case 不符）→ 返回 null → 模板兜底
  //
  // 🔒 前端不持有任何 Key、不发 Authorization 头。Key 由代理从 process.env.DEEPSEEK_API_KEY 读。
  if (!LLM_CONFIG.enabled) return null;

  const { systemPrompt, userPrompt } = buildPrompt(record, signals, scenario);
  const recommended = getRecommendedBeforeAfter(record, signals, scenario);

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), LLM_CONFIG.timeoutMs);

  let resp, text;
  try {
    resp = await fetch(LLM_CONFIG.endpoint, {
      method: 'POST',
      // 🔒 故意不发 Authorization 头：Key 只能由代理注入
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: LLM_CONFIG.model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ],
        temperature: LLM_CONFIG.temperature,
        response_format: { type: 'json_object' }
      }),
      signal: controller.signal
    });
    text = await resp.text();
  } catch (e) {
    clearTimeout(timer);
    return null;
  }
  clearTimeout(timer);

  if (!resp || !resp.ok) {
    // 403 / 500 / 503（含 LLM_NOT_CONFIGURED）等都视为失败 → 回退模板
    return null;
  }

  let data;
  try { data = JSON.parse(text); } catch (e) { return null; }

  // DeepSeek chat completions 标准返回结构
  const content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if (typeof content !== 'string') return null;

  let llmJson;
  try { llmJson = JSON.parse(content); } catch (e) { return null; }

  // 5 项校验
  const v = validateLLMOutput(llmJson, record, signals, scenario, recommended);
  if (!v.ok) return null;

  // Golden Case 特判：与标准答案对齐
  if (record.rtaId === GOLDEN_CASE_STD.rtaId) {
    const std = GOLDEN_CASE_STD;
    const primaryOK = llmJson.causes && std.primaryHint.test(llmJson.causes.primary || '');
    const recBeforeOK = llmJson.recommendations[0].before.indexOf(std.recBeforeHint) >= 0;
    const recAfterOK = llmJson.recommendations[0].after.indexOf(std.recAfterHint) >= 0;
    const secondaryOK = !llmJson.causes || llmJson.causes.secondary === std.secondaryHint;
    // 不强制 causes 完整（模板兜底给全），但模板 fallback 永远可用，所以这里不强求 LLM 给 causes
    if (!primaryOK || !recBeforeOK || !recAfterOK || !secondaryOK) return null;
  }

  // 透传：causes / affectedScope 走模板（LLM 只生成自然语言部分）
  const tmpl = buildTemplateNarrative(record, signals, scenario);
  return {
    oneLiner: llmJson.oneLiner,
    managerSummary: llmJson.managerSummary,
    operationsNote: llmJson.operationsNote,
    causes: llmJson.causes ? { primary: llmJson.causes.primary, secondary: llmJson.causes.secondary, excluded: tmpl.causes.excluded } : tmpl.causes,
    affectedScope: tmpl.affectedScope,
    recommendations: llmJson.recommendations.map((r, i) => ({
      id: 'rec-' + (i+1),
      action: r.action, before: r.before, after: r.after, impact: r.impact,
      observeMetrics: r.observeMetrics, successCriteria: r.successCriteria, rollbackCondition: r.rollbackCondition
    })),
    _source: 'llm'
  };
}

function runAiLayer(record, signals, scenario) {
  // AI 层入口（方案 B：LLM 生成 + 模板兜底 · v6 final 安全版）
  // - LLM_CONFIG.enabled=true：先返回模板占位（保证 UI 立刻有结果），异步 fire-and-forget 调本地代理
  //   代理校验通过 → 派发 'rta-llm-override' 事件，抽屉侧 patch 报告；用户感知"加载 → 切到 AI 输出"
  // - 任何失败（代理未启动 / Key 未设置 503 / 网络错 / 超时 / JSON 错 / 校验不过 / Golden Case 不符）→ 保留模板结果，UI 永远不崩
  // - 🔒 前端从不持有 Key、不发 Authorization 头；Key 由 llm-proxy.mjs 从 process.env.DEEPSEEK_API_KEY 读取
  const tmpl = buildTemplateNarrative(record, signals, scenario);
  tmpl._source = 'template';

  if (LLM_CONFIG.enabled) {
    callLLM(record, signals, scenario).then(llmResult => {
      if (llmResult && typeof window !== 'undefined') {
        window.dispatchEvent(new CustomEvent('rta-llm-override', {
          detail: { rtaId: record.rtaId, scenario: scenario.sceneId, llmResult }
        }));
      }
    }).catch(() => { /* 静默回退模板（代理未启动 / 网络断开 / 503 等） */ });
  }

  return tmpl;
}

/* ═══════════════════════════════════════════════════════════════════════
 * 5.7 v0.7 Mock 只读查询层（QueryContext + evidenceId + Schema 校验）
 *     - 只读消费当前 RTA 的合成 Mock 数据，不接真实媒体 API
 *     - 为指标、趋势、实验组/对照组、配置变更和诊断证据生成稳定 evidenceId
 *     - 智能参谋模板优先；LLM 可选增强时只能消费 queryResult / evidence，不自行查数
 * ═══════════════════════════════════════════════════════════════════════ */

const QUERY_SCHEMA_VERSION = '0.7';

function stableToken(s) {
  return String(s || '').toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'UNKNOWN';
}

function toDisplayValue(value, unit) {
  if (value === undefined || value === null || value === '') return '—';
  if (typeof value !== 'number' || !isFinite(value)) return String(value);
  if (unit === 'percent') return (value * 100).toFixed(1) + '%';
  if (unit === 'percent0') return (value * 100).toFixed(0) + '%';
  if (unit === 'yuan') return value.toLocaleString('zh-CN') + ' 元';
  if (unit === 'qps') return value.toLocaleString('zh-CN') + ' QPS';
  if (unit === 'ms') return value.toFixed(0) + ' ms';
  if (unit === 'count') return value.toLocaleString('zh-CN');
  return String(value);
}

function addEvidence(list, evidenceId, type, label, path, value, text) {
  if (!evidenceId) return;
  list.push({
    evidenceId,
    type,
    label,
    path,
    value,
    text: text || (label + ' = ' + value)
  });
}

function buildQueryContext(record, report, providerEnvelope) {
  record = mergeProviderEnvelopeIntoRecord(record, providerEnvelope);
  const evidence = [];
  const metrics = {};

  function addMetric(key, label, value, unit, path, tone) {
    const evidenceId = 'EV-METRIC-' + stableToken(key);
    const display = toDisplayValue(value, unit);
    metrics[key] = { key, label, value, unit, display, tone: tone || 'normal', evidenceId };
    addEvidence(evidence, evidenceId, 'metric', label, path, display, label + ' = ' + display);
  }

  addMetric('dailyBudget', '日预算', record.dailyBudget, 'yuan', 'record.dailyBudget');
  addMetric('actualCost', '实际消耗', record.actualCost, 'yuan', 'record.actualCost');
  addMetric('achievementRate', '达成率', record.achievementRate, 'percent0', 'record.achievementRate', record.achievementRate < 0.6 ? 'abnormal' : 'normal');
  addMetric('gap', '预算缺口', (record.dailyBudget || 0) - (record.actualCost || 0), 'yuan', 'derived.dailyBudget-actualCost');
  addMetric('currentQps', '当前 QPS', record.coreMetrics && record.coreMetrics.currentQps, 'qps', 'record.coreMetrics.currentQps');
  addMetric('qpsConfig', '配置 QPS', record.qpsConfig, 'qps', 'record.qpsConfig');
  addMetric('qpsUsed', '实验已占用 QPS', record.qpsUsed, 'qps', 'record.qpsUsed');
  addMetric('qpsRemaining', '剩余 QPS', record.qpsRemaining, 'qps', 'record.qpsRemaining');
  addMetric('qpsUsageRate', 'QPS 使用率', record.coreMetrics && record.coreMetrics.qpsUsageRate, 'percent', 'record.coreMetrics.qpsUsageRate');
  addMetric('totalRequests', '请求总量', record.usageMetrics && record.usageMetrics.totalRequests, 'count', 'record.usageMetrics.totalRequests');
  addMetric('hitRate', '命中率', record.usageMetrics && record.usageMetrics.hitRate, 'percent', 'record.usageMetrics.hitRate');
  addMetric('bidRateControl', '对照组参竞率', record.usageMetrics && record.usageMetrics.bidRate && record.usageMetrics.bidRate.control, 'percent0', 'record.usageMetrics.bidRate.control');
  addMetric('bidRateTreatment', '实验组参竞率', record.usageMetrics && record.usageMetrics.bidRate && record.usageMetrics.bidRate.treatment, 'percent0', 'record.usageMetrics.bidRate.treatment');
  addMetric('controlGroupCost', '对照组消耗', record.budget && record.budget.controlGroupCost, 'yuan', 'record.budget.controlGroupCost');
  addMetric('treatmentGroupCost', '实验组消耗', record.budget && record.budget.treatmentGroupCost, 'yuan', 'record.budget.treatmentGroupCost');
  addMetric('successRate', '执行成功率', record.coreMetrics && record.coreMetrics.successRate, 'percent', 'record.coreMetrics.successRate');
  addMetric('timeoutRate', '超时率', record.coreMetrics && record.coreMetrics.timeoutRate, 'percent', 'record.coreMetrics.timeoutRate');
  addMetric('p99', 'P99 耗时', record.coreMetrics && record.coreMetrics.p99, 'ms', 'record.coreMetrics.p99');
  addMetric('callbackSuccessRate', '回传成功率', record.attribution && record.attribution.callbackSuccessRate, 'percent', 'record.attribution.callbackSuccessRate');
  addMetric('callbackLatency', '回传延迟', record.attribution && record.attribution.callbackLatency, 'ms', 'record.attribution.callbackLatency');
  addMetric('missingFieldRate', '识别字段缺失率', record.attribution && record.attribution.missingFieldRate, 'percent', 'record.attribution.missingFieldRate');
  addMetric('conversionCount', '转化数', record.conversionCount, 'count', 'record.conversionCount');
  addMetric('actualCpa', '实际 CPA', record.actualCpa, 'yuan', 'record.actualCpa', record.actualCpa > record.targetCpa * 1.2 ? 'abnormal' : 'normal');
  addMetric('targetCpa', '目标 CPA', record.targetCpa, 'yuan', 'record.targetCpa');

  const trend = (Array.isArray(record.trend) ? record.trend : []).map((p, i) => {
    const evidenceId = 'EV-TREND-' + String(i + 1).padStart(3, '0');
    const point = {
      evidenceId,
      time: p.time,
      requests: p.requests,
      hitRate: p.hitRate,
      bidRate: p.bidRate,
      cost: p.cost,
      impressionChange: p.impressionChange
    };
    addEvidence(
      evidence,
      evidenceId,
      'trend',
      '趋势点 ' + p.time,
      'record.trend[' + i + ']',
      JSON.stringify(point),
      '趋势点 ' + p.time + '：请求 ' + toDisplayValue(p.requests, 'count') + '，命中率 ' + toDisplayValue(p.hitRate, 'percent') + '，参竞率 ' + toDisplayValue(p.bidRate, 'percent') + '，消耗 ' + toDisplayValue(p.cost, 'yuan')
    );
    return point;
  });

  const configChanges = (Array.isArray(record.changes) ? record.changes : []).map((c, i) => {
    const evidenceId = 'EV-CHANGE-' + String(i + 1).padStart(3, '0');
    const item = {
      evidenceId,
      time: c.time,
      operator: c.operator,
      object: c.object,
      field: c.field,
      before: c.before,
      after: c.after
    };
    addEvidence(evidence, evidenceId, 'config_change', c.object + ' ' + c.field, 'record.changes[' + i + ']', c.before + ' -> ' + c.after, c.time + ' ' + c.object + ' ' + c.field + '：' + c.before + ' -> ' + c.after);
    return item;
  });
  if (configChanges.length === 0) {
    addEvidence(evidence, 'EV-CHANGE-SUMMARY', 'config_change', '配置变更汇总', 'record.changes', '0', '当前 Mock 时间范围内未记录配置变更');
  }

  const groups = (Array.isArray(record.groups) ? record.groups : []).map((g, i) => {
    const suffix = g.groupType === 'control' ? 'CONTROL' : (g.groupType === 'treatment' ? 'TREATMENT' : String(i + 1).padStart(3, '0'));
    const evidenceId = 'EV-GROUP-' + suffix;
    const item = {
      evidenceId,
      groupId: g.groupId,
      groupType: g.groupType,
      buckets: g.buckets || [],
      bucketCount: Array.isArray(g.buckets) ? g.buckets.length : 0,
      snapshot: g.snapshot || {}
    };
    addEvidence(evidence, evidenceId, 'group', g.groupId || ('实验组 ' + (i + 1)), 'record.groups[' + i + ']', JSON.stringify(item), (g.groupId || '实验组') + '：' + (g.groupType || 'unknown') + '，分桶 ' + item.bucketCount + '/10');
    return item;
  });

  const signals = runRules(record).map(s => {
    const evidenceId = 'EV-RULE-' + s.id;
    addEvidence(evidence, evidenceId, 'rule', s.id + ' ' + s.label, 'runRules.' + s.id, s.evidence, '[' + s.id + '] ' + s.evidence);
    return Object.assign({ evidenceId }, s);
  });

  const sceneEvidenceId = 'EV-SCENARIO-' + (report.scenario && report.scenario.sceneId || 'UNKNOWN');
  addEvidence(evidence, sceneEvidenceId, 'scenario', '诊断场景', 'report.scenario', report.scenario && report.scenario.sceneId, '场景=' + (report.scenario && report.scenario.sceneId) + '，置信度=' + (report.scenario && report.scenario.confidence) + '%');

  const ctx = {
    schemaVersion: QUERY_SCHEMA_VERSION,
    rtaId: record.rtaId,
    projectName: record.projectName,
    media: record.media,
    dataScope: 'current_rta_only',
    accessMode: 'readonly_mock',
    dataSource: 'Mock 数据（v0.7 QueryContext）',
    timeRange: {
      label: report.technical && report.technical.dataRange,
      updatedAt: report.technical && report.technical.dataUpdatedAt
    },
    experiment: {
      id: record.experiment && record.experiment.id,
      name: record.experiment && record.experiment.name,
      status: record.experiment && record.experiment.status,
      type: record.experiment && record.experiment.type,
      bucketMode: record.bucketMode
    },
    groups,
    metrics,
    trend,
    configChanges,
    diagnosisEvidence: {
      scenarioEvidenceId: sceneEvidenceId,
      signals,
      abnormalRuleEvidenceIds: signals.filter(s => s.result === 'abnormal').map(s => s.evidenceId),
      causeNodeEvidenceIds: (report.causeTree || []).map(n => 'EV-CAUSE-' + stableToken(n.category))
    },
    evidence
  };

  (report.causeTree || []).forEach(n => {
    addEvidence(ctx.evidence, 'EV-CAUSE-' + stableToken(n.category), 'cause_node', n.label, 'report.causeTree.' + n.category, n.evidence, n.label + '：' + n.evidence);
  });

  ctx.dataQuality = validateQueryContextSchema(ctx);
  return ctx;
}

function validateQueryContextSchema(ctx) {
  const missingFields = [];
  const schemaErrors = [];
  const conflicts = [];

  if (!ctx || typeof ctx !== 'object') return { status: 'insufficient', completeness: 0, missingFields: ['queryContext'], conflicts: [], schemaErrors: ['queryContext_not_object'], evidenceCount: 0 };
  if (ctx.schemaVersion !== QUERY_SCHEMA_VERSION) schemaErrors.push('schemaVersion');
  if (!ctx.rtaId) missingFields.push('rtaId');
  if (!ctx.timeRange || !ctx.timeRange.label) missingFields.push('timeRange.label');
  if (!ctx.experiment || !ctx.experiment.id) missingFields.push('experiment.id');
  if (!Array.isArray(ctx.groups) || ctx.groups.length < 2) missingFields.push('groups');
  if (!ctx.metrics || typeof ctx.metrics !== 'object') missingFields.push('metrics');
  if (!Array.isArray(ctx.evidence) || ctx.evidence.length === 0) missingFields.push('evidence');

  const evidenceIds = new Set();
  (ctx.evidence || []).forEach(e => {
    if (!e.evidenceId) schemaErrors.push('evidence_without_id');
    if (evidenceIds.has(e.evidenceId)) schemaErrors.push('duplicate_evidenceId:' + e.evidenceId);
    evidenceIds.add(e.evidenceId);
  });

  Object.keys(ctx.metrics || {}).forEach(k => {
    const m = ctx.metrics[k];
    if (!m.evidenceId || !evidenceIds.has(m.evidenceId)) schemaErrors.push('metric_evidence_missing:' + k);
    if (m.value === undefined || m.value === null || (typeof m.value === 'number' && !isFinite(m.value))) missingFields.push('metrics.' + k);
  });

  (ctx.trend || []).forEach((p, i) => {
    if (!p.evidenceId || !evidenceIds.has(p.evidenceId)) schemaErrors.push('trend_evidence_missing:' + i);
    if (!/^\d{2}:\d{2}$/.test(String(p.time || ''))) schemaErrors.push('trend_time_format:' + i);
    if (i > 0 && String(ctx.trend[i - 1].time || '').localeCompare(String(p.time || '')) > 0) conflicts.push('趋势时间顺序冲突：' + ctx.trend[i - 1].time + ' 晚于 ' + p.time);
  });

  (ctx.configChanges || []).forEach((c, i) => {
    if (!c.evidenceId || !evidenceIds.has(c.evidenceId)) schemaErrors.push('change_evidence_missing:' + i);
    if (!/^\d{2}:\d{2}$/.test(String(c.time || ''))) schemaErrors.push('change_time_format:' + i);
  });

  const m = ctx.metrics || {};
  const dailyBudget = m.dailyBudget && m.dailyBudget.value;
  const actualCost = m.actualCost && m.actualCost.value;
  const achievementRate = m.achievementRate && m.achievementRate.value;
  if (typeof dailyBudget === 'number' && dailyBudget > 0 && typeof actualCost === 'number' && typeof achievementRate === 'number') {
    const calc = actualCost / dailyBudget;
    if (Math.abs(calc - achievementRate) > 0.005) conflicts.push('达成率冲突：actualCost/dailyBudget=' + calc.toFixed(3) + '，record.achievementRate=' + achievementRate);
  }

  const qpsConfig = m.qpsConfig && m.qpsConfig.value;
  const qpsUsed = m.qpsUsed && m.qpsUsed.value;
  const qpsRemaining = m.qpsRemaining && m.qpsRemaining.value;
  if ([qpsConfig, qpsUsed, qpsRemaining].every(v => typeof v === 'number')) {
    const calcRemain = qpsConfig - qpsUsed;
    if (calcRemain !== qpsRemaining) conflicts.push('QPS 剩余冲突：配置-已占用=' + calcRemain + '，记录=' + qpsRemaining);
  }

  const conversions = m.conversionCount && m.conversionCount.value;
  const actualCpa = m.actualCpa && m.actualCpa.value;
  if (typeof actualCost === 'number' && typeof conversions === 'number' && conversions > 0 && typeof actualCpa === 'number') {
    const calcCpa = actualCost / conversions;
    if (Math.abs(calcCpa - actualCpa) > 0.5) conflicts.push('CPA 冲突：actualCost/conversionCount=' + calcCpa.toFixed(1) + '，record.actualCpa=' + actualCpa);
  }

  const requiredMetricKeys = ['dailyBudget','actualCost','achievementRate','totalRequests','hitRate','bidRateControl','bidRateTreatment','actualCpa','targetCpa'];
  const missingMetricKeys = requiredMetricKeys.filter(k => !m[k] || m[k].value === undefined || m[k].value === null);
  missingMetricKeys.forEach(k => missingFields.push('metrics.' + k));

  const totalChecks = 26;
  const problemCount = missingFields.length + schemaErrors.length + conflicts.length;
  const completeness = Math.max(0, Math.min(1, (totalChecks - problemCount) / totalChecks));
  const status = conflicts.length > 0 ? 'conflict' : ((missingFields.length > 0 || schemaErrors.length > 0) ? 'insufficient' : 'ok');
  return {
    status,
    completeness,
    missingFields: Array.from(new Set(missingFields)),
    conflicts,
    schemaErrors,
    evidenceCount: (ctx.evidence || []).length,
    freshnessMinutes: 0
  };
}

function detectOtherRtaInQuestion(question, currentRtaId) {
  const q = String(question || '');
  return listDataRecords().find(r => r.rtaId !== currentRtaId && q.indexOf(r.rtaId) >= 0) || null;
}

function metricKeysFromQuestion(question) {
  const q = String(question || '');
  const keys = [];
  const add = k => { if (keys.indexOf(k) < 0) keys.push(k); };
  if (/预算|消耗|达成率|缺口|花/.test(q)) ['dailyBudget','actualCost','gap','achievementRate'].forEach(add);
  if (/QPS|qps/.test(q)) ['currentQps','qpsConfig','qpsUsed','qpsRemaining','qpsUsageRate'].forEach(add);
  if (/请求/.test(q)) add('totalRequests');
  if (/命中/.test(q)) add('hitRate');
  if (/参竞|放行/.test(q)) ['bidRateControl','bidRateTreatment'].forEach(add);
  if (/CPA|cpa|转化|成本/.test(q)) ['actualCpa','targetCpa','conversionCount'].forEach(add);
  if (/回传|归因|缺失/.test(q)) ['callbackSuccessRate','callbackLatency','missingFieldRate'].forEach(add);
  if (/执行|成功率|超时|P99|耗时/.test(q)) ['successRate','timeoutRate','p99'].forEach(add);
  if (keys.length === 0) ['dailyBudget','actualCost','achievementRate','hitRate','bidRateControl','bidRateTreatment','actualCpa','targetCpa'].forEach(add);
  return keys;
}

function trendMetricFromQuestion(question) {
  const q = String(question || '');
  if (/命中/.test(q)) return { key: 'hitRate', label: '命中率', unit: 'percent' };
  if (/参竞|放行/.test(q)) return { key: 'bidRate', label: '参竞率', unit: 'percent' };
  if (/消耗|花|成本/.test(q)) return { key: 'cost', label: '时段消耗', unit: 'yuan' };
  if (/曝光/.test(q)) return { key: 'impressionChange', label: '曝光变化', unit: 'percent' };
  return { key: 'requests', label: '请求量', unit: 'count' };
}

function ensureQueryContext(report, record) {
  if (report && report.queryContext) return report.queryContext;
  if (!report || report.status !== 'completed') return null;
  return buildQueryContext(record, report, getProviderEnvelope(record));
}

function makeQueryRefusal(status, reason, detail, evidenceIds) {
  return { status, reason, detail: detail || '', evidenceIds: evidenceIds || [], rows: [] };
}

function runAssistantQuery(question, intent, report, record) {
  if (!report || report.status === 'insufficient') {
    return makeQueryRefusal('insufficient', 'diagnosis_insufficient', report && report.missingFields ? report.missingFields.join('、') : '诊断数据不足', []);
  }
  const otherRta = detectOtherRtaInQuestion(question, record.rtaId);
  if (otherRta) {
    return makeQueryRefusal('refused', 'cross_rta_out_of_scope', '问题提到了其他 RTAID：' + otherRta.rtaId + '。当前参谋只允许查询当前 RTA：' + record.rtaId + '。', []);
  }
  const ctx = ensureQueryContext(report, record);
  if (!ctx) return makeQueryRefusal('insufficient', 'query_context_missing', '当前报告没有可用 QueryContext。', []);
  if (ctx.accessMode !== 'readonly_mock' || ctx.dataScope !== 'current_rta_only') {
    return makeQueryRefusal('refused', 'scope_violation', '查询上下文不是当前 RTA 的只读 Mock 范围。', []);
  }
  if (ctx.dataQuality && ctx.dataQuality.status === 'conflict') {
    return makeQueryRefusal('conflict', 'evidence_conflict', ctx.dataQuality.conflicts.join('；'), ctx.evidence.map(e => e.evidenceId));
  }
  if (ctx.dataQuality && ctx.dataQuality.status === 'insufficient') {
    return makeQueryRefusal('insufficient', 'schema_insufficient', ctx.dataQuality.missingFields.concat(ctx.dataQuality.schemaErrors).join('、'), ctx.evidence.map(e => e.evidenceId));
  }

  const execute = () => {
    if (intent === 'metric_query') return queryMetrics(ctx, metricKeysFromQuestion(question));
    if (intent === 'trend_query') return queryTrend(ctx, trendMetricFromQuestion(question));
    if (intent === 'group_compare') return queryGroupCompare(ctx);
    if (intent === 'config_query') return queryConfigChanges(ctx);
    if (intent === 'evidence') return queryDiagnosisEvidence(ctx);
    if (intent === 'budget') return queryMetrics(ctx, ['dailyBudget','actualCost','gap','achievementRate','bidRateControl','bidRateTreatment']);
    if (intent === 'attribution') return queryMetrics(ctx, ['callbackSuccessRate','callbackLatency','missingFieldRate','actualCpa','targetCpa']);
    return null;
  };
  const toolName = READONLY_TOOL_API && READONLY_TOOL_API.toolNameForIntent(intent);
  if (toolName && MOCK_PROVIDER) {
    return READONLY_TOOL_API.createReadOnlyToolRunner(MOCK_PROVIDER).run(toolName, providerRequestFor(record), execute);
  }
  return execute();
}

function queryMetrics(ctx, keys) {
  const rows = [];
  const missing = [];
  (keys || []).forEach(k => {
    const m = ctx.metrics[k];
    if (!m || m.value === undefined || m.value === null || m.display === '—') missing.push(k);
    else rows.push({ key: k, label: m.label, value: m.display, rawValue: m.value, evidenceId: m.evidenceId, tone: m.tone });
  });
  if (rows.length === 0) return makeQueryRefusal('insufficient', 'metric_missing', missing.join('、') || '未匹配到可查询指标', []);
  return {
    status: missing.length > 0 ? 'partial' : 'ok',
    type: 'metric_query',
    rtaId: ctx.rtaId,
    timeRange: ctx.timeRange.label,
    rows,
    missing,
    evidenceIds: rows.map(r => r.evidenceId),
    dataSource: ctx.dataSource
  };
}

function queryTrend(ctx, metric) {
  const points = (ctx.trend || []).filter(p => typeof p[metric.key] === 'number');
  if (points.length < 2) return makeQueryRefusal('insufficient', 'trend_points_lt_2', metric.label + '趋势点不足 2 个，不能做趋势对比。', points.map(p => p.evidenceId));
  const first = points[0];
  const last = points[points.length - 1];
  const delta = last[metric.key] - first[metric.key];
  const relative = first[metric.key] !== 0 ? delta / Math.abs(first[metric.key]) : null;
  return {
    status: 'ok',
    type: 'trend_query',
    rtaId: ctx.rtaId,
    timeRange: ctx.timeRange.label,
    metric,
    first: { time: first.time, value: toDisplayValue(first[metric.key], metric.unit), rawValue: first[metric.key], evidenceId: first.evidenceId },
    last: { time: last.time, value: toDisplayValue(last[metric.key], metric.unit), rawValue: last[metric.key], evidenceId: last.evidenceId },
    delta: toDisplayValue(delta, metric.unit),
    relative: relative === null ? '—' : (relative * 100).toFixed(1) + '%',
    points: points.map(p => ({ time: p.time, value: toDisplayValue(p[metric.key], metric.unit), evidenceId: p.evidenceId })),
    evidenceIds: points.map(p => p.evidenceId),
    dataSource: ctx.dataSource
  };
}

function queryGroupCompare(ctx) {
  const control = (ctx.groups || []).find(g => g.groupType === 'control');
  const treatment = (ctx.groups || []).find(g => g.groupType === 'treatment');
  if (!control || !treatment) return makeQueryRefusal('insufficient', 'groups_missing', '缺少对照组或实验组。', []);
  const cBid = ctx.metrics.bidRateControl;
  const tBid = ctx.metrics.bidRateTreatment;
  const cCost = ctx.metrics.controlGroupCost;
  const tCost = ctx.metrics.treatmentGroupCost;
  const rows = [
    { label: '分桶数', control: control.bucketCount + '/10', treatment: treatment.bucketCount + '/10', evidenceIds: [control.evidenceId, treatment.evidenceId] },
    { label: '参竞率', control: cBid.display, treatment: tBid.display, diff: ((cBid.value - tBid.value) * 100).toFixed(0) + 'pp', evidenceIds: [cBid.evidenceId, tBid.evidenceId] },
    { label: '消耗', control: cCost.display, treatment: tCost.display, diff: toDisplayValue((tCost.value || 0) - (cCost.value || 0), 'yuan'), evidenceIds: [cCost.evidenceId, tCost.evidenceId] }
  ];
  return {
    status: 'ok',
    type: 'group_compare',
    rtaId: ctx.rtaId,
    timeRange: ctx.timeRange.label,
    controlGroupId: control.groupId,
    treatmentGroupId: treatment.groupId,
    rows,
    treatmentSnapshot: treatment.snapshot,
    evidenceIds: Array.from(new Set(rows.reduce((a, r) => a.concat(r.evidenceIds || []), []))),
    dataSource: ctx.dataSource
  };
}

function queryConfigChanges(ctx) {
  if (!ctx.configChanges || ctx.configChanges.length === 0) {
    return {
      status: 'ok',
      type: 'config_query',
      rtaId: ctx.rtaId,
      timeRange: ctx.timeRange.label,
      rows: [],
      evidenceIds: ['EV-CHANGE-SUMMARY'],
      dataSource: ctx.dataSource,
      emptyMessage: '当前 Mock 时间范围内未查到配置变更记录。'
    };
  }
  return {
    status: 'ok',
    type: 'config_query',
    rtaId: ctx.rtaId,
    timeRange: ctx.timeRange.label,
    rows: ctx.configChanges.map(c => ({
      time: c.time,
      operator: c.operator,
      object: c.object,
      field: c.field,
      before: c.before,
      after: c.after,
      evidenceId: c.evidenceId
    })),
    evidenceIds: ctx.configChanges.map(c => c.evidenceId),
    dataSource: ctx.dataSource
  };
}

function queryDiagnosisEvidence(ctx) {
  const abnormal = (ctx.diagnosisEvidence && ctx.diagnosisEvidence.signals || []).filter(s => s.result === 'abnormal');
  const keyTimeline = (ctx.trend || []).slice(0, 2).concat((ctx.trend || []).slice(-2));
  return {
    status: 'ok',
    type: 'evidence_query',
    rtaId: ctx.rtaId,
    timeRange: ctx.timeRange.label,
    abnormalRules: abnormal.map(s => ({ id: s.id, label: s.label, evidence: s.evidence, evidenceId: s.evidenceId })),
    configChanges: ctx.configChanges || [],
    keyTimeline,
    evidenceIds: Array.from(new Set([ctx.diagnosisEvidence.scenarioEvidenceId].concat(abnormal.map(s => s.evidenceId), (ctx.configChanges || []).map(c => c.evidenceId), keyTimeline.map(p => p.evidenceId)))),
    dataSource: ctx.dataSource
  };
}

function evidenceSuffix(result) {
  const ids = result && result.evidenceIds || [];
  return ids.length ? '\n\n证据引用：' + ids.join('、') : '';
}

function buildQueryAnswer(queryResult, intent, report, record) {
  if (!queryResult) return null;
  if (queryResult.status === 'conflict') {
    return {
      text: '我拒绝给出确定性查询结论：当前 QueryContext 存在证据冲突。\n\n冲突项：' + queryResult.detail + '\n\n处理方式：请先人工核对 Mock 数据或重新生成数据快照；在冲突解除前，不输出趋势、组间对比或配置归因结论。'
    };
  }
  if (queryResult.status === 'insufficient') {
    return {
      text: '当前数据不足，不能可靠回答这个查询。\n\n不足项：' + queryResult.detail + '\n\n我不会补齐或猜测缺失指标。'
    };
  }
  if (queryResult.status === 'refused') {
    return {
      text: '这个查询被拒绝：' + queryResult.detail + '\n\n当前 V0.7 只支持当前 RTA（' + record.rtaId + '）在 Mock 数据范围内的只读查询。'
    };
  }
  if (queryResult.type === 'metric_query') {
    const body = queryResult.rows.map(r => '• ' + r.label + '：' + r.value + '（' + r.evidenceId + '）').join('\n');
    const partial = queryResult.status === 'partial' ? '\n\n部分字段不足：' + queryResult.missing.join('、') : '';
    return {
      text: '指标查询结果（当前 RTA：' + queryResult.rtaId + '；范围：' + queryResult.timeRange + '）：\n\n' + body + partial + evidenceSuffix(queryResult),
      suggestions: ['趋势怎么变化', '对照组和实验组对比', '配置变更记录是什么']
    };
  }
  if (queryResult.type === 'trend_query') {
    const points = queryResult.points.map(p => p.time + ' ' + p.value + '（' + p.evidenceId + '）').join('；');
    return {
      text:
        '趋势对比（' + queryResult.metric.label + '，当前 RTA：' + queryResult.rtaId + '）：\n\n' +
        '• 首点：' + queryResult.first.time + ' = ' + queryResult.first.value + '（' + queryResult.first.evidenceId + '）\n' +
        '• 末点：' + queryResult.last.time + ' = ' + queryResult.last.value + '（' + queryResult.last.evidenceId + '）\n' +
        '• 变化：' + queryResult.delta + '，相对变化 ' + queryResult.relative + '\n' +
        '• 明细：' + points + evidenceSuffix(queryResult),
      suggestions: ['配置变更记录是什么', '对照组和实验组对比']
    };
  }
  if (queryResult.type === 'group_compare') {
    const body = queryResult.rows.map(r => '• ' + r.label + '：对照组 ' + r.control + ' vs 实验组 ' + r.treatment + (r.diff ? '，差值 ' + r.diff : '') + '（证据 ' + r.evidenceIds.join('、') + '）').join('\n');
    return {
      text:
        '实验组/对照组对比（' + queryResult.controlGroupId + ' vs ' + queryResult.treatmentGroupId + '）：\n\n' +
        body + '\n\n实验组配置快照：' + JSON.stringify(queryResult.treatmentSnapshot || {}) + evidenceSuffix(queryResult),
      suggestions: ['配置变更记录是什么', '诊断结论的依据是什么']
    };
  }
  if (queryResult.type === 'config_query') {
    if (!queryResult.rows.length) {
      return { text: queryResult.emptyMessage + evidenceSuffix(queryResult), suggestions: ['当前指标是多少', '趋势怎么变化'] };
    }
    const body = queryResult.rows.map(c => '• ' + c.time + '，' + c.operator + ' 将 ' + c.object + ' 的 ' + c.field + ' 从 ' + c.before + ' 改为 ' + c.after + '（' + c.evidenceId + '）').join('\n');
    return {
      text: '配置变更查询结果：\n\n' + body + evidenceSuffix(queryResult),
      suggestions: ['趋势怎么变化', '诊断结论的依据是什么']
    };
  }
  if (queryResult.type === 'evidence_query') {
    const abnormal = queryResult.abnormalRules.length
      ? queryResult.abnormalRules.map(s => '• ' + s.id + ' ' + s.label + '：' + s.evidence + '（' + s.evidenceId + '）').join('\n')
      : '• 未发现 abnormal 规则节点';
    const changes = queryResult.configChanges.length
      ? queryResult.configChanges.map(c => '• ' + c.time + ' ' + c.field + ' ' + c.before + ' -> ' + c.after + '（' + c.evidenceId + '）').join('\n')
      : '• 无配置变更事件（EV-CHANGE-SUMMARY）';
    return {
      text:
        '证据查询结果（当前 RTA：' + queryResult.rtaId + '）：\n\n' +
        '1) 异常规则：\n' + abnormal + '\n\n' +
        '2) 配置证据：\n' + changes + '\n\n' +
        '数据来源：' + queryResult.dataSource + '\n数据范围：' + queryResult.timeRange + evidenceSuffix(queryResult),
      suggestions: ['建议怎么调整', '对照组和实验组对比']
    };
  }
  return null;
}

/* ═══════════════════════════════════════════════════════════════════════
 * 6. 完整诊断流程：组装 DiagnosisReport
 * ═══════════════════════════════════════════════════════════════════════ */

function performDiagnosis(record) {
  record = getProviderRecord(record);
  // Phase 0 数据完整性检查
  const missing = [];
  if (!record.rtaId) missing.push('rtaId');
  if (!record.experiment || !record.experiment.id) missing.push('experiment');
  if (!Array.isArray(record.groups) || record.groups.length === 0) missing.push('groups');
  if (!record.coreMetrics) missing.push('coreMetrics');
  if (!record.usageMetrics) missing.push('usageMetrics');
  if (!record.budget) missing.push('budget');
  if (safeNum(record.usageMetrics && record.usageMetrics.totalRequests, 0) === 0) missing.push('totalRequests');

  if (missing.length > 0) {
    return { status: 'insufficient', missingFields: missing, message: '数据不足：' + missing.join('、') };
  }

  // Phase 1 规则引擎
  const signals = runRules(record);
  const causeTree = buildCauseTree(signals);
  const timeline = buildTimeline(record, signals);

  // Phase 2 场景识别
  const scenario = detectScenario(signals, record);

  // Phase 3 AI 层
  const ai = runAiLayer(record, signals, scenario);

  // 影响概览
  const impact = {
    budget: record.dailyBudget,
    cost: record.actualCost,
    gap: record.dailyBudget - record.actualCost,
    achievementRate: record.achievementRate,
    affectedScope: ai.affectedScope,
    extraMetrics: [
      { name: '当前 QPS', value: record.coreMetrics.currentQps, tone: 'normal' },
      { name: 'QPS 使用率', value: (record.coreMetrics.qpsUsageRate*100).toFixed(1)+'%', tone: record.coreMetrics.qpsUsageRate > 0.8 ? 'abnormal' : 'normal' },
      { name: '命中率', value: (record.usageMetrics.hitRate*100).toFixed(1)+'%', tone: record.usageMetrics.hitRate < 0.5 ? 'abnormal' : 'normal' },
      { name: '对照组参竞率', value: ((record.usageMetrics.bidRate.control)*100).toFixed(0)+'%', tone: 'normal' },
      { name: '实验组参竞率', value: ((record.usageMetrics.bidRate.treatment)*100).toFixed(0)+'%', tone: 'abnormal' },
      { name: '参竞率差', value: Math.abs(((record.usageMetrics.bidRate.control - record.usageMetrics.bidRate.treatment))*100).toFixed(0)+'pp', tone: Math.abs(record.usageMetrics.bidRate.control - record.usageMetrics.bidRate.treatment) > 0.2 ? 'abnormal' : 'normal' },
      { name: '实际 CPA', value: record.actualCpa > 0 ? record.actualCpa.toFixed(1) : '—', tone: 'normal' },
      { name: '目标 CPA', value: record.targetCpa > 0 ? record.targetCpa.toFixed(1) : '—', tone: 'normal' },
      { name: '转化数', value: record.conversionCount || 0, tone: 'normal' }
    ]
  };

  // 技术详情
  const changeRec = (record.changes || []).find(c => c.field === '准入门槛' || c.field === '出价系数' || c.field === '人群包' || c.field === '创意状态');
  const technical = {
    rtaId: record.rtaId,
    rtaInternalId: record.rtaInternalId,
    experimentId: record.experiment.id,
    controlGroupId: (record.groups.find(g => g.groupType === 'control') || {}).groupId,
    treatmentGroupId: (record.groups.find(g => g.groupType === 'treatment') || {}).groupId,
    bucketIds: (record.groups.find(g => g.groupType === 'treatment') || {}).buckets || [],
    requestId: 'REQ-' + Math.random().toString(36).slice(2, 10).toUpperCase(),
    policyVersion: 'POL-2026-08-14',
    logFieldPath: '/rta/decision/' + record.rtaId + '/trace',
    configBefore: changeRec ? changeRec.before : '—',
    configAfter: changeRec ? changeRec.after : '—',
    dataSource: 'Mock 数据（v6 Demo）',
    dataRange: '2026-08-14 00:00 — 13:30（当日至数据更新时间）',
    dataUpdatedAt: '2026-08-14 13:30:00'
  };

  const completedReport = {
    status: 'completed',
    scenario,
    causeTree,
    timeline,
    impact,
    oneLiner: ai.oneLiner,
    managerSummary: ai.managerSummary,
    operationsNote: ai.operationsNote,
    causes: ai.causes,
    recommendations: ai.recommendations,
    technical,
    _aiSource: ai._source || 'template'
  };
  const providerEnvelope = getProviderEnvelope(record);
  const queryContext = buildQueryContext(record, completedReport, providerEnvelope);
  completedReport.queryContext = queryContext;
  completedReport.dataQuality = queryContext.dataQuality;
  completedReport.evidenceRefs = queryContext.evidence.map(e => e.evidenceId);
  completedReport.providerMeta = providerEnvelope && providerEnvelope.meta;
  return completedReport;
}

/* ═══════════════════════════════════════════════════════════════════════
 * 6.5 智能参谋助手函数（顶层 · 纯函数；setup() 内部只保留响应式状态）
 *     - classifyAssistantIntent / buildAssistantTemplateAnswer / buildAssistantPrompt / validateAssistantOutput
 *       / answerAssistantQuestion 全部为纯函数，不依赖任何 ref；提取到顶层供验证脚本通过 vm.Script 直接访问
 *     - 助手 LLM 通道复用 LLM_CONFIG.endpoint / timeoutMs / temperature；不发 Authorization
 *     - 失败任一原因（关闭 / 代理未启动 / Key 未设置 503 / 网络错 / 超时 / JSON 错 / 校验不过）→ 返回 null → 模板兜底
 * ═══════════════════════════════════════════════════════════════════════ */

// 9 类问题分类（轻量正则；只决定读 DiagnosisReport 哪个字段，不重新判断业务）
// 顺序敏感：
//   - rollback 排在 overview 之前，让"什么情况下回滚？"落到 rollback 而非 overview（overview 的"什么情况"会误匹配）
//   - observation 排在 recommendation 之前，让"调整后观察什么"落到 observation 而非 recommendation
const ASSISTANT_INTENT_KEYWORDS = [
  ['rollback',       /回滚|撤回|什么时候回|什么情况下回|还原/],
  ['config_query',   /配置变更|变更记录|改了什么|谁改|什么时候改|调整记录|历史变更/],
  ['group_compare',  /对照组|实验组|AB|A\/B|组.*对比|对比.*组|实验.*对照/],
  ['trend_query',    /趋势|拐点|从.*到|变化了多少|下降了多少|上升了多少|时间.*对比|对比.*时间/],
  ['observation',    /观察什么|看什么|观察.*指标|监控|趋势|追踪|哪些指标/],
  ['recommendation', /建议|怎么调|怎么改|调整|方案|处置|怎么办/],
  ['overview',       /异常|什么问题|什么情况|怎么了|状态|咋/],
  ['budget',         /预算|消耗|达不|没跑|花不|达率|消费/],
  ['attribution',    /回传|归因|回调|链路|缺失率|丢失/],
  ['metric_query',   /指标|QPS|qps|CPA|cpa|命中率|参竞率|请求量|成功率|超时率|P99|转化数|当前.*多少/],
  ['evidence',       /依据|因果|主因|怎么判断|怎么得出/],
  ['excluded',       /排除|其他原因|不是.*原因|否定/]
];
const ASSISTANT_EXECUTE_REFUSE = /(提价|加预算|换素材|恢复投放|修改门槛|直接调|立刻调|马上调|直接执行|把预算.{0,4}(?:加|调|改|设)|预算.{0,4}(?:加到|调到|改到|设为|改为|调整为)|(?:加|调|改|设)到\s*\d|(?:改成|改为)\s*\d)/;

function classifyAssistantIntent(q) {
  const t = (q || '').trim();
  if (!t) return 'empty';
  if (ASSISTANT_EXECUTE_REFUSE.test(t)) return 'execute_refuse';
  for (const [intent, re] of ASSISTANT_INTENT_KEYWORDS) {
    if (re.test(t)) return intent;
  }
  return 'out_of_scope';
}

// 9 类模板回答 + insufficient / execute_refuse / out_of_scope 三个特殊分支
function buildAssistantTemplateAnswer(question, intent, report, record, queryResult) {
  if (report.status === 'insufficient') return buildInsufficientAnswer(report);
  if (intent === 'execute_refuse') return buildExecuteRefuse();
  if (intent === 'out_of_scope') return buildOutOfScope(report, record);
  if (intent === 'metric_query' || intent === 'trend_query' || intent === 'group_compare' || intent === 'config_query') return buildQueryAnswer(queryResult || runAssistantQuery(question, intent, report, record), intent, report, record);
  if (intent === 'overview') return buildOverview(report, record);
  if (intent === 'budget') return buildBudget(report, record, queryResult);
  if (intent === 'attribution') return buildAttribution(report, record, queryResult);
  if (intent === 'evidence') return buildEvidence(report, queryResult);
  if (intent === 'excluded') return buildExcluded(report);
  if (intent === 'recommendation') return buildRecommendation(report);
  if (intent === 'observation') return buildObservation(report);
  if (intent === 'rollback') return buildRollback(report);
  return buildOutOfScope(report, record);
}

function buildInsufficientAnswer(report) {
  return {
    text: '当前数据不足，无法可靠诊断。\n\n缺失字段：' + report.missingFields.join('、') + '。\n\n不会为你生成主因、建议或观察指标（对齐契约 v0.3 §2.4 输入完整性规则）。\n\n引导：\n• 切换到另一个 RTAID，看是否有稳定数据；\n• 点击右下"查看完整诊断"，阅读数据不足模式的标记说明。',
    suggestions: ['查看完整诊断', '切换 RTA']
  };
}

function buildExecuteRefuse() {
  return {
    text: '智能参谋只提供诊断、解释和建议，不会直接执行提价、加预算、换素材或修改门槛等真实配置变更。\n\n要推进这些变更：\n1. 点击右下"查看完整诊断"，阅读 AI 层的建议方案；\n2. 在抽屉底部走完人工确认状态机（批准方案 → 我已执行 → 复盘完成）；\n3. 任何风险操作必须由你或你的团队手动完成。'
  };
}

function buildOutOfScope(report, record) {
  return {
    text: '这个问题超出当前智能参谋的范围。当前只能回答所选 RTA（' + record.rtaId + '）在当前数据范围（' + report.technical.dataRange + '）内的诊断与分析问题。\n\n能帮你：当前 RTA 的异常、原因、建议、观察指标和回滚条件。\n\n不能帮你：跨 RTA 历史数据；行业大盘或竞品信息；真实媒体平台实时状态；直接执行投放配置变更。'
  };
}

function buildOverview(report, record) {
  const tags = report.scenario.phenomenonTags.map(t => t.name).join('、') || '无';
  return {
    text:
      '【' + report.scenario.sceneName + '】 置信度 ' + report.scenario.confidence + '%\n\n' +
      '• 一句话结论：' + report.oneLiner + '\n' +
      '• 现象标签：' + tags + '\n' +
      '• 受影响范围：' + report.impact.affectedScope + '\n' +
      '• 主要影响：日预算 ' + report.impact.budget + ' 元，实际消耗 ' + report.impact.cost + ' 元，达成率 ' + (report.impact.achievementRate*100).toFixed(0) + '%。',
    suggestions: ['诊断结论的依据是什么', '建议怎么调整', '还有哪些原因已排除']
  };
}

function buildBudget(report, record, queryResult) {
  if (queryResult && (queryResult.status === 'conflict' || queryResult.status === 'insufficient' || queryResult.status === 'refused')) {
    return buildQueryAnswer(queryResult, 'budget', report, record);
  }
  const imp = report.impact;
  const metrics = (imp.extraMetrics || []).filter(m => /参竞|请求/.test(m.name));
  const metricsStr = metrics.map(m => m.name + ' ' + m.value).join('、');
  const qr = queryResult || runAssistantQuery('预算 消耗 达成率 参竞率', 'budget', report, record);
  const refs = qr && qr.evidenceIds && qr.evidenceIds.length ? '\n\n证据引用：' + qr.evidenceIds.join('、') : '';
  return {
    text:
      '预算与消耗情况：\n\n' +
      '• 日预算：' + imp.budget + ' 元\n' +
      '• 实际消耗：' + imp.cost + ' 元\n' +
      '• 达成率：' + (imp.achievementRate*100).toFixed(0) + '%\n' +
      '• 差额：' + imp.gap + ' 元\n\n' +
      '主要原因（来自 DiagnosisReport.causes.primary）：' + report.causes.primary + '\n\n' +
      '因果链：' + (metricsStr ? '关键指标 ' + metricsStr + '，' : '') + '直接导致预算未达标。' + refs,
    suggestions: ['诊断结论的依据是什么', '建议怎么调整', '还有哪些原因已排除']
  };
}

function buildAttribution(report, record, queryResult) {
  if (queryResult && (queryResult.status === 'conflict' || queryResult.status === 'insufficient' || queryResult.status === 'refused')) {
    return buildQueryAnswer(queryResult, 'attribution', report, record);
  }
  const attributionNode = report.causeTree.find(n => n.category === 'attribution');
  const ar = record.attribution || {};
  const qr = queryResult || runAssistantQuery('回传 归因 CPA', 'attribution', report, record);
  const refs = qr && qr.evidenceIds && qr.evidenceIds.length ? '\n\n证据引用：' + qr.evidenceIds.join('、') : '';
  if (report.scenario.sceneId === 'S6' || (attributionNode && attributionNode.result === 'abnormal')) {
    return {
      text:
        '【回传链路异常（场景 S6）】\n\n' +
        '• 回传成功率：' + (ar.callbackSuccessRate*100).toFixed(1) + '%\n' +
        '• 回传延迟：' + ar.callbackLatency + ' ms\n' +
        '• 字段缺失率：' + (ar.missingFieldRate*100).toFixed(1) + '%\n\n' +
        '影响：归因数据可信度下降，转化数据可能被低估，会进一步影响 CPA 判定（D14）和现象标签。\n\n' +
        '异常归因原因（来自诊断报告 causes.primary）：' + (report.causes.primary || '—') + refs,
      suggestions: ['诊断结论的依据是什么', '建议怎么调整']
    };
  }
  return {
    text:
      '【回传链路正常】\n\n' +
      '• 回传成功率：' + (ar.callbackSuccessRate*100).toFixed(1) + '%\n' +
      '• 回传延迟：' + ar.callbackLatency + ' ms\n' +
      '• 字段缺失率：' + (ar.missingFieldRate*100).toFixed(1) + '%\n\n' +
      '判定依据：回传归因节点（causeTree category=attribution）结果为 normal；当前不是 S6 场景。' + refs
  };
}

function buildEvidence(report, queryResult) {
  if (queryResult && (queryResult.status === 'conflict' || queryResult.status === 'insufficient' || queryResult.status === 'refused')) {
    return buildQueryAnswer(queryResult, 'evidence', report, { rtaId: report.technical && report.technical.rtaId });
  }
  const configEvents = report.timeline.filter(e => e.category === 'config');
  const configStr = configEvents.map(e => e.time + ' ' + e.label + (e.value ? ' (' + e.value + ')' : '')).join('\n  ');
  const abnormalNodes = report.causeTree.filter(n => n.result === 'abnormal');
  const abnormalStr = abnormalNodes.map(n => '  • ' + n.label + ' [' + n.category + '] · ' + n.evidence).join('\n');
  const qr = queryResult || (report.queryContext ? queryDiagnosisEvidence(report.queryContext) : null);
  const refs = qr && qr.evidenceIds && qr.evidenceIds.length ? '\n\n证据引用：' + qr.evidenceIds.join('、') : '';
  return {
    text:
      '诊断依据来自以下三个层次（全部来自 DiagnosisReport）：\n\n' +
      '1) 主因：' + report.causes.primary + '\n\n' +
      '2) 时间线配置变更：\n  ' + (configStr || '  （无配置变更事件）') + '\n\n' +
      '3) 原因树异常节点：\n' + (abnormalStr || '  （无异常节点）') + '\n\n' +
      '数据来源：' + report.technical.dataSource + '\n' +
      '数据范围：' + report.technical.dataRange + '\n' +
      '数据更新：' + report.technical.dataUpdatedAt + refs,
    suggestions: ['建议怎么调整', '调整后观察什么']
  };
}

function buildExcluded(report) {
  if (!report.causes.excluded || report.causes.excluded.length === 0) {
    return { text: '当前没有显式标记为"已排除"的原因。原因树中没有 normal 节点生成排除表述。' };
  }
  const list = report.causes.excluded.map((e, i) => (i+1) + '. ' + e).join('\n');
  return {
    text: '已排除原因（来自 DiagnosisReport.causes.excluded）：\n\n' + list + '\n\n这些节点在原因树中判定为 normal，已不作为本次主因。',
    suggestions: ['诊断结论的依据是什么', '建议怎么调整']
  };
}

function buildRecommendation(report) {
  const rec = report.recommendations[0];
  if (!rec) return { text: '当前没有可推荐的方案。' };
  return {
    text:
      '建议方案（来自 DiagnosisReport.recommendations[0]）：\n\n' +

function buildObservation(report) {

function buildRollback(report) {

// 收集 report + record 中所有合法数字（含字符串内数字），用于校验 LLM 回答不编造数字
// 比率类（0-1）同时加入 ×100 整数与浮点，兼容 "0.6" 与 "60%"
function collectReportNumbers(report, record) {
  const nums = new Set();
  function add(n) {
    if (typeof n !== 'number' || !isFinite(n)) return;
    nums.add(n);
    if (n > 0 && n < 1) {
      nums.add(Math.round(n * 100));
      nums.add(n * 100);
    }
  }
  function walk(obj) {
    if (obj == null) return;
    if (typeof obj === 'number') { add(obj); return; }
    if (typeof obj === 'string') {
      const re = /-?\d+(?:\.\d+)?/g;
      let m;
      while ((m = re.exec(obj)) !== null) add(parseFloat(m[0]));
      return;
    }
    if (Array.isArray(obj)) { obj.forEach(walk); return; }
    if (typeof obj === 'object') { Object.keys(obj).forEach(k => walk(obj[k])); }
  }
  walk(report);
  walk(record);
  return nums;
}

// 助手 LLM 通道（顶层 · 纯函数）：独立 prompt + 校验；复用 LLM_CONFIG
function buildAssistantPrompt(question, intent, report, record, queryResult) {
  const systemPrompt = '你是 RTA 投放诊断智能参谋的问答助手。给定当前 RTA 的结构化诊断事实（DiagnosisReport）和只读查询结果（QueryResult，如有），用简洁的中文回答用户问题。要求：\n1. 只基于输入事实回答，不编造指标、不补充不存在的原因或建议\n2. 数值必须从输入 facts 或 queryResult 中读取，不允许修改或编造\n3. 主因和建议必须与 DiagnosisReport 一致\n4. 对指标/趋势/组间/配置变更查询，优先消费 queryResult，并在回答中保留 evidenceId\n5. 当问题超出当前能力（其他 RTA、行业大盘、跨时间范围），明确说明当前只能回答当前 RTA 在当前数据范围内的问题\n6. 拒绝直接执行（提价、加预算、换素材等）的请求：必须说明只能诊断和建议，不能执行\n7. 输出 JSON 严格遵守字段名，必须包含 rtaId / intent / answer 三个字段';
  const userPayload = {
    intent, rtaId: record.rtaId,
    rtaContext: {
      rtaId: record.rtaId, projectName: record.projectName, media: record.media,
      experiment: record.experiment && record.experiment.name,
      strategy: record.strategies && record.strategies[0] && record.strategies[0].name,
      dataRange: report.technical && report.technical.dataRange
    },
    diagnosisReport: {
      status: report.status,
      scenario: { sceneId: report.scenario.sceneId, sceneName: report.scenario.sceneName, phenomenonTags: report.scenario.phenomenonTags, confidence: report.scenario.confidence },
      oneLiner: report.oneLiner,
      causes: report.causes,
      impact: { budget: report.impact.budget, cost: report.impact.cost, achievementRate: report.impact.achievementRate, affectedScope: report.impact.affectedScope },
      recommendations: report.recommendations,
      technical: report.technical
    },
    queryResult: queryResult || null,
    evidenceCatalog: report.queryContext ? (report.queryContext.evidence || []).slice(0, 30).map(e => ({ evidenceId: e.evidenceId, type: e.type, label: e.label, text: e.text })) : [],
    constraints: '当前 RTA = ' + record.rtaId + '；所有引用必须来自该 RTA 的事实；不允许引用其他 RTA；不允许直接执行任何操作。'
  };
  const userPrompt = '输入（JSON）：\n' + JSON.stringify(userPayload, null, 2) + '\n\n请输出 JSON（严格遵守字段名）：\n{\n  "rtaId": "' + record.rtaId + '",\n  "intent": "' + intent + '",\n  "answer": "分类回答内容（中文，分小节，简洁，150-400 字）"\n}\n\n只返回 JSON，不要 Markdown 包裹。rtaId 必须等于输入中的 rtaId，intent 必须等于输入中的 intent。';
  return { systemPrompt, userPrompt };
}

// LLM 输出一致性校验（顶层 · 纯函数）
// 原则：DiagnosisReport 是唯一事实源；无法确认一致时拒绝，宁可回退模板
function validateAssistantOutput(output, intent, report, record, queryResult) {
  if (!output || typeof output !== 'object') return { ok: false, reason: 'not_object' };
  // rtaId 必须等于当前 record.rtaId
  if (typeof output.rtaId !== 'string' || output.rtaId !== record.rtaId) {
    return { ok: false, reason: 'rtaId_mismatch' };
  }
  // intent 必须等于当前分类结果
  if (typeof output.intent !== 'string' || output.intent !== intent) {
    return { ok: false, reason: 'intent_mismatch' };
  }
  // answer 非空字符串 + 长度合理
  if (!output.answer || typeof output.answer !== 'string') return { ok: false, reason: 'missing_answer' };
  if (output.answer.length < 20) return { ok: false, reason: 'answer_too_short' };
  if (output.answer.length > 1500) return { ok: false, reason: 'answer_too_long' };

  const answer = output.answer;

  // 回答不得包含其他 RTAID
  for (const r of listDataRecords()) {
    if (r.rtaId !== record.rtaId && answer.indexOf(r.rtaId) >= 0) {
      return { ok: false, reason: 'contains_other_rtaId' };
    }
  }

  // 关键业务数字（带 % / pp / 元）必须能在 report 或 record 中找到
  const legalNums = collectReportNumbers(report, record);
  const keyNumRe = /(\d+(?:\.\d+)?)\s*(%|pp|元)/g;
  let km;
  while ((km = keyNumRe.exec(answer)) !== null) {
    const val = parseFloat(km[1]);
    if (!legalNums.has(val)) {
      // 允许 ±0.5 浮点容差（如 0.30 vs 0.3）
      let approx = false;
      legalNums.forEach(n => { if (Math.abs(n - val) <= 0.5) approx = true; });
      if (!approx) return { ok: false, reason: 'number_not_in_report:' + val };
    }
  }

  // overview / evidence 类：不得修改 scenario / confidence / oneLiner / causes.primary
  // 检查：answer 中若出现置信度数字，必须等于 report.scenario.confidence
  if (intent === 'overview' || intent === 'evidence') {
    const confRe = /置信度[^\d]*?(\d{1,3})\s*(?:%|点|分)?/g;
    let cm;
    while ((cm = confRe.exec(answer)) !== null) {
      const c = parseInt(cm[1], 10);
      if (c !== report.scenario.confidence && c !== Math.round(report.scenario.confidence)) {
        return { ok: false, reason: 'confidence_mismatch' };
      }
    }
    // oneLiner 若被引用，必须含主因关键词（causes.primary 的核心词）
    if (report.causes && report.causes.primary && answer.indexOf('一句话结论') >= 0) {
      // 不做硬断言，仅数字与 RTAID 已校验
    }
  }

  // recommendation / observation / rollback 类：不得生成 recommendations 中不存在的动作
  if (intent === 'recommendation' || intent === 'observation' || intent === 'rollback') {
    const rec = report.recommendations && report.recommendations[0];
    const recText = rec ? String(rec.action + rec.before + rec.after + rec.rollbackCondition + (rec.observeMetrics || []).join('') + rec.successCriteria + rec.impact) : '';
    // 禁止出现 recommendations 之外的执行类动作词
    const execWords = ['提价', '加预算', '换素材', '恢复投放', '直接调', '立刻调', '马上调', '直接执行', '降价', '减预算'];
    for (const w of execWords) {
      if (answer.indexOf(w) >= 0 && recText.indexOf(w) < 0) {
        return { ok: false, reason: 'action_not_in_recommendations:' + w };
      }
    }
    // rollback 类：不得出现报告外的通用回滚条件词
    if (intent === 'rollback') {
      const genericCondWords = ['CPA 上涨超过阈值', '流量质量明显下降', '实验组参竞率持续低于目标'];
      for (const w of genericCondWords) {
        if (answer.indexOf(w) >= 0 && recText.indexOf(w) < 0) {
          return { ok: false, reason: 'rollback_condition_not_in_report:' + w };
        }
      }
    }
  }

  // v0.7 查询型回答：必须引用当前 QueryContext 中的 evidenceId
  if (intent === 'metric_query' || intent === 'trend_query' || intent === 'group_compare' || intent === 'config_query' || intent === 'evidence') {
    const allowedEvidence = new Set((report.queryContext && report.queryContext.evidence || []).map(e => e.evidenceId));
    const queryEvidence = new Set((queryResult && queryResult.evidenceIds || []));
    const refs = answer.match(/EV-[A-Z0-9_-]+/g) || [];
    if (refs.length === 0) return { ok: false, reason: 'query_answer_missing_evidence_ref' };
    for (const ref of refs) {
      if (!allowedEvidence.has(ref) && !queryEvidence.has(ref)) {
        return { ok: false, reason: 'unknown_evidence_ref:' + ref };
      }
    }
  }

  return { ok: true };
}

async function callAssistantLLM(question, intent, report, record, queryResult) {
  if (!LLM_CONFIG.enabled) return null;
  const { systemPrompt, userPrompt } = buildAssistantPrompt(question, intent, report, record, queryResult);
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), LLM_CONFIG.timeoutMs);
  let resp, text;
  try {
    resp = await fetch(LLM_CONFIG.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: LLM_CONFIG.model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ],
        temperature: LLM_CONFIG.temperature,
        response_format: { type: 'json_object' }
      }),
      signal: controller.signal
    });
    text = await resp.text();
  } catch (e) {
    clearTimeout(timer);
    return null;
  }
  clearTimeout(timer);
  if (!resp || !resp.ok) return null;
  let json;
  try { json = JSON.parse(text); } catch (e) { return null; }
  const content = json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
  if (!content) return null;
  let assistantJson;
  try { assistantJson = JSON.parse(content); } catch (e) { return null; }
  const v = validateAssistantOutput(assistantJson, intent, report, record, queryResult);
  if (!v.ok) return null;
  return { text: assistantJson.answer, suggestions: [], source: 'llm' };
}

// 顶层纯函数：完整问答流程（分类 → LLM 尝试 → 模板回退）
// askAssistant 与 _verify_assistant.cjs 共用同一函数，确保测试覆盖真实发送链路
// 原则：execute_refuse / out_of_scope / insufficient 不调 LLM，直接用确定性模板；
//       LLM 任一失败（关闭/代理未启动/网络错/超时/JSON错/校验不过）→ 回退模板
async function answerAssistantQuestion(question, report, record, llmEnabled) {
  const q = (question || '').trim();
  if (!q) return { ok: false, reason: 'empty', intent: 'empty' };
  const intent = classifyAssistantIntent(q);
  if (intent === 'empty') return { ok: false, reason: 'empty', intent };
  const queryResult = runAssistantQuery(q, intent, report, record);

  // execute_refuse / out_of_scope / 数据不足 → 不调 LLM，直接用确定性模板
  const skipLLM = (
    intent === 'execute_refuse' ||
    intent === 'out_of_scope' ||
    report.status === 'insufficient' ||
    (queryResult && (queryResult.status === 'conflict' || queryResult.status === 'insufficient' || queryResult.status === 'refused'))
  );

  let answer = null;
  if (llmEnabled && !skipLLM && report.status === 'completed') {
    try {
      answer = await callAssistantLLM(q, intent, report, record, queryResult);
    } catch (e) {
      answer = null; // 网络/超时/异常 → 回退模板
    }
  }
  if (!answer) {
    const tpl = buildAssistantTemplateAnswer(q, intent, report, record, queryResult);
    answer = { text: tpl.text, suggestions: tpl.suggestions || [], source: 'template' };
  }
  return { ok: true, intent, answer, queryResult };
}

// 顶层纯函数：裁剪消息列表，保留首条欢迎语 + 所有 system 消息 + 最近 maxTurns 轮（user+assistant 成对）
// 超出上限删除最早一轮，不会只删除单边消息。供 setup.trimSessionMessages 与测试共用
function trimAssistantMessages(messages, maxTurns) {
  if (!messages || messages.length === 0) return messages || [];
  const rounds = [];
  let i = 0;
  while (i < messages.length) {
    if (messages[i].role === 'user') {
      const round = [messages[i]];
      if (i + 1 < messages.length && messages[i + 1].role === 'assistant') {
        round.push(messages[i + 1]);
        i += 2;
      } else {
        i += 1; // 孤立 user（处理中），不计入完整轮
      }
      rounds.push(round);
    } else {
      i += 1;
    }
  }
  if (rounds.length <= maxTurns) return messages;
  const keepRounds = rounds.slice(rounds.length - maxTurns);
  const keepRefs = new Set();
  for (const r of keepRounds) for (const m of r) keepRefs.add(m);
  return messages.filter((m, idx) => {
    if (idx === 0) return true; // 首条欢迎语
    if (m.role === 'system') return true; // 切换提示等系统消息
    return keepRefs.has(m); // 最近 maxTurns 轮
  });
}

// 顶层纯函数：来源角标显示规则——template→模板，llm→AI 生成，无 source→空（只显示时间）
// 供模板渲染与测试共用
function sourceLabel(source) {
  if (source === 'template') return '模板';
  if (source === 'llm') return 'AI 生成';
  return '';
}

 * ═══════════════════════════════════════════════════════════════════════ */

function pct(n) { return (n * 100).toFixed(0) + '%'; }
function num(n) { return (typeof n === 'number' && isFinite(n)) ? n.toLocaleString('zh-CN') : '—'; }
function classifyPhenomenon(record, scenario) {
  // 列表页异常类型徽标：按现象标签返回
  if (scenario.phenomenonTags.some(t => t.id === 'P_BUDGET')) return { text: '预算未达标', tone: 'abnormal' };
  if (scenario.phenomenonTags.some(t => t.id === 'P_CPA_HIGH')) return { text: 'CPA 过高', tone: 'abnormal' };
  if (scenario.phenomenonTags.some(t => t.id === 'P_SAFE_SCALE')) return { text: '可安全放量', tone: 'good' };
  // 场景标签（卡点定位）
  const sceneMap = { S0:'配置故障', S1:'入口流量异常', S2:'命中率下降', S3:'参竞率下降', S4:'出价异常', S5:'执行异常', S6:'回传异常' };
  if (scenario.sceneId !== 'S7') return { text: sceneMap[scenario.sceneId] || '异常', tone: 'abnormal' };
  return { text: '—', tone: 'normal' };
}

function preClassify(record) {
  // 列表行预处理：跑一次轻量判定（仅用于徽标展示，不生成完整报告）
  const signals = runRules(record);
  const scenario = detectScenario(signals, record);
  return { signals, scenario, tag: classifyPhenomenon(record, scenario) };
}
