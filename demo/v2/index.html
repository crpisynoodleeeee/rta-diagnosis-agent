const glossary = {
  '参竞率': '平台同意参与竞价的请求占比',
  'RTA 超时': '媒体没有在规定时间内收到本次决策结果',

  '命中率': '请求用户中被广告主策略命中的比例',
  '放行率': '命中用户中最终被允许参与竞价的比例',
  '实验组': '应用新策略或新出价规则的流量组，用于验证策略效果',

// ───────────────────────────────────────────────────────────
const STATUS_LABEL = {
  idle: '未发起',
  reading: '读取数据中',
  diagnosing: '诊断中',
  completed: '待人工确认',
  pending_execute: '等待人工执行',
  waiting_data: '等待数据回流',
  reviewed: '复盘完成',
  insufficient: '数据不足',
  failed: '诊断失败'
}

// ───────────────────────────────────────────────────────────
// Vue 根组件
// ───────────────────────────────────────────────────────────
const App = {
  setup() {
    const drawerOpen = ref(false)
    const status = ref('idle')
    const currentRtaId = ref(null)
    const showTechnical = ref(false)
    const expandedCauseIds = reactive(new Set())
    const timers = []

    // ── 筛选状态 ──
    const filterMedia = ref('全部媒体')
    const filterDiagnosis = ref('全部状态')
    const filterSearch = ref('')
    const filterQuick = ref('全部')   // 全部 / 异常 / 预算未达标 / 完成率 < 60%

    // ── 排序 ──
    const sortBy = ref('achievementRate')
    const sortDir = ref('asc')

    const filteredList = computed(() => {
      let list = rtaRecords.slice()
      if (filterMedia.value !== '全部媒体') list = list.filter(r => r.media === filterMedia.value)
      if (filterDiagnosis.value === '需诊断') list = list.filter(r => r.diagnosisState === 'abnormal')
      else if (filterDiagnosis.value === '建议诊断') list = list.filter(r => r.diagnosisState === 'warning')
      else if (filterDiagnosis.value === '无需诊断') list = list.filter(r => r.diagnosisState === 'healthy')
      if (filterQuick.value === '异常') list = list.filter(r => r.diagnosisState !== 'healthy')
      if (filterSearch.value) {
        const q = filterSearch.value.toLowerCase()
        list = list.filter(r => r.rtaId.toLowerCase().includes(q) || r.rtaName.toLowerCase().includes(q) || r.project.toLowerCase().includes(q) || r.projectId.toLowerCase().includes(q))
      }
      list.sort((a, b) => {
        const va = a[sortBy.value]; const vb = b[sortBy.value]
        if (typeof va === 'string') return sortDir.value === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va)
        return sortDir.value === 'asc' ? va - vb : vb - va
      })
      return list
    })

    const stats = computed(() => ({
      total: rtaRecords.length,
      abnormal: rtaRecords.filter(r => r.diagnosisState === 'abnormal').length,
      warning: rtaRecords.filter(r => r.diagnosisState === 'warning').length,
      diagnosedThisMonth: 12
    }))

    const currentRecord = computed(() => {
      return rtaRecords.find(r => r.rtaId === currentRtaId.value) || rtaRecords[0]
    })

    const isProcessing = computed(() => status.value === 'reading' || status.value === 'diagnosing')

    function clearTimers() { timers.forEach(clearTimeout); timers.length = 0 }

    function startDiagnosis(rtaId) {
      clearTimers()
      currentRtaId.value = rtaId
      status.value = 'reading'
      drawerOpen.value = true
      showTechnical.value = false
      // 默认展开「参竞率是否下降」
      expandedCauseIds.clear()
      expandedCauseIds.add('bidrate')
      timers.push(setTimeout(() => { if (status.value === 'reading') status.value = 'diagnosing' }, 1200))
      timers.push(setTimeout(() => { if (status.value === 'diagnosing') status.value = 'completed' }, 3000))
    }
    function approve() { if (status.value === 'completed') status.value = 'pending_execute' }
    function modify() { if (status.value === 'completed') status.value = 'pending_execute' }
    function reject() { status.value = 'failed' }
    function markExecuted() { if (status.value === 'pending_execute') status.value = 'waiting_data' }
    function markReviewed() { if (status.value === 'waiting_data') status.value = 'reviewed' }
    function retry() {
      if (status.value === 'failed' || status.value === 'insufficient' || status.value === 'reviewed') {
        if (currentRtaId.value) startDiagnosis(currentRtaId.value)
      }
    }
    function closeDrawer() {
      drawerOpen.value = false
      clearTimers()
    }
    function toggleCause(id) {
      if (expandedCauseIds.has(id)) expandedCauseIds.delete(id)
      else expandedCauseIds.add(id)
    }
    function toggleTechnical() { showTechnical.value = !showTechnical.value }

    function fmtYuan(n) { return '¥' + n.toLocaleString('zh-CN') }
    function fmtRate(r) { return Math.round(r * 100) + '%' }
    function rateTone(r) {
      if (r >= 0.8) return 'bg-emerald-400'
      if (r >= 0.5) return 'bg-amber-400'
      return 'bg-rose-400'
    }
    function statusBadgeClass(s) {
      const map = {
        idle: 'bg-ink-100 text-ink-600',
        reading: 'bg-brand-50 text-brand-600',
        diagnosing: 'bg-brand-50 text-brand-600',
        completed: 'bg-amber-50 text-amber-600',
        pending_execute: 'bg-amber-50 text-amber-600',
        waiting_data: 'bg-brand-50 text-brand-600',
        reviewed: 'bg-emerald-50 text-emerald-600',
        insufficient: 'bg-ink-100 text-ink-600',
        failed: 'bg-rose-50 text-rose-500'
      }
      return map[s] || 'bg-ink-100 text-ink-600'
    }
    function diagnosisBadgeClass(state) {
      if (state === 'abnormal') return 'bg-rose-50 text-rose-500 border-rose-100'
      if (state === 'warning') return 'bg-amber-50 text-amber-600 border-amber-100'
      return 'bg-emerald-50 text-emerald-600 border-emerald-100'
    }
    function diagnosisDotClass(state) {
      if (state === 'abnormal') return 'bg-rose-400'
      if (state === 'warning') return 'bg-amber-400'
      return 'bg-emerald-400'
    }
    function causeTone(result) {
      if (result === 'abnormal') return { dot:'bg-rose-400', text:'text-rose-500', bg:'bg-rose-50', border:'border-rose-200', label:'异常' }
      return { dot:'bg-emerald-400', text:'text-emerald-600', bg:'bg-emerald-50', border:'border-emerald-100', label:'正常' }
    }
    function impactTone(impact) {
      if (impact === 'high') return 'bg-rose-50 text-rose-500'
      if (impact === 'medium') return 'bg-amber-50 text-amber-600'
      return 'bg-ink-50 text-ink-500'
    }

    function handleSort(key) {
      if (sortBy.value === key) sortDir.value = sortDir.value === 'asc' ? 'desc' : 'asc'
      else { sortBy.value = key; sortDir.value = 'asc' }
    }

    return {
      rtaRecords, goldenReport, glossary, mediaList,
      drawerOpen, status, currentRtaId, currentRecord,
      showTechnical, expandedCauseIds,
      filterMedia, filterDiagnosis, filterSearch, filterQuick,

                  <a class="num text-brand-600 font-medium hover:text-brand-700 cursor-pointer">{{ row.rtaId }}</a>
                </td>
                <td class="px-3 h-12 text-ink-800">
                  <div class="flex items-center gap-1.5">
                    <span class="inline-block w-1.5 h-1.5 rounded-full" :class="diagnosisDotClass(row.diagnosisState)"></span>
                    {{ row.media }}
                  </div>
                </td>
                <td class="px-3 h-12">
                  <div class="flex flex-col">
                    <span class="text-ink-800 truncate">{{ row.mediaAccount }}</span>
                    <span class="text-[11px] text-ink-400 num">{{ row.mediaAccountId }}</span>
                  </div>
                </td>
                <td class="px-3 h-12">
                  <div class="flex flex-col min-w-0">
                    <span class="text-ink-800 truncate">{{ row.project }}</span>
                    <span class="text-[11px] text-ink-400 num">{{ row.projectId }}</span>
                  </div>
                </td>
                <td class="px-3 h-12">
                  <span class="inline-flex items-center gap-1 px-1.5 h-5 text-[11px] font-medium rounded bg-emerald-50 text-emerald-600">
                    <span class="inline-block w-1 h-1 rounded-full bg-emerald-500"></span>{{ row.status }}
                  </span>
                </td>
                <td class="px-3 h-12 text-center num text-ink-700">{{ row.experimentCount }}</td>
                <td class="px-3 h-12 text-ink-700">{{ row.currentStrategy }}</td>
                <td class="px-3 h-12 text-right num text-ink-800 font-medium">{{ fmtYuan(row.dailyBudget) }}</td>
                <td class="px-3 h-12 text-right num text-ink-800 font-medium" :class="row.diagnosisState === 'abnormal' ? 'text-rose-500' : ''">{{ fmtYuan(row.actualCost) }}</td>
                <td class="px-3 h-12" style="min-width: 160px">
                  <div class="flex items-center gap-2">
                    <div class="flex-1 h-1.5 bg-ink-100 rounded-full overflow-hidden">
                      <div class="h-full rounded-full transition-all" :class="rateTone(row.achievementRate)" :style="{ width: Math.max(2, row.achievementRate * 100) + '%' }"></div>
                    </div>
                    <span class="num text-[12px] text-ink-700 w-9 text-right">{{ fmtRate(row.achievementRate) }}</span>
                  </div>
                </td>
                <td class="px-3 h-12">
                  <span class="inline-flex items-center gap-1 px-1.5 h-5 text-[11px] font-medium rounded border" :class="diagnosisBadgeClass(row.diagnosisState)">
                    <span class="inline-block w-1 h-1 rounded-full" :class="diagnosisDotClass(row.diagnosisState)"></span>{{ row.diagnosisBadge }}
                  </span>
                </td>
                <td class="px-3 h-12">
                  <div class="flex items-center justify-end gap-2">
                    <button class="text-[12px] text-ink-500 hover:text-ink-800 px-1.5 h-6 rounded">查看</button>
                    <button v-if="row.diagnosisState === 'abnormal'" @click="startDiagnosis(row.rtaId)"
                      class="inline-flex items-center gap-1 px-2 h-7 text-[12px] font-medium rounded bg-brand-500 text-white border border-brand-500 hover:bg-brand-600">
                      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>
                      发起诊断
                    </button>
                    <button v-else-if="row.diagnosisState === 'warning'" @click="startDiagnosis(row.rtaId)"
                      class="inline-flex items-center gap-1 px-2 h-7 text-[12px] font-medium rounded bg-white text-brand-600 border border-brand-300 hover:bg-brand-50">
                      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>
                      诊断
                    </button>
                    <button v-else class="text-[12px] text-ink-400 hover:text-ink-700 px-1.5 h-6 rounded cursor-default">—</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
          <!-- 分页 -->
          <div class="flex items-center justify-between px-3 h-10 text-[12px] text-ink-500 border-t border-ink-100">
            <span>共 <span class="num font-medium text-ink-700">{{ filteredList.length }}</span> 项 · 诊断状态基于近 24 小时数据</span>
            <div class="flex items-center gap-3">
              <div class="flex items-center gap-1">
                <button class="inline-flex items-center justify-center w-7 h-7 rounded text-ink-500 hover:bg-ink-100">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <button class="inline-flex items-center justify-center w-7 h-7 rounded text-ink-500 hover:bg-ink-100">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
              </div>
              <div>
                <span class="num text-ink-700">1</span>
                <span class="mx-1 text-ink-300">/</span>
                <span class="num text-ink-700">1</span>
              </div>
              <div class="flex items-center gap-1.5">
                <span>10 条/页</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>
          </div>
        </div>

        <!-- 底部信息条 -->
        <div class="mt-3 flex items-center gap-3 text-[12px] text-ink-500">
          <span class="inline-flex items-center gap-1.5">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-500"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg>
            <span><strong class="text-ink-700">Agent 边界</strong> · 仅读取数据 + 分析原因 + 生成建议，不会直接修改真实投放配置。最终配置变更需由人工审批后执行。</span>
          </span>
        </div>
      </main>
    </div>

    <!-- ░░░░░░░░░░░░░░░░░░░░ 右侧诊断抽屉 ░░░░░░░░░░░░░░░░░░░░ -->
    <!-- 遮罩 -->
    <transition name="fade">
      <div v-if="drawerOpen" class="fixed inset-0 z-40 bg-ink-900/30 fadein" @click="closeDrawer"></div>
    </transition>

    <transition name="drawer-slide">
      <aside v-if="drawerOpen" class="fixed top-0 right-0 bottom-0 z-50 bg-white shadow-drawer flex flex-col slidein" style="width:720px" role="dialog" aria-label="RTA 投放诊断面板">

        <!-- ░░ 抽屉头部 ░░ -->
        <header class="px-5 pt-3 pb-3 border-b border-ink-200 bg-white shrink-0">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2 text-[12px] text-ink-500 mb-1">
                <span>{{ currentRecord.media }}</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-ink-300"><polyline points="9 18 15 12 9 6"/></svg>
                <span>{{ currentRecord.project }}</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-ink-300"><polyline points="9 18 15 12 9 6"/></svg>
                <span class="num">{{ currentRecord.rtaId }}</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="inline-flex items-center justify-center w-7 h-7 rounded bg-brand-50 text-brand-600">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
                </span>
                <h2 class="text-[16px] font-semibold text-ink-800 tracking-tight">RTA 投放诊断</h2>
                <span class="inline-flex items-center gap-1 px-1.5 h-5 text-[11px] font-medium rounded" :class="statusBadgeClass(status)">
                  <span v-if="isProcessing" class="inline-block w-1 h-1 rounded-full bg-current spin"></span>
                  {{ STATUS_LABEL[status] }}
                </span>
              </div>
            </div>
            <button class="inline-flex items-center justify-center w-8 h-8 rounded text-ink-500 hover:bg-ink-100" @click="closeDrawer" aria-label="关闭">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>

          <!-- 抽屉顶部元信息 -->
          <div v-if="!isProcessing && status !== 'idle'" class="grid grid-cols-2 gap-x-4 gap-y-1.5 mt-3 px-3 py-2.5 bg-ink-50 rounded border border-ink-200">
            <div class="flex items-baseline gap-2 min-w-0">
              <span class="text-[11px] text-ink-500 shrink-0 w-16">诊断日期</span>
              <span class="num text-[13px] font-medium text-ink-800">2026-08-14</span>
            </div>
            <div class="flex items-baseline gap-2 min-w-0">
              <span class="text-[11px] text-ink-500 shrink-0 w-16">RTA 名称</span>
              <span class="text-[13px] font-medium text-ink-800 truncate">{{ currentRecord.rtaName }}</span>
            </div>
            <div class="flex items-baseline gap-2 min-w-0">
              <span class="text-[11px] text-ink-500 shrink-0 w-16">媒体</span>
              <span class="text-[13px] font-medium text-ink-800">{{ currentRecord.media }}</span>
            </div>
            <div class="flex items-baseline gap-2 min-w-0">
              <span class="text-[11px] text-ink-500 shrink-0 w-16">账户</span>
              <span class="text-[13px] font-medium text-ink-800 truncate">{{ currentRecord.mediaAccount }}</span>
            </div>
          </div>
        </header>

        <!-- ░░ 读取数据中 / 诊断中 ░░ -->
        <div v-if="isProcessing" class="flex-1 flex flex-col items-center justify-center px-10 py-12 text-center">
          <div class="relative w-16 h-16 mb-5">
            <span class="absolute inset-0 rounded-full bg-brand-50"></span>
            <span class="absolute inset-2 rounded-full bg-brand-100"></span>
            <span class="absolute inset-0 rounded-full border-2 border-brand-200 border-t-brand-500 spin"></span>
            <span class="absolute inset-0 flex items-center justify-center text-brand-600">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            </span>
          </div>
          <h3 class="text-[15px] font-semibold text-ink-800 mb-1.5">
            {{ status === 'reading' ? '正在读取策略、实验、QPS 与执行日志…' : 'Agent 正在综合多信号判断跑量根因…' }}
          </h3>
          <p class="text-[13px] text-ink-500 max-w-sm leading-relaxed">
            {{ status === 'reading' ? '已确认项目、媒体账户、RTAID、实验配置，正在拉取近 24 小时请求、命中、参竞和消耗数据。' : '正在交叉比对实验组 / 对照组参竞率、曝光与消耗曲线，逐步收缩可疑根因。' }}
          </p>
          <div class="w-72 mt-6">
            <div class="h-1 bg-ink-100 rounded-full overflow-hidden">
              <div class="h-full bg-brand-500 rounded-full transition-all duration-700" :style="{ width: status === 'reading' ? '33%' : '66%' }"></div>
            </div>
            <div class="flex justify-between mt-1.5 text-[11px] text-ink-400 num">
              <span :class="status==='reading' ? 'text-brand-600 font-medium' : ''">读取数据</span>
              <span :class="status==='diagnosing' ? 'text-brand-600 font-medium' : ''">综合诊断</span>
              <span>输出方案</span>
            </div>
          </div>
        </div>

        <!-- ░░ 数据不足 ░░ -->
        <div v-else-if="status === 'insufficient'" class="flex-1 flex flex-col items-center justify-center px-10 py-12 text-center">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-ink-300 mb-4"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <h3 class="text-[15px] font-semibold text-ink-800 mb-2">当前数据不足以判断根因</h3>
          <p class="text-[13px] text-ink-500 max-w-sm mb-6 leading-relaxed">实验组近 1 小时请求量较低，且执行日志缺失；建议等待 30 分钟或补充监控后重新诊断。</p>
          <button class="inline-flex items-center gap-1.5 px-3 h-8 text-[13px] font-medium rounded border bg-white text-ink-700 border-ink-200 hover:border-ink-300" @click="retry">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>30 分钟后重新诊断
          </button>
        </div>

        <!-- ░░ 诊断失败 ░░ -->
        <div v-else-if="status === 'failed'" class="flex-1 flex flex-col items-center justify-center px-10 py-12 text-center">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-rose-500 mb-4"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          <h3 class="text-[15px] font-semibold text-ink-800 mb-2">诊断未通过</h3>
          <p class="text-[13px] text-ink-500 max-w-sm mb-6 leading-relaxed">方案被人工拒绝，或信号冲突；可以查看上下文或重新发起诊断。</p>
          <div class="flex items-center gap-2">
            <button class="inline-flex items-center gap-1.5 px-3 h-8 text-[13px] font-medium rounded border bg-white text-ink-700 border-ink-200" @click="closeDrawer">关闭</button>
            <button class="inline-flex items-center gap-1.5 px-3 h-8 text-[13px] font-medium rounded bg-brand-500 text-white border border-brand-500 hover:bg-brand-600" @click="retry">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>重新诊断
            </button>
          </div>
        </div>

        <!-- ░░ 等待人工执行 ░░ -->
        <div v-else-if="status === 'pending_execute'" class="flex-1 flex items-center justify-center px-10">
          <div class="text-center max-w-md">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-500 mx-auto mb-4"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg>
            <h3 class="text-[15px] font-semibold text-ink-800 mb-2">已生成配置草稿，等待人工执行</h3>
            <p class="text-[13px] text-ink-500 mb-5 leading-relaxed">本次诊断仅生成策略草稿，<strong class="text-amber-600">未修改任何真实预算或出价</strong>。请到 策略工厂 / RTA 实验 页面审批通过该变更。</p>
            <div class="rounded-md border border-ink-200 bg-ink-50 p-3 text-left mb-5">
              <p class="text-[12px] text-ink-700 leading-relaxed"><span class="font-medium text-ink-800">草稿摘要：</span>{{ goldenReport.recommendation.action }}观察参竞率、实际消耗、CPA 三项指标。</p>
            </div>
            <button class="inline-flex items-center gap-1.5 px-3 h-8 text-[13px] font-medium rounded bg-brand-500 text-white border border-brand-500 hover:bg-brand-600" @click="markExecuted">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>我已执行，等待数据回流
            </button>
          </div>
        </div>

        <!-- ░░ 等待数据回流 ░░ -->
        <div v-else-if="status === 'waiting_data'" class="flex-1 flex items-center justify-center px-10">
          <div class="text-center max-w-md">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand-500 mx-auto mb-4"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
            <h3 class="text-[15px] font-semibold text-ink-800 mb-2">策略已生效，正在等待数据回流</h3>
            <p class="text-[13px] text-ink-500 mb-5 leading-relaxed">期望 2 小时内观察到实验组参竞率回升、消耗增长。回流数据齐全后将进入复盘。</p>
            <div class="grid grid-cols-3 gap-2 text-left mb-5">
              <div class="rounded-md border border-ink-200 p-2.5 bg-white">
                <p class="text-[11px] text-ink-500">实验组参竞率</p>
                <p class="num text-[15px] font-medium text-emerald-600 mt-0.5">10% → 48%</p>
              </div>
              <div class="rounded-md border border-ink-200 p-2.5 bg-white">
                <p class="text-[11px] text-ink-500">实验组消耗</p>
                <p class="num text-[15px] font-medium text-emerald-600 mt-0.5">+62%</p>
              </div>
              <div class="rounded-md border border-ink-200 p-2.5 bg-white">
                <p class="text-[11px] text-ink-500">实验组 CPA</p>
                <p class="num text-[15px] font-medium text-ink-700 mt-0.5">¥31</p>
              </div>
            </div>
            <button class="inline-flex items-center gap-1.5 px-3 h-8 text-[13px] font-medium rounded border bg-white text-ink-700 border-ink-200 hover:border-ink-300" @click="markReviewed">手动完成复盘</button>
          </div>
        </div>

        <!-- ░░ 复盘完成 ░░ -->
        <div v-else-if="status === 'reviewed'" class="flex-1 flex items-center justify-center px-10">
          <div class="text-center max-w-md">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-500 mx-auto mb-4"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <h3 class="text-[15px] font-semibold text-ink-800 mb-2">复盘完成 · 实验已归档</h3>
            <p class="text-[13px] text-ink-500 mb-5 leading-relaxed">实验组准入门槛调整有效，预计 24 小时内项目预算达成率回升至 80%+。本次诊断结果已沉淀到历史案例。</p>
            <div class="grid grid-cols-2 gap-2 text-left mb-5">
              <div class="rounded-md border border-ink-200 p-3 bg-white">
                <p class="text-[11px] text-ink-500 mb-1">实验组最终参竞率</p>
                <p class="num text-[18px] font-semibold text-emerald-600">62%</p>
              </div>
              <div class="rounded-md border border-ink-200 p-3 bg-white">
                <p class="text-[11px] text-ink-500 mb-1">项目预算达成率</p>
                <p class="num text-[18px] font-semibold text-emerald-600">84%</p>
              </div>
            </div>
            <div class="flex items-center justify-center gap-2">
              <button class="inline-flex items-center gap-1.5 px-3 h-8 text-[13px] font-medium rounded border bg-white text-ink-700 border-ink-200" @click="closeDrawer">关闭</button>
              <button class="inline-flex items-center gap-1.5 px-3 h-8 text-[13px] font-medium rounded border bg-white text-ink-700 border-ink-200" @click="retry">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>再诊断一次
              </button>
            </div>
          </div>
        </div>

        <!-- ░░ 诊断完成主区 ░░ -->
        <div v-else-if="status === 'completed'" class="flex-1 min-h-0 overflow-y-auto px-5 py-5">

          <!-- 1 · 诊断结论 -->
          <section class="mb-5">
            <h3 class="text-[13px] font-semibold text-ink-800 tracking-tight mb-2 flex items-center gap-1.5">
              <span class="w-1 h-3 bg-brand-500 rounded-sm"></span>01 · 诊断结论
            </h3>
            <p class="text-[13px] font-medium text-ink-800 leading-relaxed bg-brand-50 border-l-2 border-brand-500 px-3 py-2.5 rounded">{{ goldenReport.oneLiner }}</p>
            <details class="mt-2 group">
              <summary class="text-[12px] text-brand-600 hover:text-brand-700 cursor-pointer select-none flex items-center gap-1">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="transition-transform group-open:rotate-90"><polyline points="9 18 15 12 9 6"/></svg>
                查看管理摘要（面向老板 / 非专业同事）
              </summary>
              <p class="text-[12px] text-ink-600 leading-relaxed mt-2 px-3 py-2 bg-ink-50 rounded">{{ goldenReport.managerSummary }}</p>
            </details>
          </section>

          <!-- 2 · 影响概览 -->
          <section class="mb-5">
            <h3 class="text-[13px] font-semibold text-ink-800 tracking-tight mb-2 flex items-center gap-1.5">
              <span class="w-1 h-3 bg-brand-500 rounded-sm"></span>02 · 影响概览
            </h3>
            <div class="grid grid-cols-4 gap-2">
              <div class="border border-ink-200 rounded px-2.5 py-2">
                <p class="text-[11px] text-ink-500">日预算</p>
                <p class="num text-[14px] font-medium text-ink-800 mt-0.5">{{ fmtYuan(goldenReport.impact.budget) }}</p>
              </div>
              <div class="border border-ink-200 rounded px-2.5 py-2">
                <p class="text-[11px] text-ink-500">实际消耗</p>
                <p class="num text-[14px] font-medium text-ink-800 mt-0.5">{{ fmtYuan(goldenReport.impact.cost) }}</p>
              </div>
              <div class="border border-rose-200 rounded px-2.5 py-2 bg-rose-50/50">
                <p class="text-[11px] text-rose-600">未消耗金额</p>
                <p class="num text-[14px] font-medium text-rose-500 mt-0.5">{{ fmtYuan(goldenReport.impact.gap) }}</p>
              </div>
              <div class="border border-rose-200 rounded px-2.5 py-2 bg-rose-50/50">
                <p class="text-[11px] text-rose-600">预算完成率</p>
                <p class="num text-[14px] font-medium text-rose-500 mt-0.5">{{ fmtRate(goldenReport.impact.achievementRate) }}</p>
              </div>
              <div class="border border-ink-200 rounded px-2.5 py-2">
                <p class="text-[11px] text-ink-500">请求量</p>
                <p class="num text-[14px] font-medium text-ink-800 mt-0.5">{{ goldenReport.impact.request.toLocaleString('zh-CN') }}</p>
              </div>
              <div class="border border-rose-200 rounded px-2.5 py-2 bg-rose-50/50">
                <p class="text-[11px] text-rose-600">实验组参竞率</p>
                <p class="num text-[14px] font-medium text-rose-500 mt-0.5">{{ fmtRate(goldenReport.impact.treatmentBidRate) }}</p>
              </div>
              <div class="border border-ink-200 rounded px-2.5 py-2">
                <p class="text-[11px] text-ink-500">对照组参竞率</p>
                <p class="num text-[14px] font-medium text-ink-800 mt-0.5">{{ fmtRate(goldenReport.impact.controlBidRate) }}</p>
              </div>
              <div class="border border-ink-200 rounded px-2.5 py-2">
                <p class="text-[11px] text-ink-500">CPA 对比</p>
                <p class="text-[14px] font-medium text-emerald-600 mt-0.5">{{ goldenReport.impact.cpaNote }}</p>
              </div>
            </div>
            <p class="text-[11px] text-ink-500 mt-2">影响范围：<span class="text-ink-700">{{ goldenReport.impact.affectedScope }}</span></p>
          </section>

          <!-- 3 · 原因排序 -->
          <section class="mb-5">
            <h3 class="text-[13px] font-semibold text-ink-800 tracking-tight mb-2 flex items-center gap-1.5">
              <span class="w-1 h-3 bg-brand-500 rounded-sm"></span>03 · 原因排序
            </h3>
            <div class="space-y-1.5">
              <div v-for="c in goldenReport.causes" :key="c.rank" class="flex items-baseline gap-2 text-[13px] leading-relaxed">
                <span class="inline-flex items-center gap-1 px-1.5 h-5 text-[11px] font-medium rounded shrink-0"
                  :class="c.rank === 1 ? 'bg-rose-50 text-rose-500' : (c.rank === 2 ? 'bg-amber-50 text-amber-600' : 'bg-ink-50 text-ink-500')">
                  {{ c.rank === 1 ? '主因' : (c.rank === 2 ? '次因' : '已排除') }}
                </span>
                <span class="text-ink-800 font-medium">{{ c.label }}</span>
                <span class="text-ink-400 text-[12px]">· 置信度 {{ c.confidence }}</span>
                <span class="text-ink-400 text-[12px]">· {{ c.impact }}</span>
              </div>
              <div class="rounded-md bg-ink-50 border border-ink-200 px-3 py-2 mt-2">
                <p class="text-[11px] text-ink-500 mb-1">主因详细说明</p>
                <p class="text-[12px] text-ink-700 leading-relaxed">{{ goldenReport.causes[0].detail }}</p>
              </div>
            </div>
          </section>

          <!-- 4 · 证据时间线 -->
          <section class="mb-5">
            <h3 class="text-[13px] font-semibold text-ink-800 tracking-tight mb-3 flex items-center gap-1.5">
              <span class="w-1 h-3 bg-brand-500 rounded-sm"></span>04 · 证据时间线
            </h3>
            <ol class="relative">
              <span class="absolute left-[15px] top-2 bottom-2 w-px bg-ink-200" aria-hidden="true"></span>
              <li v-for="(e, i) in goldenReport.timeline" :key="i" class="relative flex gap-3 pb-3 last:pb-0">
                <span class="relative z-10 w-8 h-8 inline-flex items-center justify-center rounded-full border bg-white shrink-0"
                  :class="{
                    'text-amber-600 bg-amber-50 border-amber-200': e.category === 'config',
                    'text-brand-500 bg-brand-50 border-brand-100': e.category === 'metric',
                    'text-rose-500 bg-rose-50 border-rose-100': e.category === 'cost'
                  }">
                  <svg v-if="e.category === 'config'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                  <svg v-else-if="e.category === 'metric'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                  <svg v-else width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </span>
                <div class="flex-1 min-w-0 pt-1">
                  <div class="flex items-baseline gap-2">
                    <span class="num text-[11px] font-medium text-ink-700">{{ e.time }}</span>
                    <span class="text-[13px] font-medium text-ink-800 truncate">{{ e.label }}</span>
                    <span v-if="e.value" class="num text-[11px] font-medium text-amber-600 shrink-0">{{ e.value }}</span>
                  </div>
                  <p v-if="e.detail" class="text-[11px] text-ink-500 mt-0.5 leading-relaxed">{{ e.detail }}</p>
                </div>
              </li>
            </ol>
          </section>

          <!-- 5 · 原因树 -->
          <section class="mb-5">
            <h3 class="text-[13px] font-semibold text-ink-800 tracking-tight mb-2 flex items-center gap-1.5">
              <span class="w-1 h-3 bg-brand-500 rounded-sm"></span>05 · 原因树详情
            </h3>
            <p class="text-[11px] text-ink-500 mb-2.5">按 6 个常见根因层逐一排查，点击节点展开证据与关键指标。</p>
            <div class="space-y-1.5">
              <div v-for="node in goldenReport.causeTree" :key="node.id" class="border rounded-md overflow-hidden" :class="causeTone(node.result).border">
                <button class="w-full flex items-center gap-2 px-3 py-2 text-left bg-white hover:bg-ink-50/50 transition-colors" @click="toggleCause(node.id)">
                  <span class="inline-block w-1.5 h-1.5 rounded-full shrink-0" :class="causeTone(node.result).dot"></span>
                  <span class="text-[13px] font-medium text-ink-800 flex-1 text-left truncate">{{ node.label }}</span>
                  <span class="inline-flex items-center px-1.5 h-5 text-[10px] font-medium rounded shrink-0" :class="causeTone(node.result).bg + ' ' + causeTone(node.result).text">{{ causeTone(node.result).label }}</span>
                  <span class="inline-flex items-center px-1.5 h-5 text-[10px] font-medium rounded bg-ink-50 text-ink-500 shrink-0">置信度 <span class="num ml-0.5">{{ node.confidence }}%</span></span>
                  <span class="inline-flex items-center px-1.5 h-5 text-[10px] font-medium rounded shrink-0" :class="impactTone(node.impact)">{{ node.impact === 'high' ? '高影响' : (node.impact === 'medium' ? '中影响' : '低影响') }}</span>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-ink-400 transition-transform shrink-0" :class="expandedCauseIds.has(node.id) ? 'rotate-90' : ''"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
                <div v-if="expandedCauseIds.has(node.id)" class="px-3 pb-3 pt-1 bg-ink-50/40 border-t border-ink-100 fadein">
                  <p class="text-[12px] text-ink-700 leading-relaxed mt-2">{{ node.detail }}</p>
                  <div v-if="node.children && node.children.length" class="ml-2 mt-2 space-y-1 border-l border-ink-200 pl-3">
                    <div v-for="(c, ci) in node.children" :key="ci" class="flex items-baseline gap-2 text-[12px]">
                      <span class="inline-block w-1 h-1 rounded-full shrink-0" :class="c.result === 'abnormal' ? 'bg-rose-400' : 'bg-emerald-400'"></span>
                      <span class="text-ink-700">{{ c.label }}</span>
                      <span class="text-ink-400 text-[11px] ml-auto">{{ c.note }}</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- 6 · 建议方案 -->
          <section class="mb-5">
            <h3 class="text-[13px] font-semibold text-ink-800 tracking-tight mb-2 flex items-center gap-1.5">
              <span class="w-1 h-3 bg-brand-500 rounded-sm"></span>06 · 建议方案
            </h3>
            <div class="border border-ink-200 rounded bg-white p-3">
              <p class="text-[13px] font-medium text-ink-800 leading-relaxed">{{ goldenReport.recommendation.action }}</p>
              <div class="grid grid-cols-3 gap-3 text-[12px] pt-2 mt-2 border-t border-ink-100">
                <div>
                  <p class="text-[11px] text-ink-500 mb-1">观察指标</p>
                  <div class="flex flex-wrap gap-1">
                    <span v-for="m in goldenReport.recommendation.observeMetrics" :key="m" class="inline-flex items-center px-1.5 h-5 text-[11px] font-medium rounded bg-ink-50 text-ink-700">{{ m }}</span>
                  </div>
                </div>
                <div>
                  <p class="text-[11px] text-ink-500 mb-1">成功标准</p>
                  <ul class="space-y-0.5">
                    <li v-for="s in goldenReport.recommendation.successCriteria" :key="s" class="flex gap-1 text-ink-700"><span class="text-emerald-500">·</span>{{ s }}</li>
                  </ul>
                </div>
                <div>
                  <p class="text-[11px] text-ink-500 mb-1">回滚条件</p>
                  <ul class="space-y-0.5">
                    <li v-for="r in goldenReport.recommendation.rollbackConditions" :key="r" class="flex gap-1 text-ink-700"><span class="text-rose-500">·</span>{{ r }}</li>
                  </ul>
                </div>
              </div>
            </div>
            <p class="text-[12px] text-ink-500 mt-2 leading-relaxed bg-amber-50 border-l-2 border-amber-400 px-2.5 py-1.5 rounded">
              <strong class="text-amber-600">人工边界：</strong>该方案不会修改任何真实预算或出价。批准后仅生成待执行草稿，仍需到 策略工厂 / RTA 实验 页面人工审批。
            </p>
          </section>

          <!-- 7 · 人工确认 + 技术详情 -->
          <section class="mb-3">
            <h3 class="text-[13px] font-semibold text-ink-800 tracking-tight mb-2 flex items-center gap-1.5">
              <span class="w-1 h-3 bg-brand-500 rounded-sm"></span>07 · 人工确认 & 技术详情
            </h3>
            <div class="border border-ink-200 rounded p-3 bg-ink-50/40">
              <p class="text-[12px] text-ink-700 leading-relaxed">
                <span class="font-medium text-ink-800">Agent 边界声明：</span>
                Agent 只负责读取数据、分析原因、生成建议，不会直接修改任何真实投放配置。最终配置变更由人工审批并执行。
              </p>
            </div>
            <button class="inline-flex items-center gap-1 text-[12px] font-medium text-brand-600 hover:text-brand-700 mt-2" @click="toggleTechnical">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="transition-transform" :class="showTechnical ? 'rotate-90' : ''"><polyline points="9 18 15 12 9 6"/></svg>
              {{ showTechnical ? '收起' : '展开' }}技术证据（RTA ID / 实验 ID / 分桶 / 请求 ID / 策略版本 / 数据来源…）
            </button>
            <div v-if="showTechnical" class="mt-2 fadein">
              <div class="border border-ink-200 rounded p-3 space-y-1.5 bg-white">
                <div class="flex items-baseline gap-3 text-[12px]"><span class="text-ink-500 w-32 shrink-0">媒体侧 RTA ID</span><span class="num text-ink-800 font-medium bg-ink-50 px-1.5 py-0.5 rounded">{{ goldenReport.technical.rtaId }}</span></div>
                <div class="flex items-baseline gap-3 text-[12px]"><span class="text-ink-500 w-32 shrink-0">内部 RTA 资源 ID</span><span class="num text-ink-800 font-medium bg-ink-50 px-1.5 py-0.5 rounded">{{ goldenReport.technical.rtaInternalId }}</span></div>
                <div class="flex items-baseline gap-3 text-[12px]"><span class="text-ink-500 w-32 shrink-0">实验 ID</span><span class="num text-ink-800 font-medium bg-ink-50 px-1.5 py-0.5 rounded">{{ goldenReport.technical.experimentId }}</span></div>
                <div class="flex items-baseline gap-3 text-[12px]"><span class="text-ink-500 w-32 shrink-0">对照组 ID</span><span class="num text-ink-800 font-medium bg-ink-50 px-1.5 py-0.5 rounded">{{ goldenReport.technical.controlGroupId }}</span></div>
                <div class="flex items-baseline gap-3 text-[12px]"><span class="text-ink-500 w-32 shrink-0">实验组 ID</span><span class="num text-ink-800 font-medium bg-ink-50 px-1.5 py-0.5 rounded">{{ goldenReport.technical.treatmentGroupId }}</span></div>
                <div class="flex items-baseline gap-3 text-[12px]"><span class="text-ink-500 w-32 shrink-0">实验组分桶</span><span class="num text-ink-800 font-medium bg-ink-50 px-1.5 py-0.5 rounded">[{{ goldenReport.technical.bucketIds }}]</span></div>
                <div class="flex items-baseline gap-3 text-[12px]"><span class="text-ink-500 w-32 shrink-0">代表请求 ID</span><span class="num text-ink-800 font-medium bg-ink-50 px-1.5 py-0.5 rounded break-all">{{ goldenReport.technical.requestId }}</span></div>
                <div class="flex items-baseline gap-3 text-[12px]"><span class="text-ink-500 w-32 shrink-0">策略版本</span><span class="num text-ink-800 font-medium bg-ink-50 px-1.5 py-0.5 rounded">{{ goldenReport.technical.policyVersion }}</span></div>
                <div class="flex items-baseline gap-3 text-[12px]"><span class="text-ink-500 w-32 shrink-0">日志字段路径</span><span class="num text-ink-800 font-medium bg-ink-50 px-1.5 py-0.5 rounded break-all">{{ goldenReport.technical.logFieldPath }}</span></div>
              </div>
              <div class="mt-2 border border-ink-200 rounded p-3 bg-white">
                <div class="flex items-baseline gap-3 text-[12px]"><span class="text-ink-500 w-32 shrink-0">数据来源</span><span class="text-ink-700">{{ goldenReport.technical.dataSource }}</span></div>
                <div class="flex items-baseline gap-3 text-[12px] mt-1"><span class="text-ink-500 w-32 shrink-0">数据更新时间</span><span class="num text-ink-700">{{ goldenReport.technical.dataUpdatedAt }}</span></div>
              </div>
              <p class="text-[11px] text-ink-400 px-1 mt-1.5">注：所有字段均为 Mock 值，真实接入前需与媒体开放平台联调确认。</p>
            </div>
          </section>

          <!-- 术语对照 -->
          <section class="border-t border-ink-200 pt-3 mt-3">
            <p class="text-[11px] text-ink-400 mb-2">术语对照（行业黑话 ↔ 业务解释）</p>
            <div class="grid grid-cols-2 gap-x-4 gap-y-1">
              <div v-for="(desc, term) in glossary" :key="term" class="flex items-baseline gap-1.5 text-[11px] leading-relaxed">
                <span class="text-ink-700 font-medium shrink-0">{{ term }}</span>
                <span class="text-ink-400">— {{ desc }}</span>
              </div>
            </div>
          </section>
        </div>

        <!-- ░░ 抽屉底部固定操作区 ░░ -->
        <footer v-if="['completed','pending_execute','waiting_data'].includes(status)" class="px-5 py-3 border-t border-ink-200 bg-white shrink-0 flex items-center gap-2">
          <div class="flex-1 text-[12px] text-ink-500">
            <template v-if="status === 'completed'">请审阅方案草稿。批准后仅生成待执行草稿，不会自动修改真实配置。</template>
            <template v-else-if="status === 'pending_execute'">等待运营人员执行配置变更。系统不会自动改写任何线上数据。</template>
            <template v-else>预期 2 小时后系统将自动拉取数据并生成复盘报告。</template>
          </div>
          <button v-if="status === 'completed'" class="inline-flex items-center gap-1.5 px-3 h-8 text-[13px] font-medium rounded border bg-white text-ink-700 border-ink-200 hover:border-ink-300" @click="modify">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>修改方案
          </button>
          <button v-if="status === 'completed'" class="inline-flex items-center gap-1.5 px-3 h-8 text-[13px] font-medium rounded border bg-white text-rose-500 border-rose-200 hover:bg-rose-50" @click="reject">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>拒绝
          </button>
          <button v-if="status === 'completed'" class="inline-flex items-center gap-1.5 px-3 h-8 text-[13px] font-medium rounded bg-brand-500 text-white border border-brand-500 hover:bg-brand-600" @click="approve">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>批准方案
          </button>
          <button v-if="status === 'pending_execute'" class="inline-flex items-center gap-1.5 px-3 h-8 text-[13px] font-medium rounded bg-brand-500 text-white border border-brand-500 hover:bg-brand-600" @click="markExecuted">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>确认已执行，等待数据回流
          </button>
          <button v-if="status === 'waiting_data'" class="inline-flex items-center gap-1.5 px-3 h-8 text-[13px] font-medium rounded bg-brand-500 text-white border border-brand-500 hover:bg-brand-600" @click="markReviewed">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>手动完成复盘
          </button>
        </footer>
      </aside>
    </transition>
  </div>
  `
}

createApp(App).mount('#app')
</script>

<style>
.drawer-slide-enter-active, .drawer-slide-leave-active { transition: transform .32s cubic-bezier(0.16, 1, 0.3, 1), opacity .2s ease; }
.drawer-slide-enter-from, .drawer-slide-leave-to { transform: translateX(40px); opacity: 0; }
.fade-enter-active, .fade-leave-active { transition: opacity .2s ease; }
.fade-enter-from, .fade-leave-to { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  .drawer-slide-enter-active, .drawer-slide-leave-active,
  .fade-enter-active, .fade-leave-active { transition: none !important; }
}
</style>
</body>
</html>
